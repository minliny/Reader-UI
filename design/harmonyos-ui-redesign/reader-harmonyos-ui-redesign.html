    function renderSourceSingleCheckModal(modal) {
      const item = modal.item;
      const report = item.report;
      const steps = modal.steps || report?.steps || SOURCE_CHECK_LEVELS.map((label, index) => ({
        level: 'L' + (index + 1), label, status: 'pending', detail: '待检测',
      }));
      const stageLabels = {
        active: ['检测中', 'primary'],
        pending: ['待测', 'muted'],
        not_requested: ['未请求', 'muted'],
        blocked: ['中止', 'muted'],
        pass: ['通过', 'success'],
        fail: ['失败', 'danger'],
      };
      const lines = steps.map((step, index) => {
        const active = modal.run && modal.currentStage === step.level;
        const [badge, tone] = stageLabels[active ? 'active' : step.status];
        const background = tone === 'muted' ? 'var(--rd-sunken)' : 'var(--rd-' + tone + '-soft)';
        return `
          <div class="flex items-center gap-2.5 px-3 py-2" style="${index ? 'border-top:1px solid var(--rd-line);' : ''}">
            <span class="w-7 h-6 shrink-0 grid place-items-center rounded-[6px] text-[11px] font-bold rd-num" style="background:${background};color:var(--rd-${tone});">${step.level}</span>
            <div class="min-w-0 flex-1">
              <div class="text-[12.5px] font-semibold" style="color:var(--rd-ink);">${escHtml(step.label)}</div>
              <div class="text-[11px]" style="color:var(--rd-${tone === 'danger' ? tone : 'muted'});">${escHtml(active ? '正在检测…' : step.detail)}</div>
            </div>
            <span class="shrink-0 rounded-full px-2 py-0.5 text-[10.5px] font-semibold" style="background:${background};color:var(--rd-${tone});">${badge}</span>
          </div>`;
      }).join('');
      const reportHistory = report && !modal.run
        ? report.mode === 'explore' ? '发现' : '搜索「' + report.keyword + '」'
        : '';
      const subtitle = [item.group || '未分组', reportHistory, '示例检测'].filter(Boolean).join(' · ');
      return sourceModalFrame(item.name, `
        <div class="space-y-3">
          <div class="flex items-center justify-between gap-2">
            ${modal.run
              ? '<span class="text-[12px] font-semibold" style="color:var(--rd-primary);">检测中</span>'
              : renderSourceCheckBadge(report)}
            ${modal.stopped ? '<span class="shrink-0 text-[11px]" style="color:var(--rd-muted);">已停止</span>' : ''}
          </div>
          <div class="rounded-[14px] border overflow-hidden" style="background:var(--rd-surface);border-color:var(--rd-line);">${lines}</div>
          ${modal.readOnly ? '' : renderSourceCheckSettings(modal.settings, { prefix: 'source-check', quickWords: true, disabled: !!modal.run })}
        </div>`, renderSourceCheckFooter(modal, '返回'), subtitle);
    }

    function renderSourceBatchCheckModal(modal) {
      const completed = modal.results.length;
      const total = modal.items.length;
      const passed = modal.results.filter(result => result.report.available).length;
      const label = modal.phase === 'running'
        ? '检测中 ' + Math.min(completed + 1, total) + '/' + total + (modal.currentItem ? ' · ' + modal.currentItem.name + ' · ' + modal.currentStage : '')
        : (modal.phase === 'stopped' ? '已停止' : '检测完成') + ' · ' + completed + '/' + total;
      return sourceModalFrame(modal.title, `
        <div class="space-y-3">
          ${renderSourceCheckSettings(modal.settings, { prefix: 'source-check', disabled: !!modal.run })}
          ${modal.phase === 'idle' ? '' : renderSourceCheckProgress(
            { completed, total }, label,
            `<b style="color:var(--rd-success);">通过 ${passed}</b> · <b style="color:var(--rd-danger);">失败 ${completed - passed}</b>`,
          )}
          ${completed ? `<div class="rounded-[14px] border overflow-hidden" style="background:var(--rd-surface);border-color:var(--rd-line);">
            ${modal.results.map(({ item, report }, index) => `<button type="button" data-source-action="source-check-batch-report" data-index="${index}" class="w-full flex items-center gap-2 justify-between px-3 py-2.5 text-left rd-pressable" style="${index ? 'border-top:1px solid var(--rd-line);' : ''}">
              <span class="min-w-0 flex-1 truncate text-[13px] font-semibold" style="color:var(--rd-ink);">${escHtml(item.name)}</span>
              ${renderSourceCheckBadge(report)} ${icon('chevronRight', 12, 'var(--rd-muted)')}
            </button>`).join('')}
          </div>` : ''}
        </div>`, renderSourceCheckFooter(modal, '关闭'), '共 ' + total + ' 个书源 · 示例检测');
    }

    function renderSourceCheckModal() {
      const modal = state.sourceModal;
      if (modal?.kind === 'check-report') return renderSourceSingleCheckModal(modal);
      if (modal?.kind === 'batch-check') return renderSourceBatchCheckModal(modal);
      return '';
    }

    function handleSourceCheckAction(action, el) {
      const modal = state.sourceModal;
      if (action === 'source-check-open') {
        openSourceCheck(state.sourceItems.find(item => item.id === el.dataset.id));
        return true;
      }
      if (!modal || !['check-report', 'batch-check'].includes(modal.kind)) return false;
      if (action === 'source-check-start') {
        startSourceCheckModal(modal);
      } else if (action === 'source-check-stop') {
        modal.run?.stop();
      } else if (action === 'source-check-setting') {
        if (modal.run) return true;
        const { field, value } = el.dataset;
        modal.settings[field] = field === 'depth' ? Number(value) : value;
        render();
      } else if (action === 'source-check-batch-report') {
        const result = modal.results?.[Number(el.dataset.index)];
        if (result) {
          openSourceCheck(result.item, {
            readOnly: !!modal.run,
            onReport(report) { result.report = report; },
          });
        }
      } else {
        return false;
      }
      return true;
    }

    function handleSourceCheckInput(name, el) {
      if (name !== 'source-check-keyword') return false;
      const modal = state.sourceModal;
      if (modal?.settings && !modal.run) modal.settings.keyword = el.value;
      return true;
    }

    function createSourceListState() {
      return {
        sourceSearch: '',
        sourceGroup: null,
        sourceFilter: 'all',
        sourceCategory: 'all',
        sourcePopover: '',
        sourceBatchMode: false,
        sourceSelectedIds: [],
        sourceActiveGroup: '',
        sourceLoginSession: null
      };
    }

    function getSourceListScope() {
      const query = state.sourceSearch.trim().toLowerCase();
      return state.sourceItems.filter(source =>
        (state.sourceGroup === null || source.group === state.sourceGroup) &&
        (state.sourceCategory === 'all' || source.category === state.sourceCategory) &&
        (!query || [source.name, sourceDisplayUrl(source), source.group].some(value => value.toLowerCase().includes(query)))
      );
    }

    const SOURCE_STATUS_FILTERS = [
      ['all', '全部', () => true],
      ['enabled', '已启用', source => source.enabled],
      ['disabled', '已停用', source => !source.enabled],
      ['error', '异常', source => source.checkState === 'failed']
    ];

    function getFilteredSources(scope = getSourceListScope()) {
      return scope.filter(SOURCE_STATUS_FILTERS.find(([key]) => key === state.sourceFilter)[2]);
    }

    function sourceDisplayUrl(source) {
      const url = new URL(source.sourceUrl || 'https://' + source.host);
      return url.pathname === '/' && !url.search && !url.hash ? url.origin : url.href;
    }

    function sourceAction(action, value) {
      return `data-source-action="${action}"${value === undefined ? '' : ` data-value="${escapeAttr(value)}"`}`;
    }

    function renderSourceBackButton(backExpr) {
      return `<button type="button" onclick="${backExpr}" aria-label="返回" class="w-11 h-11 rounded-full grid place-items-center rd-pressable" style="color:var(--rd-ink);">${icon('arrowLeft', 20)}</button>`;
    }

    function renderSourceActionButton(action, label, options = {}) {
      const { value, ico, primary = false, danger = false, soft = false, disabled = false, className = '' } = options;
      const colors = primary
        ? 'background:var(--rd-primary);color:var(--rd-on-primary);border-color:var(--rd-primary);'
        : soft
          ? 'background:var(--rd-primary-soft);color:var(--rd-primary);border-color:transparent;'
          : `background:var(--rd-surface);color:var(${danger ? '--rd-danger' : '--rd-ink'});border-color:var(--rd-line-strong);`;
      return `<button type="button" ${sourceAction(action, value)} class="inline-flex shrink-0 items-center justify-center gap-1 rounded-full h-8 px-3 border text-[12px] font-semibold whitespace-nowrap rd-pressable disabled:opacity-45 ${className}" style="${colors}" ${disabled ? 'disabled' : ''}>${ico ? icon(ico, 15) : ''}${escHtml(label)}</button>`;
    }

    function renderSourceToggle(on, action, value, label, disabled = false) {
      return renderToggle(on, '', `${sourceAction(action, value)} role="switch" aria-checked="${on}" aria-label="${escapeAttr(label)}" ${disabled ? 'disabled style="opacity:.45"' : ''}`);
    }

    function renderSourceSelectionMark(checked) {
      const style = checked
        ? 'background:var(--rd-primary);color:var(--rd-on-primary);border-color:var(--rd-primary);'
        : 'background:var(--rd-surface);border-color:var(--rd-line-strong);color:transparent;';
      return `<span aria-hidden="true" class="w-5 h-5 rounded-full shrink-0 border flex items-center justify-center" style="${style}">${icon('check', 12)}</span>`;
    }

    function renderSourceLoginStatus(source) {
      const status = source.loggedIn ? '已登录' : (source.report?.authFailed ? '需登录验证' : '未登录');
      const tone = source.loggedIn ? 'success' : (source.report?.authFailed ? 'danger' : '');
      const color = tone ? `var(--rd-${tone})` : 'var(--rd-muted)';
      const background = tone ? `var(--rd-${tone}-soft)` : 'var(--rd-sunken)';
      const glyph = source.loggedIn ? '✓' : (source.report?.authFailed ? '×' : '?');
      return `<button type="button" ${sourceAction('source-login', source.id)} title="${status}" aria-label="${status}，打开登录页" class="w-[58px] h-[26px] rounded-full shrink-0 inline-flex items-center justify-center gap-1 text-[11px] font-semibold border rd-pressable" style="background:${background};color:${color};border-color:var(--rd-line-strong);">
        <span aria-hidden="true" class="w-[13px] h-[13px] rounded-full border border-current inline-flex items-center justify-center text-[9px] leading-none">${glyph}</span>
        <span>登录</span>
      </button>`;
    }

    function renderSourceRows(items, { batch = false, group = false, ungrouped = false } = {}) {
      if (!items.length) {
        const label = group ? '当前分组暂无书源' : (state.sourceItems.length ? '没有匹配的书源' : '暂无书源');
        return `<div class="rounded-[14px] px-4 py-9 border text-center text-[14px] font-medium" style="background:var(--rd-surface);color:var(--rd-muted);border-color:var(--rd-line);">${label}</div>`;
      }

      return `<div class="rounded-[14px] overflow-hidden border" style="background:var(--rd-surface);border-color:var(--rd-line);box-shadow:var(--rd-e1-shadow);">
        ${items.map((source, index) => {
          const comic = source.category === 'comic';
          const url = sourceDisplayUrl(source);
          const checked = state.sourceSelectedIds.includes(source.id);
          const stamp = `<span aria-hidden="true" class="w-[34px] h-[34px] rounded-[10px] border shrink-0 flex items-center justify-center text-[14px] font-bold" style="background:var(${comic ? '--rd-warning-soft' : '--rd-primary-soft'});color:var(${comic ? '--rd-warning' : '--rd-primary'});border-color:var(${comic ? '--rd-line' : '--rd-primary-border'});">${comic ? '漫' : '文'}</span>`;
          return `<div class="flex items-center gap-1.5 px-2.5 py-2.5 ${index ? 'border-t' : ''}" style="border-color:var(--rd-line);">
            <button type="button" ${sourceAction(batch ? 'toggle-source-selected' : 'check-source', source.id)} ${batch ? `aria-pressed="${checked}"` : ''} class="flex min-w-0 flex-1 items-center gap-2 text-left rd-pressable">
              ${batch ? renderSourceSelectionMark(checked) : stamp}
              <span class="block min-w-0">
                <span class="block truncate text-[14px] font-semibold" style="color:var(--rd-ink);" title="${escapeAttr(source.name)}">${escHtml(source.name)}</span>
                <span class="block truncate mt-0.5 text-[11px] rd-num" style="color:var(--rd-subtle);" title="${escapeAttr(url)}">${escHtml(url)}</span>
              </span>
            </button>
            ${batch ? `<span class="text-[11.5px] shrink-0" style="color:var(${source.enabled ? '--rd-success' : '--rd-subtle'});">${source.enabled ? '已启用' : '已停用'}</span>` : `
              <div class="flex items-center gap-1.5 shrink-0">
                ${!group && source.needLogin ? renderSourceLoginStatus(source) : ''}
                ${renderSourceCheckButton(source)}
                ${group ? renderSourceActionButton('move-source', ungrouped ? '归入分组' : '移动', {value: source.id, className:'!h-[26px] !px-2 !text-[11px]'}) : ''}
                ${group && !ungrouped ? renderSourceActionButton('remove-source-group', '移出', {value: source.id, danger: true, className:'!h-[26px] !px-2 !text-[11px]'}) : ''}
                ${renderSourceToggle(source.enabled, 'toggle-source-enabled', source.id, `启用${source.name}`)}
              </div>`}
          </div>`;
        }).join('')}
      </div>`;
    }

    function renderSourceStatusFilters(scope) {
      return SOURCE_STATUS_FILTERS.map(([key, label, match]) => {
        const active = state.sourceFilter === key;
        return `<button type="button" ${sourceAction('source-status-filter', key)} aria-pressed="${active}" class="h-7 rounded-full border min-w-0 whitespace-nowrap px-1 text-[11.5px] font-medium rd-pressable" style="
          ${active ? 'background:var(--rd-primary);color:var(--rd-on-primary);border-color:var(--rd-primary);' : 'background:var(--rd-surface);color:var(--rd-muted);border-color:var(--rd-line-strong);'}">${label} <span class="rd-num">${scope.filter(match).length}</span></button>`;
      }).join('');
    }

    function renderSourcePopover(menu, entries) {
      if (state.sourcePopover !== menu) return '';
      return `<div class="absolute right-0 top-full mt-1.5 z-30 w-44 max-h-64 overflow-y-auto rd-scroll rounded-[14px] border py-1 ${state.overlayAnim === 'reduced' ? 'anim-page-reduced' : (state.overlayAnim === 'dropdown' ? 'anim-dropdown-tr' : '')}" style="background:var(--rd-elevated);border-color:var(--rd-line);box-shadow:var(--rd-e3-shadow);">
        ${entries.map(({action, value, label, ico, selected}) => `<button type="button" ${sourceAction(action, value)} class="w-full min-h-9 px-3 text-left flex items-center gap-2 rd-pressable text-[13px]" style="color:var(${selected ? '--rd-primary' : '--rd-ink'});">
          ${ico ? icon(ico, 15) : ''}<span class="min-w-0 flex-1 truncate">${escHtml(label)}</span>${selected ? icon('check', 14) : ''}
        </button>`).join('')}
      </div>`;
    }

    function sourceSelectAllLabel(items) {
      return items.length && items.every(source => state.sourceSelectedIds.includes(source.id)) ? '取消全选' : '全选';
    }

    function renderSourceList(showBack) {
      const scope = getSourceListScope();
      const items = getFilteredSources(scope);
      const batch = state.sourceBatchMode;
      const tablet = state.device === 'tablet';
      const padding = tablet ? 'px-5' : 'px-4';
      const groupLabel = state.sourceGroup === null ? '全部分组' : state.sourceGroup || '未分组';
      const menu = `<div class="relative">
        <button type="button" ${sourceAction('source-popover', 'more')} aria-label="书源管理更多操作" aria-expanded="${state.sourcePopover === 'more'}" class="w-11 h-11 rounded-full grid place-items-center rd-pressable" style="color:var(--rd-ink);">${icon('moreH', 19)}</button>
        ${renderSourcePopover('more', [
          {action:'source-route', value:'subscriptions', label:'书源订阅', ico:'cloud'},
          {action:'source-route', value:'groups', label:'分组管理', ico:'folder'},
          {action:'check-source-scope', label:'批量检测', ico:'waveLine'},
          {action:'export-sources', label:'导出全部书源', ico:'upload'}
        ])}
      </div>`;
      const header = batch
        ? renderFloatingTopBar(
          `<button type="button" ${sourceAction('exit-source-batch')} class="h-11 px-2 rounded-full text-[13px] font-medium rd-pressable" style="color:var(--rd-ink);">取消</button>`,
          `已选 ${state.sourceSelectedIds.length} 项`,
          `<button id="source-select-all" type="button" ${sourceAction('select-source-scope')} class="h-11 px-2 rounded-full text-[13px] font-semibold whitespace-nowrap rd-pressable" style="color:var(--rd-primary);">${sourceSelectAllLabel(items)}</button>`,
          '', false, 'rd-source-top-bar rd-source-top-bar-actions')
        : renderFloatingTopBar(showBack ? renderSourceBackButton("navBack('settings')") : '', '书源管理', menu,
          '', false, 'rd-source-top-bar');

      const status = `<div id="source-status-filters" class="grid grid-cols-4 gap-1.5">${renderSourceStatusFilters(scope)}</div>`;
      const types = `<div class="grid grid-cols-3 p-0.5 h-8 rounded-[10px]" style="background:var(--rd-sunken);">
        ${[['all','全部'],['novel','小说'],['comic','漫画']].map(([key,label]) => {
          const active = state.sourceCategory === key;
          return `<button type="button" ${sourceAction('source-category-filter', key)} aria-pressed="${active}" class="rounded-[8px] text-[12px] font-medium rd-pressable" style="${active ? 'background:var(--rd-surface);color:var(--rd-ink);box-shadow:var(--rd-e1-shadow);' : 'color:var(--rd-muted);'}">${label}</button>`;
        }).join('')}
      </div>`;
      const groupEntries = [
        {action:'source-group-all', label:'全部分组', selected:state.sourceGroup === null},
        {action:'source-group-filter', label:'未分组', value:'', selected:state.sourceGroup === ''},
        ...state.sourceGroups.map(group => ({action:'source-group-filter', label:group, value:group, selected:state.sourceGroup === group})),
        {action:'source-route', value:'groups', label:'管理分组', ico:'settings'}
      ];
      const filters = `<div class="${padding} pt-2.5 pb-2 shrink-0 space-y-2">
        <div class="flex items-center gap-2">
          <div class="flex-1 min-w-0 h-10 px-2.5 rounded-[10px] border flex items-center gap-2" style="background:var(--rd-sunken);border-color:var(--rd-line-strong);">
            <span class="shrink-0" style="color:var(--rd-subtle);">${icon('search', 15)}</span>
            <input id="source-search-input" data-source-input="source-search" type="text" value="${escapeAttr(state.sourceSearch)}" aria-label="搜索书源" placeholder="搜索书源名称、域名" class="w-full min-w-0 bg-transparent border-0 outline-none text-[13px] select-text" style="color:var(--rd-ink);">
            <button id="source-search-clear" type="button" ${sourceAction('clear-source-search')} class="w-5 h-5 rounded-full shrink-0 items-center justify-center rd-pressable" style="display:${state.sourceSearch ? 'inline-flex' : 'none'};background:var(--rd-line-strong);color:var(--rd-ink);" aria-label="清空搜索">${icon('close', 11)}</button>
          </div>
          <div class="relative ${state.sourcePopover === 'group' ? 'z-20' : ''}">
            <button type="button" ${sourceAction('source-popover', 'group')} class="h-10 max-w-[132px] px-3 rounded-[10px] border flex items-center gap-1.5 text-[13px] font-medium rd-pressable" style="background:var(--rd-sunken);color:var(--rd-ink);border-color:var(--rd-line-strong);" aria-expanded="${state.sourcePopover === 'group'}">
              <span class="truncate">${escHtml(groupLabel)}</span><span class="shrink-0" style="color:var(--rd-muted);">${icon('chevronDown', 14)}</span>
            </button>
            ${renderSourcePopover('group', groupEntries)}
          </div>
        </div>
        ${status}
        ${types}
      </div>`;
      const footer = batch ? `<div class="grid grid-cols-5 h-[54px] px-1.5 rounded-full border" style="background:var(--rd-elevated);border-color:var(--rd-line-strong);box-shadow:var(--rd-e2-shadow);">
        ${[
          ['batch-source-enable','启用','checkCircle','--rd-primary'],
          ['batch-source-disable','停用','pause','--rd-muted'],
          ['batch-source-move','移至分组','folder','--rd-ink'],
          ['batch-source-check','检测','waveLine','--rd-primary'],
          ['batch-source-delete','删除','trash','--rd-danger']
        ].map(([action,label,ico,color]) => `<button type="button" ${sourceAction(action)} ${state.sourceSelectedIds.length ? '' : 'disabled'} class="rounded-full flex flex-col items-center justify-center gap-0.5 text-[10.5px] font-semibold whitespace-nowrap rd-pressable disabled:opacity-45" style="color:var(${color});">${icon(ico, 16)}<span>${label}</span></button>`).join('')}
      </div>` : `<div class="flex gap-2.5">
        ${renderSourceActionButton('enter-source-batch', '批量管理', {className:'w-[112px] !h-11 !text-[13.5px]'})}
        ${renderSourceActionButton('source-route', '导入书源', {value:'import', ico:'plus', primary:true, className:'flex-1 min-w-0 !h-11 !text-[14px]'})}
      </div>`;
      return `
        ${state.sourcePopover ? `<button type="button" tabindex="-1" aria-label="关闭菜单" ${sourceAction('close-source-popover')} class="absolute inset-0 z-10 w-full"></button>` : ''}
        ${header}
        ${filters}
        <div id="source-list-scroll" data-source-scroll="source-list" class="flex-1 min-h-0 overflow-y-auto rd-scroll ${padding} pt-1 pb-3">
          <div id="source-list-rows">${renderSourceRows(items, {batch})}</div>
        </div>
        <div class="${padding} pt-2 pb-3 shrink-0" style="background:var(--rd-canvas);">${footer}</div>`;
    }

    function sourceGroupMembers(group = state.sourceActiveGroup) {
      return state.sourceItems.filter(source => source.group === group);
    }

    function renderSourceGroups() {
      function groupRow(group, isUngrouped) {
        const items = sourceGroupMembers(group);
        const enabled = items.filter(source => source.enabled).length;
        const title = isUngrouped ? '未分组书源' : group;
        return `<div class="flex items-center gap-2.5 rounded-[14px] border px-3.5 py-3" style="background:var(--rd-surface);border-color:var(--rd-line);box-shadow:var(--rd-e1-shadow);">
          <button type="button" ${sourceAction('open-source-group', group)} class="flex flex-1 min-w-0 items-center gap-3 text-left rd-pressable">
            <span class="w-9 h-9 shrink-0 rounded-[10px] flex items-center justify-center" style="background:var(--rd-sunken);color:var(${isUngrouped ? '--rd-muted' : '--rd-primary'});">${icon('folder', 17)}</span>
            <span class="flex-1 min-w-0">
              <span class="block text-[14.5px] font-semibold truncate" style="color:var(--rd-ink);">${escHtml(title)}</span>
              <span class="block mt-0.5 text-[11.5px]" style="color:var(--rd-muted);">共 ${items.length} 个 · 已启用 ${enabled} 个</span>
            </span>
            <span class="shrink-0" style="color:var(--rd-subtle);">${icon('chevronRight', 15)}</span>
          </button>
          ${isUngrouped ? '' : renderSourceToggle(items.length > 0 && enabled === items.length, 'toggle-source-group', group, `启用${group}全部书源`, !items.length)}
        </div>`;
      }
      return `
        ${renderFloatingTopBar(renderSourceBackButton("navBack('sources')"), '分组管理',
          renderSourceActionButton('new-source-group', '新建', {ico:'plus', soft:true}),
          '', false, 'rd-source-top-bar rd-source-top-bar-actions')}
        <div data-source-scroll="source-groups" class="flex-1 min-h-0 overflow-y-auto rd-scroll px-4 py-3 space-y-2.5">
          ${state.sourceGroups.map(group => groupRow(group, false)).join('')}
          ${groupRow('', true)}
        </div>`;
    }

    function renderSourceGroupDetail() {
      const group = state.sourceActiveGroup;
      const ungrouped = !group;
      const items = sourceGroupMembers();
      const right = ungrouped
        ? renderSourceActionButton('batch-ungrouped', '批量归组', {soft:true, disabled:!items.length, className:'!px-2.5'})
        : renderSourceActionButton('add-source-group-members', '添加', {ico:'plus', soft:true, className:'!px-2'});
      return `
        ${renderFloatingTopBar(renderSourceBackButton("navBack('sources')"), escHtml(group || '未分组书源'), right,
          '', false, `rd-source-top-bar ${ungrouped ? 'rd-source-top-bar-ungrouped' : 'rd-source-top-bar-detail'}`)}
        <div class="flex flex-wrap items-center gap-2 shrink-0 px-4 pt-3 pb-2">
          ${renderSourceActionButton('check-source-group', '整组检测', {primary:true, disabled:!items.length})}
          ${renderSourceActionButton('source-group-enable', '全部启用', {disabled:!items.length})}
          ${renderSourceActionButton('source-group-disable', '全部停用', {disabled:!items.length})}
          ${ungrouped ? '' : renderSourceActionButton('rename-source-group', '重命名') + renderSourceActionButton('delete-source-group', '删除分组', {danger:true})}
        </div>
        <div data-source-scroll="source-group-detail" class="flex-1 min-h-0 overflow-y-auto rd-scroll px-4 pt-1 pb-4">
          ${renderSourceRows(items, {group:true, ungrouped})}
        </div>`;
    }

    function renderSourceGroupCandidates(modal) {
      const query = (modal.query || '').trim().toLowerCase();
      const items = state.sourceItems.filter(source =>
        (modal.kind !== 'add-to-group' || source.group !== modal.group) &&
        (!query || [source.name, sourceDisplayUrl(source), source.group].some(value => value.toLowerCase().includes(query)))
      );
      if (!items.length) return '<div class="px-3 py-4 text-center text-[12px]" style="color:var(--rd-muted);">没有可选书源</div>';
      return items.map(source => {
        const selected = modal.selectedIds.includes(source.id);
        return `<button type="button" ${sourceAction('select-group-candidate', source.id)} aria-pressed="${selected}" class="w-full px-3 py-2 flex items-center gap-2 text-left rounded-[10px] rd-pressable">
          ${renderSourceSelectionMark(selected)}
          <span class="min-w-0 flex-1">
            <span class="block text-[13px] font-medium truncate" style="color:var(--rd-ink);">${escHtml(source.name)}</span>
            <span class="block text-[11px] truncate" style="color:var(--rd-subtle);">${escHtml(sourceDisplayUrl(source))}</span>
          </span>
          ${source.group ? `<span class="max-w-[82px] text-[11px] truncate" style="color:var(--rd-muted);">${escHtml(source.group)}</span>` : ''}
        </button>`;
      }).join('');
    }

    function renderSourceGroupField(input, value, label, placeholder, validationAttrs = '') {
      return `<input id="source-field-${input}" data-source-input="${input}" type="text" value="${escapeAttr(value)}" aria-label="${label}" placeholder="${placeholder}" ${validationAttrs} class="w-full h-10 rounded-[10px] border px-3 text-[13px] select-text" style="background:var(--rd-sunken);color:var(--rd-ink);border-color:var(--rd-line-strong);">`;
    }

    function renderSourceGroupNameField(modal, label = '分组名称') {
      const error = sourceGroupNameError(modal);
      return `${renderSourceGroupField('group-name', modal.name, label, label,
        `aria-describedby="source-group-name-error" aria-invalid="${Boolean(error)}"`)}
        <p id="source-group-name-error" aria-live="polite" ${error ? '' : 'hidden'} class="mt-1 text-[12px]" style="color:var(--rd-danger);">${escHtml(error)}</p>`;
    }

    function renderSourceGroupOverlay() {
      const modal = state.sourceModal;
      if (!modal) return '';
      const cancel = renderSourceActionButton('close-source-modal', '取消');
      const footer = button => `<div class="grid grid-cols-2 gap-2.5">${cancel}${button}</div>`;
      switch (modal.kind) {
        case 'create-group':
          return sourceModalFrame('新建分组', `
            ${renderSourceGroupNameField(modal)}
            <div class="mt-3 mb-1 text-[12px] font-semibold" style="color:var(--rd-muted);">添加首批成员（可选）</div>
            <div data-source-scroll="source-new-group-candidates" class="max-h-52 overflow-y-auto rd-scroll">${renderSourceGroupCandidates(modal)}</div>`,
            footer(renderSourceActionButton('save-source-group', '创建分组', {primary:true, disabled:Boolean(sourceGroupNameError(modal))})));
        case 'rename-group':
          return sourceModalFrame('重命名分组', renderSourceGroupNameField(modal),
            footer(renderSourceActionButton('save-source-group', '保存', {primary:true, disabled:Boolean(sourceGroupNameError(modal))})));
        case 'delete-group':
          return sourceModalFrame('删除分组', `<p class="text-[13px]" style="color:var(--rd-muted);">删除「${escHtml(modal.group)}」后，成员将移入未分组。</p>`,
            footer(renderSourceActionButton('confirm-delete-source-group', '删除分组', {danger:true})));
        case 'add-to-group':
          return sourceModalFrame('添加书源', `${renderSourceGroupField('group-query', modal.query, '搜索书源', '搜索书源名称、域名')}
            <div id="source-group-candidates" data-source-scroll="source-add-group-candidates" class="max-h-52 overflow-y-auto rd-scroll mt-2">${renderSourceGroupCandidates(modal)}</div>`,
            footer(renderSourceActionButton('confirm-add-source-group', `添加 (${modal.selectedIds.length})`, {primary:true, disabled:!modal.selectedIds.length})));
        case 'move-group':
          return sourceModalFrame('移至分组', `
            <div class="max-h-48 overflow-y-auto rd-scroll space-y-1">
              ${['', ...state.sourceGroups].map(group => `<button type="button" ${sourceAction('pick-source-group', group)} aria-pressed="${modal.targetGroup === group}" class="w-full h-9 rounded-full px-3 flex items-center gap-2 text-left text-[13px] rd-pressable" style="background:var(--rd-sunken);color:var(--rd-ink);">
                ${renderSourceSelectionMark(modal.targetGroup === group)}<span class="truncate">${escHtml(group || '未分组')}</span></button>`).join('')}
              <button type="button" ${sourceAction('pick-new-source-group')} aria-pressed="${modal.targetGroup === null}" class="w-full h-9 rounded-full px-3 flex items-center gap-2 text-left text-[13px] font-medium rd-pressable" style="background:var(--rd-primary-soft);color:var(--rd-primary);">
                ${renderSourceSelectionMark(modal.targetGroup === null)}新建分组
              </button>
            </div>
            ${modal.targetGroup === null ? `<div class="mt-2">${renderSourceGroupNameField(modal, '新分组名称')}</div>` : ''}`,
            footer(renderSourceActionButton('confirm-move-source-group', '移动', {primary:true, disabled:modal.targetGroup === null && Boolean(sourceGroupNameError(modal))})));
        case 'delete-sources':
          return sourceModalFrame('删除书源', `<p class="text-[13px]" style="color:var(--rd-muted);">确定删除选中的 ${modal.sourceIds.length} 个书源？</p>`,
            footer(renderSourceActionButton('confirm-delete-sources', '删除', {danger:true})));
        default:
          return '';
      }
    }

    function prepareSourceLogin(sourceId) {
      const source = state.sourceItems.find(item => item.id === sourceId && item.needLogin);
      if (!source) return false;
      state.sourceLoginSession = {
        sourceId: source.id,
        account: '',
        authenticated: source.loggedIn,
        history: [source.loggedIn ? 'session' : 'form'],
        historyIndex: 0,
        loading: false,
        loadingTimer: null
      };
      return true;
    }

    function renderSourceLogin() {
      const session = state.sourceLoginSession;
      const source = session && state.sourceItems.find(item => item.id === session.sourceId);
      if (!source) return renderFloatingTopBar(renderSourceBackButton("navBack('sources')"), '书源登录', '', '', false, 'rd-source-top-bar');
      const page = session.history[session.historyIndex];
      const baseUrl = new URL(source.sourceUrl || sourceDisplayUrl(source));
      const lock = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>';
      return `<div class="h-12 px-3 grid grid-cols-[60px_minmax(0,1fr)_60px] items-center gap-2 shrink-0 border-b" style="background:var(--rd-surface);border-color:var(--rd-line);">
          <button type="button" ${sourceAction('cancel-source-login')} class="justify-self-start h-11 px-2 rounded-full text-[13px] font-medium rd-pressable" style="color:var(--rd-primary);">取消</button>
          <div class="min-w-0 text-center">
            <h1 class="text-[14.5px] font-bold truncate" style="color:var(--rd-ink);">${escHtml(source.name)} · 登录 / 验证</h1>
            <div class="text-[10.5px] flex items-center justify-center gap-1" style="color:var(--rd-muted);">${baseUrl.protocol === 'https:' ? `<span class="shrink-0">${lock}</span>` : ''}<span class="truncate">${escHtml(baseUrl.hostname)}</span></div>
          </div>
          ${renderSourceActionButton('finish-source-login', '完成', {primary:true, className:'justify-self-end'})}
        </div>
        ${session.loading ? '<div class="h-0.5 w-2/3 shrink-0" style="background:var(--rd-primary);"></div>' : ''}
        <div data-source-scroll="source-login" class="flex-1 min-h-0 overflow-y-auto rd-scroll p-4" style="background:var(--rd-canvas);">
          <div class="mx-auto max-w-[420px] rounded-[14px] border p-5 space-y-3" style="background:var(--rd-elevated);border-color:var(--rd-line);box-shadow:var(--rd-e1-shadow);">
            <div class="flex items-center gap-3">
              <span class="w-10 h-10 rounded-[10px] shrink-0 flex items-center justify-center text-[17px] font-bold" style="background:var(--rd-primary-soft);color:var(--rd-primary);">${escHtml(source.name.slice(0,1))}</span>
              <div class="min-w-0">
                <h2 class="text-[15px] font-bold truncate" style="color:var(--rd-ink);">${escHtml(page === 'session' ? session.account || '已验证访客' : source.name + ' 登录示例')}</h2>
                <div class="text-[11.5px] truncate" style="color:var(--rd-muted);">${page === 'session' ? '已登录 · ' : ''}${escHtml(baseUrl.host)}</div>
              </div>
            </div>
            ${page === 'session'
              ? `<div class="rounded-[14px] px-3 py-2 flex items-center gap-2 text-[12px] font-semibold" style="background:var(--rd-success-soft);color:var(--rd-success);">${icon('checkCircle', 16)}已获取网站登录状态</div>
                 ${renderSourceActionButton('clear-source-login', '退出当前网页账号', {danger:true, className:'w-full !h-10'})}`
              : `
                 ${renderSourceGroupField('login-account', session.account, '示例账号', '示例账号 / 邮箱 / 手机号')}
                 <input id="source-field-login-secret" type="password" autocomplete="off" aria-label="示例密码" placeholder="示例密码" class="w-full h-10 rounded-[10px] border px-3 text-[13px] select-text" style="background:var(--rd-sunken);color:var(--rd-ink);border-color:var(--rd-line-strong);">
                 ${renderSourceActionButton('submit-source-login', '登录并验证', {primary:true, className:'w-full !h-10'})}
                 ${renderSourceActionButton('verify-source-login', '完成网页人机验证', {className:'w-full !h-9'})}`}
          </div>
        </div>
        <div class="h-11 flex shrink-0 items-center justify-around border-t px-2" style="background:var(--rd-surface);border-color:var(--rd-line);">
          ${[
            ['source-login-back','后退','chevronLeft',session.loading || session.historyIndex === 0],
            ['source-login-forward','前进','chevronRight',session.loading || session.historyIndex >= session.history.length - 1],
            session.loading ? ['source-login-stop','停止加载','stop'] : ['source-login-refresh','刷新','refresh'],
            ['clear-source-login','清除登录态','trash']
          ].map(([action,label,ico,disabled]) => `<button type="button" ${sourceAction(action)} ${disabled ? 'disabled' : ''} class="h-8 px-2 inline-flex items-center gap-1 rounded-full text-[12px] font-medium whitespace-nowrap rd-pressable disabled:opacity-45" style="color:var(${action === 'clear-source-login' ? '--rd-danger' : '--rd-ink'});">${icon(ico, 14)}<span>${label}</span></button>`).join('')}
        </div>`;
    }

    function setSourceItemsEnabled(items, enabled) {
      for (const source of items) {
        source.enabled = enabled;
        if (!enabled && source.needLogin) {
          source.loggedIn = false;
          stopSourceCheckFor(source);
        }
      }
    }

    function sourceGroupNameError(modal) {
      const name = modal.name.trim();
      if (!name) return '请输入分组名称';
      if (Array.from(name).length > 32) return '分组名称最多 32 个字符';
      if (name === '全部分组' || name === '未分组') return '该名称由系统保留';
      if (state.sourceGroups.includes(name) && !(modal.kind === 'rename-group' && modal.group === name)) return '已存在同名分组';
      return '';
    }

    function exportAllManagedSources() {
      if (!state.sourceItems.length) return showAppToast('暂无书源可导出');
      const data = state.sourceItems.map(source => ({
        ...source.definition,
        bookSourceName: source.name,
        bookSourceUrl: source.sourceUrl || sourceDisplayUrl(source),
        bookSourceGroup: source.group,
        bookSourceType: source.category === 'comic' ? 2 : 0,
        enabled: source.enabled,
        needLogin: source.needLogin
      }));
      const url = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], {type:'application/json'}));
      const download = document.createElement('a');
      download.href = url;
      download.download = 'Reader-书源.json';
      document.body.appendChild(download);
      download.click();
      download.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      showAppToast(`已导出 ${data.length} 个书源`);
    }

    function openSourceGroupModal(modal) {
      state.sourceModal = modal;
      state.overlayAnim = pickMotionTransition('modal');
      render();
    }

    function handleSourceListAction(action, element) {
      const value = element.dataset.value ?? '';
      const source = () => state.sourceItems.find(item => item.id === value);
      const modal = state.sourceModal;
      switch (action) {
        case 'source-popover':
          state.sourcePopover = state.sourcePopover === value ? '' : value;
          if (state.sourcePopover) state.overlayAnim = pickMotionTransition('dropdown');
          render();
          break;
        case 'close-source-popover':
          state.sourcePopover = '';
          render();
          break;
        case 'source-route':
          state.sourcePopover = '';
          setSourcePageSub(value);
          break;
        case 'check-source-scope': {
          state.sourcePopover = '';
          const items = getFilteredSources();
          if (!items.length) showAppToast('没有可检测的书源');
          else openSourceBatchCheck(items, '批量检测');
          break;
        }
        case 'export-sources':
          state.sourcePopover = '';
          exportAllManagedSources();
          break;
        case 'source-group-all':
        case 'source-group-filter':
          state.sourceGroup = action === 'source-group-all' ? null : value;
          state.sourcePopover = '';
          render();
          break;
        case 'source-status-filter':
          state.sourceFilter = value;
          render();
          break;
        case 'source-category-filter':
          state.sourceCategory = value;
          render();
          break;
        case 'clear-source-search': {
          const input = document.getElementById('source-search-input');
          if (input) {
            input.value = '';
            handleSourceListInput('source-search', input);
            input.focus();
          }
          break;
        }
        case 'enter-source-batch':
        case 'exit-source-batch':
          state.sourceBatchMode = action === 'enter-source-batch';
          state.sourceSelectedIds = [];
          state.sourcePopover = '';
          render();
          break;
        case 'toggle-source-selected':
          state.sourceSelectedIds = state.sourceSelectedIds.includes(value)
            ? state.sourceSelectedIds.filter(id => id !== value)
            : [...state.sourceSelectedIds, value];
          render();
          break;
        case 'select-source-scope': {
          const items = getFilteredSources();
          const visible = new Set(items.map(item => item.id));
          state.sourceSelectedIds = items.every(item => state.sourceSelectedIds.includes(item.id))
            ? state.sourceSelectedIds.filter(id => !visible.has(id))
            : [...new Set([...state.sourceSelectedIds, ...visible])];
          render();
          break;
        }
        case 'check-source':
          if (source()) openSourceCheck(source());
          break;
        case 'toggle-source-enabled': {
          const item = source();
          if (item) {
            setSourceItemsEnabled([item], !item.enabled);
            render();
          }
          break;
        }
        case 'batch-source-enable':
        case 'batch-source-disable':
        case 'batch-source-check':
        case 'batch-source-move':
        case 'batch-source-delete': {
          const items = state.sourceItems.filter(item => state.sourceSelectedIds.includes(item.id));
          if (!items.length) break;
          if (action === 'batch-source-check') {
            openSourceBatchCheck(items, '批量检测');
            break;
          }
          if (action === 'batch-source-move' || action === 'batch-source-delete') {
            const sourceIds = items.map(item => item.id);
            openSourceGroupModal(action === 'batch-source-move'
              ? {kind:'move-group', sourceIds, targetGroup:state.sourceGroups[0] || '', name:''}
              : {kind:'delete-sources', sourceIds});
            break;
          }
          const enabled = action === 'batch-source-enable';
          setSourceItemsEnabled(items, enabled);
          showAppToast(`已${enabled ? '启用' : '停用'} ${items.length} 个书源`);
          break;
        }
        case 'confirm-delete-sources': {
          if (modal?.kind !== 'delete-sources') break;
          const deleted = new Set(modal.sourceIds);
          const items = state.sourceItems.filter(item => deleted.has(item.id));
          for (const item of items) stopSourceCheckFor(item);
          state.sourceItems = state.sourceItems.filter(item => !deleted.has(item.id));
          state.sourceSelectedIds = [];
          state.sourceBatchMode = false;
          state.sourceModal = null;
          showAppToast(`已删除 ${items.length} 个书源`);
          break;
        }
        case 'open-source-group':
          setSourcePageSub('group-detail', {group:value});
          break;
        case 'toggle-source-group': {
          const items = sourceGroupMembers(value);
          if (!items.length) break;
          const enabled = !items.every(item => item.enabled);
          setSourceItemsEnabled(items, enabled);
          showAppToast(`已${enabled ? '启用' : '停用'}整组书源`);
          break;
        }
        case 'check-source-group':
          openSourceBatchCheck(sourceGroupMembers(), `${state.sourceActiveGroup || '未分组'} · 整组检测`);
          break;
        case 'batch-ungrouped':
          state.sourceGroup = '';
          state.sourceFilter = 'all';
          state.sourceCategory = 'all';
          state.sourceSearch = '';
          state.sourceBatchMode = true;
          state.sourceSelectedIds = sourceGroupMembers('').map(item => item.id);
          setSourcePageSub('list', {pushHistory:false, returnToList:true});
          break;
        case 'source-group-enable':
        case 'source-group-disable': {
          const enabled = action === 'source-group-enable';
          setSourceItemsEnabled(sourceGroupMembers(), enabled);
          showAppToast(enabled ? '已全部启用' : '已全部停用');
          break;
        }
        case 'new-source-group':
          openSourceGroupModal({kind:'create-group', name:'', selectedIds:[]});
          break;
        case 'rename-source-group':
          openSourceGroupModal({kind:'rename-group', group:state.sourceActiveGroup, name:state.sourceActiveGroup});
          break;
        case 'add-source-group-members':
          openSourceGroupModal({kind:'add-to-group', group:state.sourceActiveGroup, query:'', selectedIds:[]});
          break;
        case 'delete-source-group':
          openSourceGroupModal({kind:'delete-group', group:state.sourceActiveGroup});
          break;
        case 'select-group-candidate':
          if (modal?.kind !== 'create-group' && modal?.kind !== 'add-to-group') break;
          modal.selectedIds = modal.selectedIds.includes(value)
            ? modal.selectedIds.filter(id => id !== value)
            : [...modal.selectedIds, value];
          render();
          break;
        case 'save-source-group': {
          if (modal?.kind !== 'create-group' && modal?.kind !== 'rename-group') break;
          if (sourceGroupNameError(modal)) break;
          const renaming = modal.kind === 'rename-group';
          const name = modal.name.trim();
          if (renaming) {
            state.sourceGroups = state.sourceGroups.map(group => group === modal.group ? name : group);
            sourceGroupMembers(modal.group).forEach(item => { item.group = name; });
            if (state.sourceGroup === modal.group) state.sourceGroup = name;
            state.sourceActiveGroup = name;
          } else {
            state.sourceGroups.push(name);
            state.sourceItems.filter(item => modal.selectedIds.includes(item.id)).forEach(item => { item.group = name; });
          }
          state.sourceModal = null;
          showAppToast(renaming ? '已重命名分组' : '已新建分组');
          break;
        }
        case 'confirm-delete-source-group':
          if (modal?.kind !== 'delete-group') break;
          sourceGroupMembers(modal.group).forEach(item => { item.group = ''; });
          state.sourceGroups = state.sourceGroups.filter(group => group !== modal.group);
          if (state.sourceGroup === modal.group) state.sourceGroup = null;
          state.sourceModal = null;
          navBack('sources');
          showAppToast('已删除分组');
          break;
        case 'confirm-add-source-group': {
          if (modal?.kind !== 'add-to-group') break;
          const items = state.sourceItems.filter(item => modal.selectedIds.includes(item.id) && item.group !== modal.group);
          if (!items.length) break;
          items.forEach(item => { item.group = modal.group; });
          state.sourceModal = null;
          showAppToast(`已添加 ${items.length} 个书源`);
          break;
        }
        case 'move-source': {
          const item = source();
          if (!item) break;
          openSourceGroupModal({kind:'move-group', sourceIds:[item.id], targetGroup:item.group, name:''});
          break;
        }
        case 'pick-source-group':
        case 'pick-new-source-group':
          if (modal?.kind !== 'move-group') break;
          modal.targetGroup = action === 'pick-new-source-group' ? null : value;
          render();
          break;
        case 'confirm-move-source-group': {
          if (modal?.kind !== 'move-group') break;
          let group = modal.targetGroup;
          if (group === null) {
            if (sourceGroupNameError(modal)) break;
            group = modal.name.trim();
            state.sourceGroups.push(group);
          }
          const items = state.sourceItems.filter(item => modal.sourceIds.includes(item.id));
          items.forEach(item => { item.group = group; });
          state.sourceModal = null;
          state.sourceSelectedIds = [];
          state.sourceBatchMode = false;
          showAppToast(group ? `已移至「${group}」` : '已移至未分组');
          break;
        }
        case 'remove-source-group': {
          const item = source();
          if (item) {
            item.group = '';
            showAppToast('已移至未分组');
          }
          break;
        }
        case 'source-login':
          setSourcePageSub('login', {sourceId:value});
          break;
        case 'cancel-source-login':
          state.sourceLoginSession = null;
          navBack('sources');
          break;
        case 'submit-source-login':
        case 'verify-source-login':
        case 'finish-source-login':
        case 'source-login-back':
        case 'source-login-forward':
        case 'source-login-refresh':
        case 'source-login-stop':
        case 'clear-source-login':
          handleSourceLoginAction(action);
          break;
        default:
          return false;
      }
      return true;
    }

    function handleSourceLoginAction(action) {
      const session = state.sourceLoginSession;
      const source = session && state.sourceItems.find(item => item.id === session.sourceId);
      if (!source) return;
      switch (action) {
        case 'submit-source-login':
        case 'verify-source-login':
          if (action === 'submit-source-login' && (!session.account.trim() || !document.getElementById('source-field-login-secret')?.value)) {
            showAppToast('请填写示例账号和密码');
            return;
          }
          if (action === 'verify-source-login') session.account = '';
          session.authenticated = true;
          session.history = [...session.history.slice(0, session.historyIndex + 1), 'session'];
          session.historyIndex = session.history.length - 1;
          render();
          break;
        case 'finish-source-login':
          if (!session.authenticated) {
            showAppToast('请先登录或完成人机验证');
            return;
          }
          stopSourceCheckFor(source);
          source.loggedIn = true;
          state.sourceLoginSession = null;
          setSourcePageSub('list', {pushHistory:false, returnToList:true});
          runSourceChecks({
            items:[source],
            settings:{mode:'search', depth:2, keyword:''},
            onStage() { if (state.screenId === 'sources' && state.sourcePageSub === 'list') render(); },
            onResult:setSourceCheckReport,
            onDone() { if (state.screenId === 'sources' && state.sourcePageSub === 'list') render(); }
          });
          showAppToast('已保存登录状态，正在复测');
          break;
        case 'source-login-back':
          if (session.historyIndex > 0) session.historyIndex--;
          render();
          break;
        case 'source-login-forward':
          if (session.historyIndex < session.history.length - 1) session.historyIndex++;
          render();
          break;
        case 'source-login-refresh':
          session.loading = true;
          session.loadingTimer = setTimeout(() => {
            if (state.sourceLoginSession !== session) return;
            session.loading = false;
            session.loadingTimer = null;
            render();
          }, 1000);
          render();
          break;
        case 'source-login-stop':
          clearTimeout(session.loadingTimer);
          session.loadingTimer = null;
          session.loading = false;
          render();
          break;
        case 'clear-source-login':
          stopSourceCheckFor(source);
          source.loggedIn = false;
          source.report = null;
          source.checkState = 'unchecked';
          clearTimeout(session.loadingTimer);
          session.loadingTimer = null;
          session.authenticated = false;
          session.loading = false;
          session.account = '';
          session.history = ['form'];
          session.historyIndex = 0;
          showAppToast('已清除登录态');
          break;
      }
    }

    function cancelSourceTransferWork() {
      const pending = sourceTransferRequest;
      sourceTransferRequest = null;
      if (pending) {
        pending.controller.abort();
        if (pending.flow) pending.flow.loading = false;
      }
      const run = sourceTransferCheck;

    function sourceTransferNewId(prefix) {
      sourceTransferId += 1;
      return prefix + '-v9-' + sourceTransferId;
    }

    function sourceTransferUrl(value) {
      const text = value.trim();
      if (!/^https?:\/\/[^/\s?#]/i.test(text) || /[\s\\]/.test(text)) return '';
      try {
        const url = new URL(text);
        const authority = text.split(/[/?#]/)[2];
        return url.hostname && !authority.includes('@') ? url.href : '';
      } catch {
        return '';
      }
    }

    function sourceTransferEntryUrl(entry) {
      return sourceTransferUrl(entry.sourceUrl || 'https://' + entry.host);
    }

    function sourceTransferText(value) {
      return typeof value === 'string' ? value.trim() : '';
    }

    function sourceTransferCollection(data, type = 'source') {
      if (Array.isArray(data)) return data;
      if (data && typeof data === 'object') {
        const list = type === 'rule' ? data.rules : data.sources;
        return Array.isArray(list) ? list : [data];
      }
      throw new Error('invalid collection');
    }

    function sourceTransferCategory(row) {
      if (row.bookSourceType != null) {
        const type = String(row.bookSourceType);
        if (type === '0') return 'novel';
        if (type === '2') return 'comic';
        return 'unsupported';
      }
      const category = sourceTransferText(row.category) || 'novel';
      return category === 'novel' || category === 'comic' ? category : 'unsupported';
    }

    function normalizeSourceTransferRows(data, fixture = false) {
      return sourceTransferCollection(data).map((row, index) => {
        const raw = row && typeof row === 'object' ? row : {};
        const name = sourceTransferText(raw.bookSourceName || raw.name);
        const sourceUrl = sourceTransferText(raw.bookSourceUrl || raw.url);
        const hostText = sourceTransferText(raw.host);
        const url = sourceTransferUrl(sourceUrl || (hostText && 'https://' + hostText));
        const host = url ? new URL(url).host : '';
        const group = sourceTransferText(raw.bookSourceGroup || raw.group);
        const category = sourceTransferCategory(raw);
        const needLogin = raw.needLogin === true || Boolean(sourceTransferText(raw.loginUrl));
        const scenario = fixture ? raw.scenario || 'ready' : '';
        const { bookSourceName, name: rawName, bookSourceUrl, url: rawUrl, host: rawHost,
          bookSourceGroup, group: rawGroup, bookSourceType, category: rawCategory, needLogin: rawNeedLogin,
          ...rules } = raw;
        const definition = fixture || !Object.keys(rules).length ? null : rules;
        const staticError = category === 'unsupported'
          ? '暂不支持该类型'
          : !name || !host ? '缺少有效名称或链接' : '';
        return { name: name || '未命名书源 ' + (index + 1), host, group, category, needLogin, scenario, sourceUrl: url, definition, staticError };
      });
    }

    async function loadSourceTransferRows(url, signal, type = 'source') {
      const fixture = Object.hasOwn(sourceTransferExamples, url);
      const response = fixture ? null : await fetch(url, { signal, credentials: 'omit', referrerPolicy: 'no-referrer' });
      if (response && !response.ok) throw new Error('fetch failed');
      const data = fixture ? sourceTransferExamples[url] : await response.json();
      if (type === 'rule') {
        const rules = sourceTransferCollection(data, 'rule').map(raw => {
          if (!raw || typeof raw !== 'object') return null;
          const name = sourceTransferText(raw.ruleName || raw.name);
          const pattern = typeof raw.pattern === 'string' ? raw.pattern : raw.regex;
          const key = sourceTransferText(raw.key || raw.id) || name;
          return name && typeof pattern === 'string' && pattern.length ? sourceRuleExample(key, name, pattern, typeof raw.replacement === 'string' ? raw.replacement : '') : null;
        });
        if (rules.some(rule => !rule)) throw new Error('invalid rule');
        return rules;
      }
      return normalizeSourceTransferRows(data, fixture);
    }

    function prepareSourceTransferEntity(row, id, context = null) {
      const report = context?.report || null;
      return {
        id,
        name: row.name,
        host: row.host,
        group: row.group,
        category: row.category,
        enabled: context?.enabled ?? true,
        needLogin: row.needLogin,
        loggedIn: row.needLogin && Boolean(context?.loggedIn),
        checkFixture: row.scenario && row.category !== 'unsupported' ? createSourceCheckFixture(row.category, row.scenario) : null,
        sourceUrl: row.sourceUrl || (row.host ? 'https://' + row.host : ''),
        definition: row.definition || null,
        checkState: report ? (report.available ? 'passed' : 'failed') : 'unchecked',
        report,
      };
    }

    async function readSourceImportFile(input) {
      const file = input.files?.[0];
      if (!file) return;
      cancelSourceTransferWork();
      const flow = state.sourceImportFlow;
      const pending = { flow, controller: new AbortController() };
      sourceTransferRequest = pending;
      flow.selectedFileName = file.name;
      flow.customUploaded = [];
      flow.loading = true;
      render();
      try {
        const rows = normalizeSourceTransferRows(JSON.parse((await file.text()).replace(/^\uFEFF/, '')));
        if (sourceTransferRequest !== pending) return;
        flow.customUploaded = rows;
        if (rows.length) return;
      } catch {
        if (sourceTransferRequest !== pending) return;
      } finally {
        if (sourceTransferRequest === pending) {
          sourceTransferRequest = null;
          flow.loading = false;
          render();
        }
      }
      showAppToast('文件未读取到有效的书源 JSON');
    }

    function openSourceImportStep(flow, rows) {
      if (!rows.length) return showAppToast('未读取到书源，请检查内容');
      const seen = new Set();
      flow.items = rows.map((row, index) => {
        const sourceUrl = sourceTransferEntryUrl(row);
        const staticError = row.staticError || (seen.has(sourceUrl) ? '同一链接已列出' : '');
        const staticOk = !staticError;
        if (staticOk) seen.add(sourceUrl);
        const existing = state.sourceItems.find(item => sourceTransferEntryUrl(item) === sourceUrl);
        return {
          ...prepareSourceTransferEntity(row, 'import-entry-' + index, existing),
          scenario: row.scenario,
          staticError,
          staticOk,
          selected: staticOk,
          checkStage: '',
          report: null,
          checkState: 'unchecked',
        };
      });
      flow.completed = 0;
      flow.total = flow.items.filter(item => item.staticOk).length;
      flow.currentItem = '';
      flow.currentStage = '';
      flow.step = 2;
      render();
    }

    async function parseSourceImport() {
      const flow = state.sourceImportFlow;
      if (flow.loading) return;
      if (flow.tab === 'file') {
        const preset = sourceImportPresets.find(pack => pack.name === flow.selectedFileName);
        openSourceImportStep(flow, flow.customUploaded ?? normalizeSourceTransferRows(preset.items, true));
        return;
      }
      if (flow.tab === 'paste') {
        if (!flow.pasteText.trim()) return showAppToast('请粘贴书源 JSON');
        try {
          const data = JSON.parse(flow.pasteText);
          const fixture = JSON.stringify(sourceTransferSnapshot(data)) === JSON.stringify(sourceTransferSnapshot(sourceImportPasteExample));
          openSourceImportStep(flow, normalizeSourceTransferRows(data, fixture));
        } catch {
          showAppToast('书源 JSON 格式有误');
        }
        return;
      }
      const url = sourceTransferUrl(flow.urlInput);
      if (!url) return showAppToast('请输入有效的 http:// 或 https:// 书源链接');
      cancelSourceTransferWork();
      const pending = { flow, controller: new AbortController() };
      sourceTransferRequest = pending;
      flow.loading = true;
      render();
      try {
        const rows = await loadSourceTransferRows(url, pending.controller.signal);
        if (sourceTransferRequest !== pending) return;
        flow.loading = false;
        sourceTransferRequest = null;
        openSourceImportStep(flow, rows);
      } catch {
        if (sourceTransferRequest !== pending) return;
        flow.loading = false;
        sourceTransferRequest = null;
        showAppToast('无法读取书源链接，请检查链接或网络');
      }
    }

    window.backSourceImport = () => {
      const flow = state.sourceImportFlow;
      if (flow.step !== 2) {
        state.sourceImportFlow = createSourceImportFlow();
        setSourcePageSub('list', {returnToList:true});
        return;
      }
      cancelSourceTransferWork();
      flow.step = 1;

    function checkSourceImport() {
      const flow = state.sourceImportFlow;
      if (flow.skipCheck || flow.checking) return;
      const items = flow.items.filter(item => item.staticOk);
      if (!items.length) return showAppToast('没有可检测的书源');
      flow.checking = true;
      flow.completed = 0;
      flow.total = items.length;
      for (const item of items) {
        item.checkStage = '';
        setSourceCheckReport(item, null);
      }
      render();
      sourceTransferCheck = runSourceChecks({
        items,
        settings: { mode: flow.checkMode, depth: flow.checkDepth, keyword: flow.checkKeyword },
        onStage(item, stage) {
          item.checkStage = stage;
          flow.currentItem = item.name;
          flow.currentStage = stage;
          render();
        },
        onResult(item, report) {
          setSourceCheckReport(item, report);
          item.checkStage = '';
          if (!report.available) item.selected = false;
          flow.completed += 1;
          render();
        },
        onDone({ stopped }) {
          sourceTransferCheck = null;
          flow.checking = false;
          flow.currentItem = '';
          flow.currentStage = '';
          items.forEach(item => { item.checkStage = ''; });
          if (stopped) render();
          else showAppToast('检测完成 · 通过 ' + items.filter(item => item.report?.available).length + ' 项');
        },
      });
    }

    function commitSourceImport() {
      const flow = state.sourceImportFlow;
      if (flow.checking) return;
      const picked = flow.items.filter(item => item.staticOk && item.selected);
      if (!picked.length) return showAppToast('请至少选择一项书源');
      let group = flow.targetGroup;
      if (flow.groupStrategy !== 'preserve') {
        group = group ?? flow.newGroupName.trim();
        if (!group) return showAppToast('请选择分组或填写新分组名称');
      }
      const result = { added: 0, updated: 0, unsupportedCount: 0, invalid: 0, details: [] };
      const appliedSources = [];
      for (const item of flow.items) {
        if (!item.staticOk) {
          if (item.category === 'unsupported') result.unsupportedCount += 1;
          else result.invalid += 1;
          result.details.push({ name: item.name, label: item.staticError });
        } else if (item.selected) {
          const groupName = flow.groupStrategy === 'all'
            ? group
            : item.group || (flow.groupStrategy === 'fill' ? group : '');
          const row = { name: item.name, host: item.host, category: item.category, group: groupName, needLogin: item.needLogin, scenario: item.scenario, sourceUrl: item.sourceUrl, definition: item.definition };
          const existing = state.sourceItems.find(entry => sourceTransferEntryUrl(entry) === sourceTransferEntryUrl(row));
          const report = flow.skipCheck ? null : item.report;
          const saved = prepareSourceTransferEntity(row, existing?.id || sourceTransferNewId('source'), { ...existing, report });
          if (groupName && !state.sourceGroups.includes(groupName)) state.sourceGroups.push(groupName);
          if (existing) {
            stopSourceCheckFor(existing);
            Object.assign(existing, saved);
            result.updated += 1;
          } else {
            state.sourceItems.unshift(saved);
            result.added += 1;
          }
          appliedSources.push({ ...row, group: item.group });
          const status = existing ? '已更新' : '已新增';
          result.details.push({ name: item.name, label: report && !report.available ? status + ' · 保留未通过报告' : status });
        } else {
          result.details.push({ name: item.name, label: '未选中' });
        }
      }
      if (flow.tab === 'url' && flow.saveAsSub) {
        const url = sourceTransferUrl(flow.urlInput);
        if (url && !state.sourceSubscriptions.some(sub => sub.url === url && sub.type === 'source')) {
          state.sourceSubscriptions.unshift({
            id: sourceTransferNewId('sub'),
            type: 'source',
            url,
            name: flow.subNameInput.trim() || '在线书源订阅',
            autoUpdate: true,
            lastSync: '刚刚',
            appliedSources,
            appliedRules: [],
          });
        }
      }
      flow.result = result;
      flow.detailExpanded = false;
      flow.step = 3;
      showAppToast('导入完成 · 新增 ' + result.added + ' · 更新 ' + result.updated);
    }

    function sourceTransferSnapshot(value) {
      if (Array.isArray(value)) return value.map(sourceTransferSnapshot);
      if (!value || typeof value !== 'object') return value;
      return Object.fromEntries(Object.keys(value).sort().map(key => [key, sourceTransferSnapshot(value[key])]));
    }

    function sameSourceTransferEntry(a, b) {
      if (!a || !b) return false;
      if (a.key) return a.name === b.name && a.pattern === b.pattern && a.replacement === b.replacement;
      return a.name === b.name && a.group === b.group && a.category === b.category && a.needLogin === b.needLogin &&
        sourceTransferEntryUrl(a) === sourceTransferEntryUrl(b) &&
        JSON.stringify(sourceTransferSnapshot(a.definition || null)) === JSON.stringify(sourceTransferSnapshot(b.definition || null));
    }

    function subscriptionPreviewItems(sub, incoming) {
      const isRule = sub.type === 'rule';
      const keyFor = entry => isRule ? entry.key : sourceTransferEntryUrl(entry);
      const applied = isRule ? sub.appliedRules : sub.appliedSources;
      const lastApplied = new Map(applied.map(entry => [keyFor(entry), entry]));
      const remote = new Map();
      for (const entry of incoming) {
        const key = keyFor(entry);
        if (!remote.has(key)) remote.set(key, entry);
      }
      const items = [];

      for (const [key, row] of remote) {
        const base = lastApplied.get(key);
        const existing = isRule ? base : state.sourceItems.find(item => sourceTransferEntryUrl(item) === key);
        let diff;
        if (!existing) {
          diff = 'added';
        } else if (sameSourceTransferEntry(base, row)) {
          diff = 'unchanged';
        } else if (sameSourceTransferEntry(existing, row)) {
          diff = base ? 'update' : 'unchanged';
        } else {
          diff = sameSourceTransferEntry(base, existing) ? 'update' : 'conflict';
        }
        const id = sourceTransferNewId('diff');
        const details = isRule ? row : prepareSourceTransferEntity(row, id, { ...existing, report: null });
        items.push({
          ...details, id, row, subId: sub.id, subName: sub.name, isRule, diff,
          checked: diff !== 'unchanged', resolution: 'overwrite', checkStage: '',
        });
      }

      for (const [key, row] of lastApplied) {
        if (remote.has(key)) continue;
        items.push({
          ...row, id: sourceTransferNewId('diff'), row, subId: sub.id, subName: sub.name, isRule,
          diff: 'removed', checked: false, resolution: 'overwrite', checkStage: '',
        });
      }
      return items;
    }

    async function openSourceSubscriptionPreview(ids) {
      const targets = state.sourceSubscriptions.filter(sub => ids.includes(sub.id));
      if (!targets.length) return;
      cancelSourceTransferWork();
      const pending = { controller: new AbortController() };
      const loading = { kind: 'sub-loading' };
      sourceTransferRequest = pending;
      state.sourceModal = loading;
      state.overlayAnim = pickMotionTransition('modal');
      render();
      const responses = await Promise.allSettled(targets.map(async sub => {
        const rows = await loadSourceTransferRows(sub.url, pending.controller.signal, sub.type);
        if (sub.type === 'rule') return rows;
        if (rows.some(row => row.staticError && row.category !== 'unsupported')) throw new Error('invalid source');
        return rows.filter(row => !row.staticError);
      }));
      if (sourceTransferRequest !== pending || state.sourceModal !== loading) return;
      sourceTransferRequest = null;

      const errors = [];
      const items = responses.flatMap((response, index) => {
        const sub = targets[index];
        if (response.status !== 'fulfilled') {
          errors.push(sub.name);
          return [];
        }
        return subscriptionPreviewItems(sub, response.value);
      });
      if (errors.length === targets.length) {
        state.sourceModal = null;
        return showAppToast('无法检查订阅更新，请检查链接或网络');
      }
      state.sourceModal = {
        kind: 'sub-diff',
        title: targets.length === 1 ? targets[0].name : '全部订阅更新',
        items, errors,
        settings: { mode: 'search', depth: 2, keyword: '' },
        checking: false, completed: 0, total: 0, currentItem: '', currentStage: '',
      };
      render();
    }

    function isCheckableSourceSubscriptionItem(item) {
      return !item.isRule && ['added', 'update', 'conflict'].includes(item.diff);
    }

    function sourceSubscriptionChanges(modal) {
      return modal.items.filter(item => item.checked && item.diff !== 'unchanged' &&
        (item.diff !== 'conflict' || item.resolution === 'overwrite'));
    }

    function checkSourceSubscriptionDiff(modal) {
      if (modal.checking) return;
      const items = modal.items.filter(isCheckableSourceSubscriptionItem);
      if (!items.length) return;
      modal.checking = true;
      modal.completed = 0;
      modal.total = items.length;
      for (const item of items) {
        setSourceCheckReport(item, null);
        item.checkStage = '';
      }
      render();
      sourceTransferCheck = runSourceChecks({
        items,
        settings: modal.settings,
        onStage(item, stage) {
          item.checkStage = stage;
          modal.currentItem = item.name;
          modal.currentStage = stage;
          render();
        },
        onResult(item, report) {
          setSourceCheckReport(item, report);
          item.checkStage = '';
          if (!report.available) item.checked = false;
          modal.completed += 1;
          render();
        },
        onDone({ stopped }) {
          sourceTransferCheck = null;
          modal.checking = false;
          modal.currentItem = '';
          modal.currentStage = '';
          items.forEach(item => { item.checkStage = ''; });
          if (stopped) render();
          else showAppToast('检测完成 · 通过 ' + items.filter(item => item.report?.available).length + ' 项');
        }
      });
    }

    function applySourceSubscriptionDiff(modal) {
      if (modal.checking) return;
      const changes = sourceSubscriptionChanges(modal);
      if (!changes.length) return;
      const removedSourceUrls = new Set();
      for (const item of changes) {
        const subscription = state.sourceSubscriptions.find(sub => sub.id === item.subId);
        const applied = item.isRule ? subscription.appliedRules : subscription.appliedSources;
        const keyFor = entry => item.isRule ? entry.key : sourceTransferEntryUrl(entry);
        const key = keyFor(item.row);
        const index = applied.findIndex(entry => keyFor(entry) === key);
        if (item.diff === 'removed') {
          if (index !== -1) applied.splice(index, 1);
          if (!item.isRule) removedSourceUrls.add(key);
        } else {
          if (index === -1) applied.push(item.row);
          else applied[index] = item.row;
          if (!item.isRule) {
            const existing = state.sourceItems.find(source => sourceTransferEntryUrl(source) === key);
            const report = item.report || (sameSourceTransferEntry(existing, item.row) ? existing.report : null);
            const saved = prepareSourceTransferEntity(item.row, existing?.id || sourceTransferNewId('source'), { ...existing, report });
            if (saved.group && !state.sourceGroups.includes(saved.group)) state.sourceGroups.push(saved.group);
            if (existing) {
              stopSourceCheckFor(existing);
              Object.assign(existing, saved);
            } else {
              state.sourceItems.unshift(saved);
            }
          }
        }
        subscription.lastSync = '刚刚';
      }
      if (removedSourceUrls.size) {
        const retainedUrls = new Set(state.sourceSubscriptions.flatMap(sub => sub.appliedSources.map(sourceTransferEntryUrl)));
        const removedIds = new Set();
        state.sourceItems = state.sourceItems.filter(source => {
          const sourceUrl = sourceTransferEntryUrl(source);
          if (!removedSourceUrls.has(sourceUrl) || retainedUrls.has(sourceUrl)) return true;
          stopSourceCheckFor(source);
          removedIds.add(source.id);
          return false;
        });
        state.sourceSelectedIds = state.sourceSelectedIds.filter(id => !removedIds.has(id));
      }
      state.sourceModal = null;
      showAppToast('已应用 ' + changes.length + ' 项订阅更新');
    }

    function openSourceSubscriptionForm(sub = null) {
      state.sourceModal = {
        kind: 'sub-form',
        id: sub?.id || null,
        name: sub?.name || '',
        url: sub?.url || '',
        type: sub?.type || 'source',
        autoUpdate: sub?.autoUpdate ?? true,
      };
      state.overlayAnim = pickMotionTransition('modal');
      render();
    }

    function saveSourceSubscription(modal) {
      const name = modal.name.trim();
      const url = sourceTransferUrl(modal.url);
      if (!name) return showAppToast('请输入订阅名称');
      if (!url) return showAppToast('请输入有效的 http:// 或 https:// 订阅链接');
      if (state.sourceSubscriptions.some(sub => sub.id !== modal.id && sub.url === url && sub.type === modal.type)) {
        return showAppToast('该链接已添加为订阅');
      }
      const existing = state.sourceSubscriptions.find(sub => sub.id === modal.id);
      const reset = !existing || existing.url !== url || existing.type !== modal.type;
      const values = { name, url, type: modal.type, autoUpdate: modal.autoUpdate };
      if (reset) Object.assign(values, { appliedSources: [], appliedRules: [], lastSync: '尚未更新' });
      if (existing) Object.assign(existing, values);
      else state.sourceSubscriptions.unshift({ id: sourceTransferNewId('sub'), ...values });
      state.sourceModal = null;
      showAppToast(existing ? '订阅已更新' : '已添加订阅');
    }

    function renderSourceTransferButton(label, action, options = {}) {
      const { tone = 'secondary', value, id, disabled = false, size = 'h-8 px-3', extra = '' } = options;
      const styles = {
        primary: 'background:var(--rd-primary);color:var(--rd-on-primary);',
        secondary: 'background:var(--rd-primary-soft);color:var(--rd-primary);',
        neutral: 'background:var(--rd-sunken);color:var(--rd-ink);',
        danger: 'background:var(--rd-danger-soft);color:var(--rd-danger);',
        text: 'color:var(--rd-muted);',
      };
      return `<button type="button" data-source-action="${action}" ${value != null ? `data-value="${escapeAttr(value)}"` : ''} ${id ? `data-id="${escapeAttr(id)}"` : ''} ${disabled ? 'disabled' : ''} class="${size} ${extra} rounded-full text-[12px] font-semibold whitespace-nowrap rd-pressable disabled:opacity-50" style="${styles[tone]}">${label}</button>`;
    }

    function renderSourceTransferSegments(choices, selected, action, label, disabled = false) {
      const selectedIdx = Math.max(0, choices.findIndex(([key]) => key === selected));
      return `<div role="group" aria-label="${escapeAttr(label)}" class="rd-seg-rail" style="grid-template-columns:repeat(${choices.length},minmax(0,1fr));"><span class="rd-seg-rail-thumb" style="width:calc((100% - 6px) / ${choices.length});transform:translateX(${selectedIdx * 100}%);"></span>${choices.map(([key, title]) => `<button type="button" data-source-action="${action}" data-value="${escapeAttr(key)}" aria-pressed="${selected === key}" ${disabled ? 'disabled' : ''} class="rd-seg-rail-btn rd-pressable disabled:opacity-50" style="color:${selected === key ? 'var(--rd-primary)' : 'var(--rd-muted)'};">${escHtml(title)}</button>`).join('')}</div>`;
    }

    function renderSourceTransferField(field, label, value, options = {}) {
      const { type = 'text', placeholder = '', disabled = false } = options;
      return `<label class="block space-y-1.5">
        <span class="block text-[12px] font-medium" style="color:var(--rd-muted);">${escHtml(label)}</span>
        <input type="${type}" data-source-input="${field}" value="${escapeAttr(value)}" placeholder="${escapeAttr(placeholder)}" ${disabled ? 'disabled' : ''} class="w-full min-w-0 h-10 px-3 rounded-[10px] border text-[13px] outline-none focus-visible:ring-1 disabled:opacity-50" style="background:var(--rd-surface);border-color:var(--rd-line-strong);color:var(--rd-ink);">
      </label>`;
    }

    function renderSourceTransferCard(content, cls = 'p-3') {
      return `<div class="rounded-[14px] border ${cls}" style="background:var(--rd-surface);border-color:var(--rd-line);box-shadow:var(--rd-e1-shadow);">${content}</div>`;
    }

    function renderSourceTransferReport(item, action, disabled) {
      return `<button type="button" data-source-action="${action}" data-id="${escapeAttr(item.id)}" ${disabled ? 'disabled' : ''} aria-label="${escapeAttr(item.name + ' · 查看检测报告')}" class="inline-flex max-w-[110px] shrink-0 overflow-hidden rounded-full rd-pressable disabled:opacity-50">${renderSourceCheckBadge(item.report)}</button>`;
    }

    function renderSourceTransferCheckbox(selected, action, item, disabled = false) {
      return `<button type="button" role="checkbox" aria-checked="${selected}" aria-label="${escapeAttr('选择' + item.name)}" data-source-action="${action}" data-id="${escapeAttr(item.id)}" ${disabled ? 'disabled' : ''} class="w-5 h-5 grid place-items-center shrink-0 rounded-full border rd-pressable" style="${selected ? 'background:var(--rd-primary);border-color:var(--rd-primary);color:var(--rd-on-primary);' : 'border-color:var(--rd-line-strong);color:var(--rd-muted);'}">${selected ? icon('check', 12, 'currentColor', 2.4) : ''}</button>`;
    }

              <span class="w-5 h-5 rounded-full shrink-0 grid place-items-center border" style="${selected ? 'background:var(--rd-primary);border-color:var(--rd-primary);color:var(--rd-on-primary);' : 'border-color:var(--rd-line-strong);'}">${selected ? icon('check', 11) : ''}</span>

            <div class="flex items-center justify-between gap-2 text-[13px] font-semibold">

            </div>
