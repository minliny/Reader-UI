    function getFilteredSourceSwitchCandidates() {
      const list = Array.isArray(state.sourceSwitchCandidates) ? state.sourceSwitchCandidates.slice() : [];
      const q = (state.sourceSwitchSearch || '').trim().toLowerCase();
      const filtered = q
        ? list.filter(c =>
            (c.name || '').toLowerCase().includes(q) ||
            (c.ch || '').toLowerCase().includes(q)
          )
        : list;
      const sortMode = state.sourceSwitchSort || 'latency';
      filtered.sort((a, b) => {
        if (a.id === state.sourceSwitchSelected && b.id !== state.sourceSwitchSelected) return -1;
        if (b.id === state.sourceSwitchSelected && a.id !== state.sourceSwitchSelected) return 1;
        if (sortMode === 'latest') {
          const ca = typeof a.chNum === 'number' ? a.chNum : 0;
          const cb = typeof b.chNum === 'number' ? b.chNum : 0;
          if (cb !== ca) return cb - ca;
        }
        const ma = typeof a.msNum === 'number' ? a.msNum : (parseInt(String(a.ms || '999'), 10) || 999);
        const mb = typeof b.msNum === 'number' ? b.msNum : (parseInt(String(b.ms || '999'), 10) || 999);
        return ma - mb;
      });
      return filtered;
    }

    function renderSourceSwitchListMarkup() {
      const allCands = Array.isArray(state.sourceSwitchCandidates) ? state.sourceSwitchCandidates : [];
      if (!state.sourceSwitchDiscovering && (state.sourceSwitchSub === 'empty' || allCands.length === 0)) {
        return `
          <div class="py-10 text-center space-y-2">
            <div class="text-[14px] font-medium" style="color:var(--rd-ink);">查找完成 · 暂未发现其他可用书源</div>
            <div class="text-[12px]" style="color:var(--rd-muted);">可点击右上角重查，或返回继续当前源阅读</div>
          </div>
        `;
      }
      const cands = getFilteredSourceSwitchCandidates();
      if (cands.length === 0) {
        return `
          <div class="py-8 text-center space-y-1.5">
            <div class="text-[13px] font-medium" style="color:var(--rd-ink);">未找到匹配的候选书源</div>
            <div class="text-[11px]" style="color:var(--rd-muted);">换个关键词试试，或清空筛选查看全部 ${allCands.length} 个结果</div>
          </div>
        `;
      }
      return cands.map(c => {
        const active = state.sourceSwitchSelected === c.id;
        return `
          <button type="button" ${active ? 'data-current-source="true"' : ''} onclick="selectSwitchSource('${c.id}')" class="w-full p-3 rounded-[14px] border flex items-center justify-between gap-2 text-left rd-pressable" style="background:${active?'var(--rd-primary-soft)':'var(--rd-surface)'};border-color:${active?'var(--rd-primary-border)':'var(--rd-line)'};">
            <div class="min-w-0 flex-1">
              <div class="flex items-center gap-2">
                ${active ? `<span class="px-1.5 py-0.5 rounded-[5px] text-[10px] font-semibold shrink-0" style="background:var(--rd-primary);color:var(--rd-on-primary);">当前</span>` : ''}
                <span class="text-[14px] font-semibold truncate" style="color:${active?'var(--rd-primary)':'var(--rd-ink)'};">${c.name}</span>
                <span class="px-1.5 py-0.5 rounded-[5px] text-[10px] font-medium rd-num shrink-0" style="background:${c.ok?'var(--rd-success-soft)':'var(--rd-warning-soft)'};color:${c.ok?'var(--rd-success)':'var(--rd-warning)'};">${c.ms}</span>
              </div>
              <div class="text-[12px] truncate mt-0.5" style="color:var(--rd-muted);">${c.ch}</div>
            </div>
            ${active ? `<span class="w-6 h-6 rounded-full flex items-center justify-center shrink-0" style="background:var(--rd-primary);color:var(--rd-on-primary);">${icon('check', 13, 'currentColor', 2.4)}</span>` : ''}
          </button>
        `;
      }).join('');
    }

    function renderSourceSwitchOverlay(isStandalonePreview = false) {
      const isTablet = state.device === 'tablet';
      const ssAnimCls = (state.overlayAnim === 'reduced' || state.screenTransition === 'reduced')
        ? 'anim-page-reduced'
        : ((state.overlayAnim === 'sheet' || state.screenTransition === 'fade') ? (isTablet ? 'anim-side-sheet-in' : 'anim-sheet-up') : '');
      const isEdge = state.edgeStressMode === 'edge';
      const hostScreen = isStandalonePreview ? (state.sourceSwitchReturnScreen || 'novel') : state.screenId;
      const prefTarget = hostScreen === 'manga' ? 'manga' : (hostScreen === 'novel' ? 'novel' : undefined);
      const activeBook = typeof getActiveBook === 'function' ? getActiveBook(prefTarget) : null;
      const rawTitle = (activeBook && (activeBook.title || activeBook.t)) || '斗破苍穹';
      const bookType = (activeBook && (activeBook.type || activeBook.tp)) || (hostScreen === 'manga' ? '漫画' : '小说');
      const bookTone = (activeBook && (activeBook.tone || activeBook.coverTone)) || (bookType === '漫画' ? 'manga' : 'ink');
      const bookTitle = isEdge ? `${rawTitle}（典藏精校全本增订版·附前传外传合集）` : rawTitle;
      const allCands = Array.isArray(state.sourceSwitchCandidates) ? state.sourceSwitchCandidates : [];
      const curCand = allCands.find(c => c.id === state.sourceSwitchSelected) || allCands[0] || { name: '66书吧', ch: '第三章 客人' };
      const curChSummary = (activeBook && activeBook.displayCh) || curCand.ch || '第三章 客人';
      const discovering = !!state.sourceSwitchDiscovering || state.sourceSwitchSub === 'discovering';
      const prog = state.sourceSwitchProgress;
      const totalCount = (prog && typeof prog === 'object' && prog.total) ? prog.total : 137;
      const checkedCount = (prog && typeof prog === 'object' && typeof prog.checked === 'number')
        ? Math.min(totalCount, Math.max(0, prog.checked))
        : (discovering ? Math.round(totalCount * 0.45) : totalCount);
      const pct = Math.max(6, Math.min(100, Math.round((checkedCount / Math.max(1, totalCount)) * 100)));
      const filteredCands = getFilteredSourceSwitchCandidates();
      const sortLabel = state.sourceSwitchSort === 'latest' ? '最新章优先 ↓' : '延迟优先 ↓';
      const searchQ = state.sourceSwitchSearch || '';

      return `
        <div onclick="closeSourceSwitch()" class="absolute inset-0 z-30 ${isTablet ? 'flex justify-end items-stretch p-3' : 'flex items-end'}" style="background:var(--rd-scrim);">
          <div onclick="event.stopPropagation()" class="${isTablet ? 'w-[376px] h-full rounded-[22px] p-4 border' : 'w-full rounded-t-[24px] p-4 pb-6 border-t min-h-[340px] max-h-[82%]'} ${ssAnimCls} flex flex-col overflow-hidden" style="background:var(--rd-elevated);border-color:var(--rd-line);box-shadow:var(--rd-e3-shadow);">
            ${!isTablet ? `<div class="w-9 h-1 rounded-full mx-auto mb-3 shrink-0" style="background:var(--rd-line-strong);"></div>` : ''}

              <div class="text-[18px] font-semibold" style="color:var(--rd-ink);">更换书源</div>
              <div class="flex items-center gap-1.5">
                ${discovering ? `
                  <button type="button" onclick="stopSourceSwitchDiscovery()" class="h-8 px-3 rounded-full text-[12px] font-medium flex items-center gap-1 rd-pressable" style="background:var(--rd-warning-soft);color:var(--rd-warning);">
                    ${icon('close', 12)}<span>停止</span>
                  </button>
                ` : `
                  <button type="button" onclick="startSourceSwitchDiscovery()" class="h-8 px-3 rounded-full text-[12px] font-medium flex items-center gap-1 rd-pressable" style="background:var(--rd-primary-soft);color:var(--rd-primary);">
                    ${icon('refresh', 13)}<span>重查</span>
                  </button>
                `}
                <button type="button" onclick="closeSourceSwitch()" class="w-8 h-8 rounded-full flex items-center justify-center rd-pressable" style="background:var(--rd-sunken);color:var(--rd-muted);">${icon('close', 16)}</button>
              </div>
            </div>

            <!-- Compact Book Summary -->
            <div class="p-2.5 rounded-[12px] flex items-center gap-3 mb-2.5 shrink-0" style="background:var(--rd-sunken);">
              <div class="w-10 h-14 rounded-[5px] overflow-hidden shrink-0">${bookCoverArt(bookTitle, bookType, bookTone, isEdge)}</div>
              <div class="min-w-0 flex-1">
                <div class="text-[14px] font-semibold truncate" style="color:var(--rd-ink);">${bookTitle}</div>
                <div class="text-[11px] truncate" style="color:var(--rd-muted);">当前：${curCand.name} · ${curChSummary}</div>
              </div>
            </div>

            ${discovering ? `
              <div id="source-switch-progress" class="mb-2.5 p-2.5 rounded-[12px] border space-y-1.5 shrink-0" style="background:var(--rd-primary-soft);border-color:var(--rd-primary-border);">
                <div class="flex items-center justify-between gap-2 text-[12px]">
                  <div class="flex items-center gap-2 min-w-0">
                    <span class="w-3.5 h-3.5 rounded-full border-2 border-t-transparent rd-spin shrink-0" style="border-color:var(--rd-primary);border-top-color:transparent;"></span>
                    <span class="font-medium truncate" style="color:var(--rd-primary);">正在并发检索全网书源…</span>
                  </div>
                  <span class="rd-num text-[11px] shrink-0" style="color:var(--rd-primary);">${checkedCount} / ${totalCount} · ${pct}%</span>
                </div>
                <div class="h-1 rounded-full overflow-hidden" style="background:var(--rd-surface);">
                  <div class="h-full rounded-full transition-all" style="width:${pct}%;background:var(--rd-primary);"></div>
                </div>
              </div>
            ` : ''}

            <!-- Search & Sort Controls -->
            <div class="flex items-center gap-2 mb-2 shrink-0">
              <div class="flex-1 h-9 rounded-[11px] border px-2.5 flex items-center gap-2" style="background:var(--rd-sunken);border-color:var(--rd-line);">
                <span style="color:var(--rd-muted);">${icon('search', 14)}</span>
                <input id="source-switch-search-input" type="text" value="${escapeAttr(searchQ)}" oninput="onSourceSwitchSearchInput(this.value)" placeholder="筛选书源名或最新章节…" class="flex-1 min-w-0 bg-transparent text-[12px] outline-none" style="color:var(--rd-ink);" />
                <button id="source-switch-search-clear" type="button" onclick="clearSourceSwitchSearch()" class="w-5 h-5 rounded-full items-center justify-center text-[11px] rd-pressable" style="display:${searchQ ? 'inline-flex' : 'none'};background:var(--rd-surface);color:var(--rd-muted);">${icon('close', 11)}</button>
              </div>
              <button type="button" onclick="locateCurrentSwitchSource()" class="h-9 px-2.5 rounded-[11px] border text-[11px] font-medium shrink-0 rd-pressable" style="background:var(--rd-surface);border-color:var(--rd-line);color:var(--rd-primary);">定位当前</button>
            </div>

            <div class="flex items-center justify-between text-[11px] mb-2 px-0.5 shrink-0" style="color:var(--rd-muted);">
              <span>已发现 <span id="source-switch-count" class="rd-num font-semibold" style="color:var(--rd-ink);">${state.sourceSwitchSub === 'empty' && !discovering ? 0 : filteredCands.length}</span> 个候选书源</span>
              <button type="button" onclick="toggleSourceSwitchSort()" class="px-2 py-0.5 rounded-full font-medium rd-pressable" style="background:var(--rd-sunken);color:var(--rd-primary);">${sortLabel}</button>
            </div>

            <div id="source-switch-list-container" class="flex-1 min-h-0 space-y-2 overflow-y-auto rd-scroll pr-0.5">
              ${renderSourceSwitchListMarkup()}
            </div>
          </div>
        </div>
      `;
    }

    function renderScreenSourceSwitch() {
      const bgId = (state.sourceSwitchReturnScreen && state.sourceSwitchReturnScreen !== 'sourceSwitch' && state.sourceSwitchReturnScreen !== 'modals')
        ? state.sourceSwitchReturnScreen
        : 'novel';
      return `
        <div class="flex-1 flex flex-col overflow-hidden relative" style="background:var(--rd-canvas);">
          <div class="flex-1 flex flex-col overflow-hidden blur-[2.5px] pointer-events-none select-none">
            ${renderScreenById(bgId)}
          </div>
          ${renderSourceSwitchOverlay(true)}
        </div>
      `;
    }

    function getFilteredDownloadItems() {
      const q = (state.downloadSearch || '').trim().toLowerCase();
      return (state.downloadItems || []).filter(d => !q || d.t.toLowerCase().includes(q) || d.tp.toLowerCase().includes(q) || d.d.toLowerCase().includes(q));
    }

    function renderDownloadsListMarkup() {
      const allItems = state.downloadItems || [];
      if (allItems.length === 0) {
        return `
          <div class="col-span-full p-8 rounded-[14px] border text-center flex flex-col items-center gap-2.5" style="background:var(--rd-surface);border-color:var(--rd-line);">
            <div class="text-[13.5px] font-medium" style="color:var(--rd-ink);">暂无下载任务</div>
            <div class="text-[11.5px]" style="color:var(--rd-muted);">可从书籍详情或目录发起离线缓存，或恢复示例任务</div>
            <button type="button" onclick="restoreDefaultDownloads()" class="h-8 px-4 rounded-full text-[12px] font-medium mt-0.5 rd-pressable" style="background:var(--rd-primary-soft);color:var(--rd-primary);">恢复示例下载</button>
          </div>
        `;
      }
      const items = getFilteredDownloadItems();
      if (items.length === 0) {
        return `
          <div class="col-span-full p-8 rounded-[14px] border text-center flex flex-col items-center gap-2" style="background:var(--rd-surface);border-color:var(--rd-line);">
            <div class="text-[13px]" style="color:var(--rd-muted);">未找到匹配的下载任务</div>
            <button type="button" onclick="state.downloadSearch='';render()" class="h-8 px-3.5 rounded-full text-[12px] font-medium rd-pressable" style="background:var(--rd-primary-soft);color:var(--rd-primary);">清除搜索</button>
          </div>
        `;
      }
      const isSelect = state.downloadSub === 'select';
      const isEdge = state.edgeStressMode === 'edge';
      return items.map(d => {
        const isErr = d.status === 'error';
        const isDownloading = d.status === 'downloading';
        const isPaused = d.status === 'paused';
        const actLabel = isErr ? '重试' : (isDownloading ? '暂停' : (isPaused ? '继续' : '阅读'));
        const sel = Boolean((state.downloadSelected || {})[d.id]);
        const rowAct = isSelect
          ? `state.downloadSelected['${d.id}']=!state.downloadSelected['${d.id}'];render()`
          : `openDownloadChapters('${d.id}')`;
        const titleTxt = isEdge && d.id === 'd1' ? '斗破苍穹（典藏精校全本增订版·附前传外传合集）' : d.t;
        return `
          <div onclick="${rowAct}" class="p-3 rounded-[14px] border flex items-center gap-3 cursor-pointer rd-pressable" style="background:var(--rd-surface);border-color:var(--rd-line);">
            ${isSelect ? `<div class="w-5 h-5 rounded-full flex items-center justify-center shrink-0 border" style="${sel?'background:var(--rd-primary);border-color:var(--rd-primary);color:var(--rd-on-primary);':'border-color:var(--rd-line-strong);color:transparent;'}">${icon('check', 12)}</div>` : ''}
            <div class="w-11 h-[60px] rounded-[6px] overflow-hidden shrink-0" style="box-shadow:var(--rd-cover-shadow);">${bookCoverArt(titleTxt, d.tp, d.tone, isEdge && d.id === 'd1')}</div>
            <div class="flex-1 min-w-0">
              <div class="text-[14px] font-semibold truncate" style="color:var(--rd-ink);">${titleTxt}</div>
              <div class="text-[11px] rd-num mt-0.5 truncate" style="color:${isErr?'var(--rd-danger)':'var(--rd-muted)'};">${d.d}${isPaused ? ' · 已暂停' : ''}</div>
              <div class="h-1 rounded-full mt-2 overflow-hidden" style="background:var(--rd-sunken);">
                <div class="h-full rounded-full" style="width:${d.pct}%;background:${isErr?'var(--rd-danger)':'var(--rd-primary)'};"></div>
              </div>
            </div>
            <button type="button" onclick="event.stopPropagation();handleDownloadAction('${d.id}')" class="h-7 px-3 rounded-full text-[11px] font-semibold shrink-0 rd-pressable" style="${isErr?'background:var(--rd-danger-soft);color:var(--rd-danger);':isDownloading?'background:var(--rd-primary);color:var(--rd-on-primary);':'background:var(--rd-primary-soft);color:var(--rd-primary);'}">${actLabel}</button>
          </div>
        `;
      }).join('');
    }

    function renderTabletSettingsShell(activePane, rightContentHtml) {
      const collapsed = Boolean(state.wideSettingsCollapsed);
      const navItems = [
        ['general', '通用设置', 'settings'],
        ['sources', '书源管理', 'source'],
        ['shelf', '书架设置', 'shelf'],
        ['downloads', '下载管理', 'download'],
      ];
      const paneCls = {
        tab: 'anim-page-tab',
        push: 'anim-page-push',
        pop: 'anim-page-pop',
        reduced: 'anim-page-reduced',
      }[state.widePaneAnim] || '';
      return `
        <div class="flex-1 flex overflow-hidden relative" style="background:var(--rd-canvas);">
          <div class="${collapsed ? 'w-[56px]' : 'w-[164px]'} shrink-0 my-3 ml-3.5 mr-2.5 rounded-[16px] border overflow-hidden h-fit self-start select-none" style="background:var(--rd-surface);border-color:var(--rd-line);box-shadow:var(--rd-e1-shadow);">
            <div class="h-12 px-2.5 flex items-center justify-between border-b" style="border-color:var(--rd-line);">
              ${!collapsed ? `<span class="pl-0.5 text-[16px] font-semibold truncate" style="color:var(--rd-ink);">设置</span>` : ''}
              <button type="button" onclick="toggleWideSettingsCollapsed()" class="w-8 h-8 rounded-[9px] flex items-center justify-center shrink-0 ${collapsed ? 'mx-auto' : 'ml-auto'} rd-pressable" style="background:var(--rd-primary-soft);color:var(--rd-primary);" title="${collapsed ? '展开设置栏' : '收起设置栏'}">
                ${icon(collapsed ? 'panelLeftOpen' : 'panelLeftClose', 16)}
              </button>
            </div>
            ${navItems.map(([key, lbl, ico], idx) => {
              const act = activePane === key;
              return `
                <button type="button" onclick="setWideSettingsPane('${key}')" class="w-full h-12 px-2.5 flex items-center ${collapsed ? 'justify-center' : 'gap-2.5'} text-left relative rd-pressable" style="${idx>0?'border-top:1px solid var(--rd-line);':''}background:${act?'var(--rd-primary-soft)':'transparent'};" title="${lbl}">
                  ${act ? `<span class="absolute left-0 top-2.5 bottom-2.5 w-[3px] rounded-r-full" style="background:var(--rd-primary);"></span>` : ''}
                  <span class="w-8 h-8 rounded-[9px] flex items-center justify-center shrink-0" style="background:${act?'var(--rd-primary)':'var(--rd-primary-soft)'};color:${act?'var(--rd-on-primary)':'var(--rd-primary)'};">${icon(ico, 16)}</span>
                  ${!collapsed ? `<span class="text-[13.5px] font-semibold truncate" style="color:${act?'var(--rd-primary)':'var(--rd-ink)'};">${lbl}</span>` : ''}
                </button>
              `;
            }).join('')}
          </div>
          <div class="flex-1 min-w-0 mt-3 ${activePane === 'sources' ? 'mb-[84px]' : 'mb-3'} mr-3.5 rounded-[20px] border overflow-hidden flex flex-col relative" style="background:var(--rd-canvas);border-color:var(--rd-line-strong);box-shadow:var(--rd-e1-shadow);">
            <div class="flex-1 flex flex-col overflow-hidden relative ${paneCls}">
              ${rightContentHtml}
            </div>
          </div>
          ${renderBottomNav('settings')}
        </div>
      `;
    }

    function renderScreenDownloads() {
      const isTablet = state.device === 'tablet';
      const dlSheetCls = state.overlayAnim === 'reduced'
        ? 'anim-page-reduced'
        : (state.overlayAnim === 'sheet' ? (isTablet ? 'anim-modal-in' : 'anim-sheet-up') : '');
      const tempMb = +(state.downloadTempCacheMb || 0).toFixed(1);
      const totalMb = (142 + tempMb).toFixed(1);
      const tempPct = Math.max(0, Math.round((tempMb / 24) * 10));
      const isSelect = state.downloadSub === 'select';
      const isChapters = state.downloadSub === 'chapters';
      const visDownloads = getFilteredDownloadItems();
      const selCount = visDownloads.filter(d => (state.downloadSelected || {})[d.id]).length;
      const allSelected = visDownloads.length > 0 && visDownloads.every(d => (state.downloadSelected || {})[d.id]);
      const hasExternalParent = (state.navStack || []).some(e => !['settings', 'sources', 'downloads'].includes(e.screenId));
      const showBack = !isTablet || isChapters || isSelect || hasExternalParent;
      const backExpr = (isChapters || isSelect) ? "setDownloadSub('books')" : "navBack('settings')";
      const dlItem = (state.downloadItems || []).find(d => d.id === state.downloadDetailId) || (state.downloadItems || [])[0] || { id: 'd1', t: '斗破苍穹', tp: '小说', d: '420 / 1663 章' };
      const isMangaDl = dlItem.tp === '漫画';
      const chapterRows = isMangaDl ? [
        ['第 14 话 苍岚山巅', '已完成', 'success', false],
        ['第 15 话 重逢', '下载中 68%', 'primary', false],
        ['第 16 话 终末回响（最新）', '等待中', 'muted', false],
        ['第 13 话 云海迷城', state.downloadChapterRetried ? '已完成' : '请求超时 · 重试', state.downloadChapterRetried ? 'success' : 'danger', !state.downloadChapterRetried],
      ] : [
        ['第 419 章 炼药大会', '已完成', 'success', false],
        ['第 420 章 丹王古河', '下载中 68%', 'primary', false],
        ['第 421 章 异火相融', '等待中', 'muted', false],
        ['第 422 章 三纹青灵丹', state.downloadChapterRetried ? '已完成' : '请求超时 · 重试', state.downloadChapterRetried ? 'success' : 'danger', !state.downloadChapterRetried],
      ];

      const dlInnerHtml = `
        <div class="flex-1 flex flex-col overflow-hidden relative">
          ${renderFlatTopBar('下载管理', `
            ${!isChapters ? `<button type="button" onclick="setDownloadSub(state.downloadSub==='select'?'books':'select')" class="h-8 px-3 rounded-full text-[12px] font-medium rd-pressable" style="${isSelect?'background:var(--rd-primary-soft);color:var(--rd-primary);':'background:var(--rd-sunken);color:var(--rd-ink);'}">${isSelect ? '完成' : '多选'}</button>` : ''}
            <button type="button" onclick="toggleDownloadStorage(true)" class="h-8 px-3 rounded-full text-[12px] font-medium rd-pressable" style="${state.downloadStorageOpen?'background:var(--rd-primary-soft);color:var(--rd-primary);':'background:var(--rd-sunken);color:var(--rd-ink);'}">存储</button>
          `, '', backExpr, showBack)}

          <div class="flex-1 overflow-y-auto rd-scroll ${isTablet ? 'p-5 pb-24' : 'p-4'} space-y-3">
            ${isChapters ? `
              <div class="p-3 rounded-[14px] border flex items-center justify-between" style="background:var(--rd-surface);border-color:var(--rd-line);">
                <div class="min-w-0 pr-2">
                  <div class="text-[14px] font-semibold truncate" style="color:var(--rd-ink);">${dlItem.t.includes('（' + dlItem.tp + '）') ? dlItem.t : `${dlItem.t}（${dlItem.tp}）`}</div>
                  <div class="text-[11px] rd-num" style="color:var(--rd-muted);">${dlItem.d} · 缓存 ${tempMb} MB</div>
                </div>
                <button type="button" onclick="setDownloadSub('books')" class="h-8 px-3 rounded-full text-[12px] font-medium shrink-0 rd-pressable" style="background:var(--rd-primary-soft);color:var(--rd-primary);">返回列表</button>
              </div>
              <div class="rounded-[14px] border overflow-hidden" style="background:var(--rd-surface);border-color:var(--rd-line);">
                ${chapterRows.map(([t,st,c,canRetry],i) => `
                  <div class="px-3.5 h-12 flex items-center justify-between" style="${i>0?'border-top:1px solid var(--rd-line);':''}">
                    <span class="text-[13px] truncate pr-2" style="color:var(--rd-ink);">${t}</span>
                    ${canRetry ? `
                      <button type="button" onclick="retryDownloadChapter()" class="px-2.5 h-7 rounded-full text-[11px] font-semibold flex items-center shrink-0 rd-pressable" style="background:var(--rd-danger-soft);color:var(--rd-danger);">${st}</button>
                    ` : `
                      <span class="px-2.5 h-7 rounded-full text-[11px] font-medium flex items-center shrink-0" style="background:var(--rd-${c==='primary'?'primary-soft':c==='muted'?'sunken':c+'-soft'});color:var(--rd-${c==='muted'?'muted':c});">${st}</span>
                    `}
                  </div>
                `).join('')}
              </div>
            ` : `
              <div class="h-9 rounded-full px-3 flex items-center gap-2 border" style="background:var(--rd-sunken);border-color:var(--rd-line);">
                <span style="color:var(--rd-muted);">${icon('search', 15)}</span>
                <input id="downloads-search-input" type="text" value="${escapeAttr(state.downloadSearch)}" oninput="onDownloadSearchInput(this.value)" placeholder="筛选书籍或来源…" class="flex-1 min-w-0 h-full bg-transparent text-[13px] outline-none" style="color:var(--rd-ink);" />
                <button id="downloads-search-clear" type="button" onclick="state.downloadSearch='';render()" class="w-5 h-5 rounded-full items-center justify-center shrink-0 rd-pressable" style="display:${state.downloadSearch?'inline-flex':'none'};background:var(--rd-line-strong);color:var(--rd-elevated);">${icon('close', 11)}</button>
              </div>
              ${isSelect ? `
                <div class="p-2.5 rounded-[14px] border flex items-center justify-between gap-2" style="background:var(--rd-surface);border-color:var(--rd-line);">
                  <span id="downloads-select-count" class="text-[12px] font-medium rd-num px-1" style="color:var(--rd-muted);">已选择 ${selCount} / ${visDownloads.length} 项</span>
                  <div class="flex items-center gap-1.5">
                    <button id="downloads-select-all-btn" type="button" onclick="runDownloadBatchAction('selectAll')" class="h-7 px-2.5 rounded-full text-[11.5px] font-medium rd-pressable" style="background:var(--rd-sunken);color:var(--rd-ink);">${allSelected ? '取消全选' : '全选'}</button>
                    <button type="button" onclick="runDownloadBatchAction('pause')" class="h-7 px-2.5 rounded-full text-[11.5px] font-medium rd-pressable" style="background:var(--rd-sunken);color:var(--rd-ink);">暂停所选</button>
                    <button type="button" onclick="runDownloadBatchAction('resume')" class="h-7 px-2.5 rounded-full text-[11.5px] font-medium rd-pressable" style="background:var(--rd-primary-soft);color:var(--rd-primary);">继续所选</button>
                    <button type="button" onclick="runDownloadBatchAction('delete')" class="h-7 px-2.5 rounded-full text-[11.5px] font-medium rd-pressable" style="background:var(--rd-danger-soft);color:var(--rd-danger);">移除</button>
                  </div>
                </div>
              ` : ''}
              <div id="downloads-list-region" class="${isTablet ? 'grid grid-cols-2 gap-2.5' : 'space-y-2.5'}">
                ${renderDownloadsListMarkup()}
              </div>
            `}
          </div>
        </div>
      `;

      const storageBodyHtml = `
        <div class="flex items-center justify-between mb-3">
          <div class="text-[18px] font-semibold" style="color:var(--rd-ink);">存储与缓存设置</div>
          <button type="button" onclick="toggleDownloadStorage(false)" class="w-8 h-8 rounded-full flex items-center justify-center rd-pressable" style="background:var(--rd-sunken);color:var(--rd-muted);">${icon('close', 16)}</button>
        </div>
        <div class="p-3.5 rounded-[14px] mb-3" style="background:var(--rd-sunken);">
          <div class="flex items-center justify-between text-[12px] mb-2">
            <span style="color:var(--rd-muted);">已占用空间</span>
            <span class="rd-num font-semibold" style="color:var(--rd-ink);">${totalMb} MB / 2.0 GB</span>
          </div>
          <div class="h-2 rounded-full overflow-hidden flex gap-0.5" style="background:var(--rd-line);">
            <div class="h-full" style="width:12%;background:var(--rd-primary);"></div>
            ${tempPct > 0 ? `<div class="h-full" style="width:${tempPct}%;background:var(--rd-seal);"></div>` : ''}
          </div>
          <div class="flex items-center gap-4 mt-2 text-[11px] rd-num" style="color:var(--rd-muted);">
            <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full" style="background:var(--rd-primary);"></span>永久下载 142MB</span>
            <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full" style="background:var(--rd-seal);"></span>临时缓存 ${tempMb}MB</span>
          </div>
        </div>
        <div class="rounded-[14px] overflow-hidden mb-3" style="background:var(--rd-sunken);">
          <div class="px-3.5 h-11 flex items-center justify-between"><span class="text-[13px]" style="color:var(--rd-ink);">阅读时自动预缓存</span>${renderToggle(state.downloadAutoPrecache, "state.downloadAutoPrecache=!state.downloadAutoPrecache;render()")}</div>

        <div onclick="closeModal()" class="absolute inset-0 z-30 flex flex-col items-center pt-12 p-4" style="background:rgba(15,24,20,0.16);">
          <div onclick="event.stopPropagation()" class="w-full max-w-[344px] p-3.5 rounded-[14px] border flex items-start gap-3 ${modalEnterCls}" style="background:var(--rd-elevated);border-color:var(--rd-seal);box-shadow:var(--rd-e3-shadow);">

              <div class="flex gap-2 mt-2.5">
                <button type="button" onclick="closeModal()" class="h-7 px-3 rounded-full text-[11px] font-semibold rd-pressable" style="background:var(--rd-primary);color:var(--rd-on-primary);">核对保存结果</button>
                <button type="button" onclick="closeModal()" class="h-7 px-3 rounded-full text-[11px] font-medium rd-pressable" style="background:var(--rd-sunken);color:var(--rd-ink);">忽略</button>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function renderScreenModals() {
      const demoDefaultBg = {
        remove: 'bookshelf',
        localImport: 'bookshelf',
        groupEdit: 'bookshelf',
      };
      const ret = state.modalReturnScreen;
      const bgId = (ret && ret !== 'modals' && ret !== 'sourceSwitch')
        ? ret
        : (demoDefaultBg[state.modalDemo] || 'settings');
      return `
        <div class="flex-1 flex flex-col overflow-hidden relative" style="background:var(--rd-canvas);">
          <div class="flex-1 flex flex-col overflow-hidden blur-[2.5px] pointer-events-none select-none">
            ${renderScreenById(bgId)}
          </div>
          ${renderModalOverlay(state.modalDemo, true)}
        </div>
      `;
    }

    function renderScreenById(id) {
      switch (id) {
        case 'bookshelf': return renderScreenBookshelf();
        case 'search': return renderScreenSearch();
        case 'detail': return renderScreenDetail();
        case 'directory': return renderScreenDirectory();
        case 'novel': return renderScreenNovel();
        case 'manga': return renderScreenManga();
        case 'sourceSwitch': return renderScreenSourceSwitch();
        case 'downloads': return renderScreenDownloads();
        case 'sources': return renderScreenSources();
        case 'settings': return renderScreenSettings();
        case 'modals': return renderScreenModals();
        default: return renderScreenBookshelf();
      }
    }

    function renderActiveScreen() {
      return renderScreenById(state.screenId);
    }

    // =========================================================================
    // TAB 1: 全页面交互设计稿
    // =========================================================================
    function renderStudioStateBar() {
      const btnCls = (act) => `h-7 px-2.5 rounded-lg text-[11px] font-medium transition-colors ${act ? 'bg-[var(--primary)] text-[var(--primary-foreground)]' : 'bg-[var(--background)] text-[var(--foreground)] border border-[var(--border)] hover:border-[var(--primary)]'}`;

      if (state.activeSourceSwitch || state.screenId === 'sourceSwitch') {
        const discovering = !!state.sourceSwitchDiscovering || state.sourceSwitchSub === 'discovering';
        return `
          <div class="w-full max-w-[680px] rounded-2xl border border-[var(--border)] bg-[var(--card)] px-3 py-2.5 mb-3 flex items-center gap-2 flex-wrap">
            <span class="text-[11px] font-semibold text-[var(--muted-foreground)] shrink-0">换源状态：</span>
            <button type="button" onclick="stopSourceSwitchDiscovery(true);state.sourceSwitchSub='list';render()" class="${btnCls(!discovering && state.sourceSwitchSub==='list')}">候选列表</button>
            <button type="button" onclick="startSourceSwitchDiscovery()" class="${btnCls(discovering)}">并发查找中</button>
            <button type="button" onclick="stopSourceSwitchDiscovery(true);state.sourceSwitchSub='empty';render()" class="${btnCls(!discovering && state.sourceSwitchSub==='empty')}">无可用源</button>
            ${state.activeSourceSwitch ? `<button type="button" onclick="closeSourceSwitch()" class="${btnCls(false)}">收起浮层</button>` : ''}
          </div>
        `;
      }

      if (state.activeModal || state.screenId === 'modals') {
        const curKey = state.activeModal || state.modalDemo;
        const setDemoExpr = (k) => state.activeModal
          ? `state.modalDemo='${k}';state.activeModal='${k}';state.overlayAnim='modal';render()`
          : `setModalDemo('${k}')`;
        return `
          <div class="w-full max-w-[680px] rounded-2xl border border-[var(--border)] bg-[var(--card)] px-3 py-2.5 mb-3 flex items-center gap-2 flex-wrap">
            <span class="text-[11px] font-semibold text-[var(--muted-foreground)] shrink-0">弹窗与反馈预览：</span>
            ${[
              ['restore', '恢复默认弹窗'],
              ['remove', '移除书架弹窗'],
              ['localImport', '本地导入弹窗'],
              ['groupEdit', '编辑分组弹窗'],
              ['toast', '顶部 Toast'],
              ['recovery', '恢复横幅'],
            ].map(([k, lbl]) => `<button type="button" onclick="${setDemoExpr(k)}" class="${btnCls(curKey===k)}">${lbl}</button>`).join('')}
            <button type="button" onclick="previewSourcePage('import')" class="${btnCls(false)}">三步导入书源</button>
            ${state.activeModal ? `<button type="button" onclick="closeModal()" class="${btnCls(false)}">关闭弹窗</button>` : ''}
          </div>
        `;
      }

      if (state.screenId === 'novel') {
        const barItems = [
          ['home', '总控（含亮度轨）'],
          ['autoPage', '翻页（全宽）'],
          ['tts', '朗读（全宽）'],
          ['appearance', '界面（全宽）'],
          ['settings', '设置（全宽）'],
        ];
        const sheetItems = [
          ['directory', '目录抽屉'],
          ['search', '搜索抽屉'],
          ['replace', '替换抽屉'],
          ['autoPageMore', '翻页›更多配置'],
          ['ttsMore', '朗读›音色与更多'],
          ['appearanceMore', '界面›更多排版'],
          ['settingsMore', '设置›更多设置'],
        ];
        return `
          <div class="w-full max-w-[740px] rounded-2xl border border-[var(--border)] bg-[var(--card)] p-3 mb-3 space-y-2">
            <div class="flex items-center gap-1.5 flex-wrap">
              <span class="text-[11px] font-semibold text-[var(--muted-foreground)] shrink-0">底部 330vp 悬浮控制栏（纯 4 圆钮切换）：</span>
              ${barItems.map(([m, lbl]) => {
                const act = state.novelSheet === 'none' && !state.novelTopMenuOpen && state.novelCtrlMode === 'open' && state.novelModule === m;
                return `<button type="button" onclick="setNovelModule('${m}',true)" class="${btnCls(act)}">${lbl}</button>`;
              }).join('')}
              <button type="button" onclick="launchNovelCapsule('tts')" class="${btnCls(state.novelSheet==='none' && state.novelCtrlMode==='hidden' && state.novelSession==='tts')}">朗读胶囊</button>
              <button type="button" onclick="launchNovelCapsule('autoPage')" class="${btnCls(state.novelSheet==='none' && state.novelCtrlMode==='hidden' && state.novelSession==='autoPage')}">翻页胶囊</button>
              <button type="button" onclick="state.novelSheet='none';state.novelTopMenuOpen=false;state.novelSession='none';state.novelTtsStatus='idle';state.novelAutoStatus='idle';setNovelCtrlMode('hidden')" class="${btnCls(state.novelSheet==='none' && state.novelCtrlMode==='hidden' && state.novelSession==='none')}">沉浸隐藏</button>
            </div>
            <div class="flex items-center gap-1.5 flex-wrap pt-2 border-t border-[var(--border)]">
              <span class="text-[11px] font-semibold text-[var(--muted-foreground)] shrink-0">78% 同风格独立抽屉 &amp; 克制顶栏菜单：</span>
              <button type="button" onclick="setNovelSheet('none');toggleNovelTopMenu(false)" class="${btnCls(state.novelSheet==='none' && !state.novelTopMenuOpen)}">关闭弹窗</button>
              <button type="button" onclick="state.novelSheet='none';state.novelCtrlMode='open';toggleNovelTopMenu()" class="${btnCls(state.novelSheet==='none' && state.novelTopMenuOpen)}">顶栏 ··· 菜单</button>
              ${sheetItems.map(([sk, lbl]) => {
                const act = state.novelSheet === sk;
                return `<button type="button" onclick="setNovelSheet('${sk}')" class="${btnCls(act)}">${lbl}</button>`;
              }).join('')}
            </div>
          </div>
        `;
      }

      const map = {
        bookshelf: {
          title: '书架状态',
          items: [
            ['列表模式', "state.shelfSearchMode='idle';state.shelfOverlay='none';setShelfMode('list')", () => state.shelfSearchMode==='idle'&&state.shelfMode==='list'&&state.shelfOverlay==='none'],
            ['封面网格', "state.shelfSearchMode='idle';state.shelfOverlay='none';setShelfMode('cover')", () => state.shelfSearchMode==='idle'&&state.shelfMode==='cover'&&state.shelfOverlay==='none'],
            ['筛选展开', "state.shelfSearchMode='idle';state.shelfOverlay='none';toggleShelfFilter()", () => state.shelfSearchMode==='idle'&&state.shelfFilterOpen],
            ['更多菜单', "state.shelfSearchMode='idle';setShelfOverlay('more')", () => state.shelfSearchMode==='idle'&&state.shelfOverlay==='more'],
            ['单书操作', "state.shelfSearchMode='idle';setShelfOverlay('bookActions')", () => state.shelfSearchMode==='idle'&&state.shelfOverlay==='bookActions'],
            ['多选管理', "state.shelfSearchMode='idle';setShelfOverlay('multiSelect')", () => state.shelfSearchMode==='idle'&&state.shelfOverlay==='multiSelect'],
            ['空书架', "state.shelfSearchMode='idle';state.shelfOverlay='none';setShelfMode('empty')", () => state.shelfSearchMode==='idle'&&state.shelfMode==='empty'],
            ['共享搜索展开', "openShelfSearch()", () => state.shelfSearchMode==='input'],
            ['搜索结果态', "submitShelfSearch(state.shelfSearchQuery||'斗破苍穹')", () => state.shelfSearchMode==='results'],
          ],
        },
        search: {
          title: '搜索状态',
          items: [
            ['初始历史', "state.searchSub='initial';render()", () => state.searchSub==='initial'],
            ['搜索结果', "state.searchSub='results';render()", () => state.searchSub==='results'],
            ['无可用书源', "state.searchSub='empty';render()", () => state.searchSub==='empty'],
          ],
        },
        manga: {
          title: '漫画状态',
          items: [
            ['极简控制', "setMangaSub('controls')", () => state.mangaCtrlMode==='open' && state.mangaSub==='controls'],
            ['沉浸隐藏', "setMangaCtrlMode('hidden')", () => state.mangaCtrlMode==='hidden'],
            ['目录 Sheet', "setMangaSub('directory')", () => state.mangaCtrlMode==='open' && state.mangaSub==='directory'],
            ['阅读方式 Sheet', "setMangaSub('mode')", () => state.mangaCtrlMode==='open' && state.mangaSub==='mode'],
            ['漫画设置 Sheet', "setMangaSub('settings')", () => state.mangaCtrlMode==='open' && state.mangaSub==='settings'],
            ['更多操作 Sheet', "setMangaSub('more')", () => state.mangaCtrlMode==='open' && state.mangaSub==='more'],
            ['章末上拉提示', "setMangaSub('pullEnd')", () => state.mangaCtrlMode==='open' && state.mangaSub==='pullEnd'],
          ],
        },
        downloads: {
          title: '下载管理视图',
          items: [
            ['书籍队列', "state.downloadStorageOpen=false;setDownloadSub('books',{pushHistory:false})", () => !state.downloadStorageOpen && state.downloadSub==='books'],
            ['章节明细', "state.downloadStorageOpen=false;setDownloadSub('chapters',{pushHistory:false})", () => !state.downloadStorageOpen && state.downloadSub==='chapters'],
            ['批量选择', "state.downloadStorageOpen=false;setDownloadSub('select',{pushHistory:false})", () => !state.downloadStorageOpen && state.downloadSub==='select'],
            ['存储设置 Sheet', "toggleDownloadStorage(true)", () => Boolean(state.downloadStorageOpen)],
          ],
        },
        settings: {
          title: '设置页面层级',
          items: [
            ['设置首页', "setSettingsSub('home',{pushHistory:false})", () => state.settingsSub==='home'],
            ['通用设置', "setSettingsSub('general',{pushHistory:false})", () => state.settingsSub==='general'],
            ['书架设置', "setSettingsSub('shelf',{pushHistory:false})", () => state.settingsSub==='shelf'],
          ],
        },
      };

      const cfg = map[state.screenId];
      if (!cfg) return '';
      return `
        <div class="w-full max-w-[680px] rounded-2xl border border-[var(--border)] bg-[var(--card)] px-3 py-2.5 mb-3 flex items-center gap-2 flex-wrap">
          <span class="text-[11px] font-semibold text-[var(--muted-foreground)] shrink-0">${cfg.title}：</span>
          ${cfg.items.map(([lbl, act, isAct]) => `<button type="button" onclick="${act}" class="${btnCls(isAct())}">${lbl}</button>`).join('')}
        </div>
      `;
    }

    function renderTabScreens() {
      const current = SCREENS.find(s => s.id === state.screenId) || SCREENS[0];
      const groups = [...new Set(SCREENS.map(s => s.group))];
      const devWidth = state.device === 'tablet' ? '780px' : '388px';
      const devHeight = state.device === 'tablet' ? '560px' : '790px';
      const wideCompareBar = state.device === 'tablet' ? `
        <div class="max-w-[780px] w-full rounded-2xl border border-[var(--border)] bg-[var(--card)] px-3 py-2 mb-3 flex items-center gap-3 flex-wrap text-[11px]">
          <div class="flex items-center gap-1.5">
            <span class="font-semibold text-[var(--muted-foreground)]">控制岛:</span>
            ${[['center','底部居中 356px'],['right','右下停靠 356px']].map(([k, lbl]) => `
              <button type="button" onclick="setWideDockAlign('${k}')" class="px-2.5 py-1 rounded-lg font-medium border transition-colors ${state.wideDockAlign===k ? 'bg-[var(--primary)] text-[var(--primary-foreground)] border-[var(--primary)]' : 'bg-[var(--background)] text-[var(--foreground)] border-[var(--border)]'}">${lbl}</button>
            `).join('')}
          </div>
          <div class="flex items-center gap-1.5">
            <span class="font-semibold text-[var(--muted-foreground)]">小说正文:</span>
            ${[['spread','双栏对开'],['single','单栏居中']].map(([k, lbl]) => `
              <button type="button" onclick="setWideNovelColumns('${k}')" class="px-2.5 py-1 rounded-lg font-medium border transition-colors ${state.wideNovelColumns===k ? 'bg-[var(--primary)] text-[var(--primary-foreground)] border-[var(--primary)]' : 'bg-[var(--background)] text-[var(--foreground)] border-[var(--border)]'}">${lbl}</button>
            `).join('')}
          </div>
          <div class="flex items-center gap-1.5">
            <span class="font-semibold text-[var(--muted-foreground)]">设置侧栏:</span>
            <button type="button" onclick="toggleWideSettingsCollapsed(false)" class="px-2.5 py-1 rounded-lg font-medium border transition-colors ${!state.wideSettingsCollapsed ? 'bg-[var(--primary)] text-[var(--primary-foreground)] border-[var(--primary)]' : 'bg-[var(--background)] text-[var(--foreground)] border-[var(--border)]'}">展开(图标+字)</button>
            <button type="button" onclick="toggleWideSettingsCollapsed(true)" class="px-2.5 py-1 rounded-lg font-medium border transition-colors ${state.wideSettingsCollapsed ? 'bg-[var(--primary)] text-[var(--primary-foreground)] border-[var(--primary)]' : 'bg-[var(--background)] text-[var(--foreground)] border-[var(--border)]'}">收起(仅图标)</button>
          </div>
        </div>
      ` : '';
      const reduced = isReduceMotion();
      const mul = state.motionSlow ? 2.5 : 1;
      const pageAnimMap = {
        push: 'anim-page-push',
        pop: 'anim-page-pop',
        tab: 'anim-page-tab',
        open: 'anim-page-open',
        fade: 'anim-page-fade',
        reduced: 'anim-page-reduced',
      };
      const pageAnimCls = pageAnimMap[state.screenTransition] || '';
      const novelBgActive = state.screenId === 'novel'
        || (state.screenId === 'sourceSwitch' && (!state.sourceSwitchReturnScreen || state.sourceSwitchReturnScreen === 'novel'))
        || (state.screenId === 'modals' && state.modalReturnScreen === 'novel');
      const activePaper = novelBgActive ? (READING_PAPERS.find(p => p.id === state.novelPaper) || READING_PAPERS[2]) : null;
      const statusBg = activePaper ? activePaper.bg : 'var(--rd-canvas)';
      const statusInk = activePaper ? activePaper.ink : 'var(--rd-ink)';
      const homeBarLine = activePaper ? activePaper.meta : 'var(--rd-line-strong)';
      const hasSourceModal = state.screenId === 'sources' && Boolean(state.sourceModal);
      const hasLiveOverlay = Boolean(state.activeSourceSwitch || state.activeModal || hasSourceModal);

      return `
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-5 items-start">
          <!-- Left: Screen Selector -->
          <aside class="${state.device === 'tablet' ? 'lg:col-span-2' : 'lg:col-span-3'} rounded-2xl border border-[var(--border)] bg-[var(--card)] p-3 space-y-3">
            <div class="px-2 pt-1 flex items-center justify-between">
              <span class="text-xs font-semibold uppercase tracking-wider text-[var(--muted-foreground)]">全部页面与状态 (11)</span>
            </div>
            ${groups.map(g => `
              <div>
                <div class="px-2 pb-1 text-[11px] font-medium text-[var(--muted-foreground)]">${g}</div>
                <div class="space-y-1">
                  ${SCREENS.filter(s => s.group === g).map(s => {
                    const act = s.id === state.screenId;
                    return `<button type="button" onclick="setScreen('${s.id}',{resetStack:true})" class="w-full px-3 py-2 rounded-xl text-left transition-colors flex items-center justify-between gap-2 ${act ? 'bg-[var(--primary)] text-[var(--primary-foreground)]' : 'hover:bg-[var(--background)] text-[var(--foreground)]'}">
                      <span class="text-xs font-medium truncate">${s.name}</span>
                      <span class="text-[10px] shrink-0 opacity-75">${act ? '●' : '›'}</span>
                    </button>
                    ${act && s.id === 'sources' ? `
                      <div class="flex flex-wrap gap-1 px-1 pb-1">
                        ${renderSourcePageShortcuts(selected => `rounded-lg px-2 py-1 text-[11px] ${selected ? 'bg-[var(--primary)] text-[var(--primary-foreground)]' : 'hover:bg-[var(--background)]'}`)}
                      </div>
                    ` : ''}`;
                  }).join('')}
                </div>
              </div>
            `).join('')}
          </aside>

          <!-- Center: Studio State Switcher + Interactive Device Preview -->
          <section class="${state.device === 'tablet' ? 'lg:col-span-7' : 'lg:col-span-6'} flex flex-col items-center">
            ${renderStudioStateBar()}
            ${wideCompareBar}
            <div class="device-shell ${state.device==='tablet'?'tablet-mode':''}" style="width:min(100%, ${devWidth});height:${devHeight};">
              <div class="device-screen rd-scope ${reduced ? 'rd-motion-reduced' : ''}" data-rd-theme="${state.theme}" data-rd-font-scale="${state.edgeStressMode==='largeFont'?'large':'normal'}" style="--rd-motion-mul:${mul};">
                <!-- Simulated HarmonyOS Status Bar -->
                <div class="h-7 px-6 flex items-center justify-between text-[11px] font-semibold shrink-0 select-none" style="background:${statusBg};color:${statusInk};">
                  <span class="rd-num">09:41</span>
                  <div class="flex items-center gap-1.5 text-[10px] rd-num">
                    <span>5G</span>
                    <span class="px-1.5 py-[1px] rounded border text-[9px]" style="border-color:currentColor;">100</span>
                  </div>
                </div>
                <!-- Live Screen Content -->
                <div id="device-screen-stage" class="flex-1 flex flex-col overflow-hidden relative">
                  <div id="device-screen-content" class="flex-1 flex flex-col overflow-hidden relative ${pageAnimCls} ${hasLiveOverlay ? 'blur-[2.5px] pointer-events-none select-none' : ''}" ${hasSourceModal ? 'inert' : ''}>
                    ${renderActiveScreen()}

                  ${state.activeModal ? renderModalOverlay(state.activeModal, false) : ''}
                  ${hasSourceModal ? renderSourceModal() : ''}
                  ${state.appToast ? `
                    <div class="absolute top-16 left-0 right-0 mx-auto w-fit z-50 px-3.5 py-1.5 rounded-full text-[12px] font-medium anim-toast-down pointer-events-none whitespace-nowrap" style="background:var(--rd-primary);color:var(--rd-on-primary);box-shadow:var(--rd-e3-shadow);">${escHtml(state.appToast)}</div>
                  ` : ''}
                </div>
                <!-- Simulated Home Indicator -->
                <div class="h-4 flex items-center justify-center shrink-0 select-none" style="background:${statusBg};">
                  <div class="w-28 h-1 rounded-full" style="background:${homeBarLine};"></div>
                </div>
              </div>
            </div>
            <div class="mt-3 flex flex-wrap items-center justify-center gap-2 text-[11px]">
              <span class="font-medium text-[var(--muted-foreground)]">动效预览：</span>
              <button type="button" onclick="state.motionSlow=false;render()" class="h-7 px-2.5 rounded-lg border font-medium transition-colors ${!state.motionSlow?'bg-[var(--primary)] text-[var(--primary-foreground)] border-transparent':'border-[var(--border)] bg-[var(--card)] text-[var(--foreground)]'}">1× 产品节奏</button>
              <button type="button" onclick="state.motionSlow=true;render()" class="h-7 px-2.5 rounded-lg border font-medium transition-colors ${state.motionSlow?'bg-[var(--primary)] text-[var(--primary-foreground)] border-transparent':'border-[var(--border)] bg-[var(--card)] text-[var(--foreground)]'}">0.4× 慢放观察</button>
              <button type="button" onclick="setReduceMotion(!isReduceMotion())" class="h-7 px-2.5 rounded-lg border font-medium transition-colors ${reduced?'bg-[var(--primary)] text-[var(--primary-foreground)] border-transparent':'border-[var(--border)] bg-[var(--card)] text-[var(--foreground)]'}">${reduced?'已开启：减少动态 (120ms淡入)':'减少动态 (120ms淡入)'}</button>
            </div>
            <div class="mt-2 flex flex-wrap items-center justify-center gap-2 text-[11px]">
              <span class="font-medium text-[var(--muted-foreground)]">边界态测试：</span>
              ${[
                ['normal', '标准内容'],
                ['edge', '无封面 + 超长标题'],
                ['largeFont', '1.35× 大字号'],
              ].map(([k, l]) => {
                const act = state.edgeStressMode === k;
                return `<button type="button" onclick="setEdgeStressMode('${k}')" class="h-7 px-2.5 rounded-lg border font-medium transition-colors ${act?'bg-[var(--primary)] text-[var(--primary-foreground)] border-transparent':'border-[var(--border)] bg-[var(--card)] text-[var(--foreground)]'}">${l}</button>`;
              }).join('')}
            </div>
            <p class="mt-2 text-xs text-[var(--muted-foreground)] text-center">提示：设备画面内所有按钮、主题色块、滑块、开关、子状态与弹窗均可直接点击交互</p>
          </section>

          <!-- Right: Design Spec & Refactor Notes -->
          <aside class="lg:col-span-3 rounded-2xl border border-[var(--border)] bg-[var(--card)] p-4 space-y-4">

      render();
      appToastTimer = setTimeout(() => {
        state.appToast = '';
        render();
      }, 2000);
    }
    window.showAppToast = showAppToast;
    window.setEdgeStressMode = (mode) => {
      state.edgeStressMode = mode;
      render();
    };
    window.scrollListContainer = (containerId, pos) => {
      const el = document.getElementById(containerId);
      if (!el) return;
      const targetTop = pos === 'top' ? 0 : Math.max(0, el.scrollHeight || 99999);
      if (typeof el.scrollTo === 'function') {
        el.scrollTo({ top: targetTop, behavior: 'smooth' });
      }
      el.scrollTop = targetTop;
    };
    window.onDirSearchInput = (val) => {
      state.dirSearch = val;
      const listEl = document.getElementById('dir-list-region');
      if (listEl) listEl.innerHTML = renderDirectoryListMarkup();
      const clearEl = document.getElementById('dir-search-clear');
      if (clearEl && clearEl.style) clearEl.style.display = val ? 'inline-flex' : 'none';
    };
    window.locateDirCurrent = () => {
      state.dirSearch = '';
      state.dirReversed = false;
      const book = getActiveBook();
      const isManga = book.target === 'manga';
      const curTitle = isManga
        ? `第 ${MANGA_CHAPTERS[Math.min(state.mangaChapterIdx, MANGA_CHAPTERS.length - 1)] || MANGA_CHAPTERS[0]}`
        : getNovelChapter(state.novelChapterIdx).title;
      showAppToast('已定位在读：' + curTitle);
      const listEl = document.getElementById('dir-list-region');
      const curEl = listEl && typeof listEl.querySelector === 'function' ? listEl.querySelector('[data-current-chapter="true"]') : null;
      if (curEl && typeof curEl.scrollIntoView === 'function') {
        curEl.scrollIntoView({ block: 'center', behavior: isReduceMotion() ? 'auto' : 'smooth' });
      }
    };
    window.onNovelDirSearchInput = (val) => {
      state.novelDirSearch = val;
      const listEl = document.getElementById('novel-dir-list');
      if (listEl) listEl.innerHTML = renderNovelDirListMarkup();
      const clrEl = document.getElementById('novel-dir-search-clear');
      if (clrEl && clrEl.style) clrEl.style.display = val ? 'inline-flex' : 'none';
    };
    window.locateNovelDirCurrent = () => {
      state.novelDirSearch = '';
      state.novelDirReversed = false;
      const ch = getNovelChapter(state.novelChapterIdx).title;
      showReaderToast('novel', '已定位在读：' + ch);
      const listEl = document.getElementById('novel-dir-list');
      const curEl = listEl && typeof listEl.querySelector === 'function' ? listEl.querySelector('[data-current-chapter="true"]') : null;
      if (curEl && typeof curEl.scrollIntoView === 'function') {
        curEl.scrollIntoView({ block: 'center', behavior: isReduceMotion() ? 'auto' : 'smooth' });
      }
    };
    window.runNovelContentSearch = () => {
      const q = (state.novelSearchQuery || '').trim() || '萧炎';
      showReaderToast('novel', '已检出「' + q + '」相关匹配章节');
    };
    window.addNovelReplaceRule = () => {
      const n = state.novelRules.length + 1;
      state.novelRules.push({
        id: 'r' + n,
        name: n === 2 ? '去除章末求票尾注' : '自定义净化规则 #' + n,
        pattern: n === 2 ? 'PS：.*求推荐.* → 空' : '\\[广告.*?\\] → 空',
        on: true,
      });
      showReaderToast('novel', '已新增净化规则');
    };
    window.toggleNovelReplaceRule = (id) => {
      const rule = (state.novelRules || []).find(r => r.id === id);
      if (!rule) return;
      rule.on = !rule.on;
      render();
    };
    window.onMangaDirSearchInput = (val) => {
      state.mangaDirSearch = val;
      const listEl = document.getElementById('manga-dir-list');
      if (listEl) listEl.innerHTML = renderMangaDirListMarkup();
      const clrEl = document.getElementById('manga-dir-search-clear');
      if (clrEl && clrEl.style) clrEl.style.display = val ? 'inline-flex' : 'none';
    };
    window.locateMangaDirCurrent = () => {
      state.mangaDirSearch = '';
      state.mangaDirReversed = false;
      const ch = MANGA_CHAPTERS[state.mangaChapterIdx] || MANGA_CHAPTERS[5];
      showReaderToast('manga', '已定位在读：第 ' + ch);
      const listEl = document.getElementById('manga-dir-list');
      const curEl = listEl && typeof listEl.querySelector === 'function' ? listEl.querySelector('[data-current-chapter="true"]') : null;
      if (curEl && typeof curEl.scrollIntoView === 'function') {
        curEl.scrollIntoView({ block: 'center', behavior: isReduceMotion() ? 'auto' : 'smooth' });
      }
    };
    window.selectMangaChapter = (idx) => {
      const clamped = Math.max(0, Math.min(MANGA_CHAPTERS.length - 1, parseInt(idx, 10) || 0));
      state.mangaChapterIdx = clamped;
      state.mangaPage = 1;
      state.mangaSub = 'controls';
      syncActiveBookProgress('manga');
      showReaderToast('manga', '已切换至 第 ' + (MANGA_CHAPTERS[clamped] || '当前话'));
    };
    window.onDownloadSearchInput = (val) => {
      state.downloadSearch = val;
      const listEl = document.getElementById('downloads-list-region');
      if (listEl) listEl.innerHTML = renderDownloadsListMarkup();
      const clrEl = document.getElementById('downloads-search-clear');
      if (clrEl && clrEl.style) clrEl.style.display = val ? 'inline-flex' : 'none';
      const vis = getFilteredDownloadItems();
      const selCnt = vis.filter(d => (state.downloadSelected || {})[d.id]).length;
      const allOn = vis.length > 0 && vis.every(d => (state.downloadSelected || {})[d.id]);
      const cntEl = document.getElementById('downloads-select-count');
      if (cntEl) cntEl.textContent = `已选择 ${selCnt} / ${vis.length} 项`;
      const allBtn = document.getElementById('downloads-select-all-btn');
      if (allBtn) allBtn.textContent = allOn ? '取消全选' : '全选';
    };
    window.handleDownloadAction = (id) => {
      const item = (state.downloadItems || []).find(d => d.id === id);
      if (!item) return;
      if (item.status === 'done') {
        const target = item.tp === '漫画' ? 'manga' : 'novel';
        const matched = (state.shelfBooks || []).find(b =>
          b.target === target && (b.title === item.t || item.t.startsWith(b.title + '（'))
        );
        if (matched) {
          selectActiveBook(matched);
        }
        setScreen(target);
        return;
      }
      if (item.status === 'downloading') {
        item.status = 'paused';
        showAppToast('已暂停《' + item.t + '》下载');
      } else if (item.status === 'paused') {
        item.status = 'downloading';
        showAppToast('已恢复《' + item.t + '》下载');
      } else {
        item.status = 'downloading';
        item.pct = 78;
        item.d = '重试恢复中 · 剩余 2 话';
        showAppToast('正在重试《' + item.t + '》');
      }
    };
    window.clearDownloadTempCache = () => {
      if (state.downloadTempCacheMb <= 0) {
        showAppToast('临时缓存已清空，无需清理');
        return;
      }
      const freed = state.downloadTempCacheMb.toFixed(1);
      state.downloadTempCacheMb = 0;
      state.downloadStorageOpen = false;
      state.downloadSub = 'books';
      showAppToast('已清理 ' + freed + ' MB 临时缓存');
    };
    window.restoreDefaultDownloads = () => {
      state.downloadItems = DEFAULT_DOWNLOAD_ITEMS();
      state.downloadSearch = '';
      state.downloadSelected = { d1: true, d2: false, d3: false };
      showAppToast('已恢复默认示例下载任务');
    };
    window.runDownloadBatchAction = (act) => {
      const allItems = state.downloadItems || [];
      const visItems = getFilteredDownloadItems();
      if (act === 'selectAll') {
        const allOn = visItems.length > 0 && visItems.every(d => (state.downloadSelected || {})[d.id]);
        const next = Object.assign({}, state.downloadSelected || {});
        visItems.forEach(d => { next[d.id] = !allOn; });
        state.downloadSelected = next;
        render();
        return;
      }
      const sel = visItems.filter(d => (state.downloadSelected || {})[d.id]);
      if (sel.length === 0) {
        showAppToast('请先勾选当前列表中的下载任务');
        return;
      }
      if (act === 'pause') {
        sel.forEach(d => { if (d.status !== 'done') d.status = 'paused'; });
        showAppToast('已暂停 ' + sel.length + ' 项下载任务');
      } else if (act === 'resume') {
        sel.forEach(d => { if (d.status !== 'done') d.status = 'downloading'; });
        showAppToast('已继续 ' + sel.length + ' 项下载任务');
      } else if (act === 'delete') {
        const selIds = new Set(sel.map(d => d.id));
        state.downloadItems = allItems.filter(d => !selIds.has(d.id));
        const nextSel = Object.assign({}, state.downloadSelected || {});
        selIds.forEach(id => delete nextSel[id]);
        state.downloadSelected = nextSel;
        if (state.downloadItems.length === 0) state.downloadSub = 'books';
        showAppToast('已移除 ' + sel.length + ' 项下载记录');
      }
    };
    window.setWideDockAlign = (v) => {
      state.wideDockAlign = v === 'right' ? 'right' : 'center';
      render();
    };
    window.setWideNovelColumns = (v) => {
      state.wideNovelColumns = v === 'single' ? 'single' : 'spread';
      render();
    };
    window.toggleWideSettingsCollapsed = (forceVal) => {
      state.wideSettingsCollapsed = typeof forceVal === 'boolean' ? forceVal : !state.wideSettingsCollapsed;
      render();
    };
    window.setWideSettingsPane = (pane) => {
      if (state.screenId === 'sources') clearSourcePageWork();
      state.navStack = [];
      state.activeModal = '';
      state.activeSourceSwitch = false;
      state.downloadStorageOpen = false;
      state.detailMoreOpen = false;
      state.wideSettingsPane = pane;
      if (pane === 'general' || pane === 'shelf') {
        state.settingsSub = pane;
        state.screenId = 'settings';
      } else if (pane === 'sources') {
        state.sourcePageSub = 'list';
        state.screenId = 'sources';
      } else if (pane === 'downloads') {
        state.downloadSub = 'books';
        state.screenId = 'downloads';
      }
      state.screenTransition = 'none';
      state.widePaneAnim = pickMotionTransition('tab');
      state.activeTab = 'screens';
      render();
    };
    window.setAppTheme = (t, choice, opts = {}) => {
      const nextTheme = t === 'night' ? 'night' : 'day';
      state.theme = nextTheme;
      if (opts.novelPaper) {
        state.novelPaper = opts.novelPaper;
        if (nextTheme === 'night') state.novelNightTheme = opts.novelPaper;
        else state.novelDayTheme = opts.novelPaper;
      } else {
        state.novelPaper = nextTheme === 'night' ? state.novelNightTheme : state.novelDayTheme;
      }
      state.mangaPaper = opts.mangaPaper || (nextTheme === 'night' ? 'dark' : 'warm');
      state.settingsThemeChoice = choice || nextTheme;
      if (!opts.silent) render();
    };
    window.setSettingsThemeChoice = (k) => {
      if (k === 'day' || k === 'night') {
        window.setAppTheme(k, k);
        return;
      }
      state.settingsThemeChoice = 'system';
      render();
    };
    window.setCompSlider = (val, inputEl) => {
      const pct = Math.max(0, Math.min(100, parseInt(val, 10) || 0));
      state.compSlider = pct;
      if (inputEl && inputEl.style && typeof inputEl.style.setProperty === 'function') {
        inputEl.style.setProperty('--val', `${pct}%`);
      }
      const ro = document.getElementById('comp-slider-readout');
      if (ro) ro.textContent = `${pct}%`;
    };
    window.copyTok = (txt) => {
      state.copiedToken = txt;
      if (navigator.clipboard) navigator.clipboard.writeText(txt).catch(() => {});
      render();
    };
    window.state = state;

    function syncHeaderButtons() {
      document.querySelectorAll('.studio-tab').forEach(btn => {
        const act = btn.dataset.tab === state.activeTab;
        btn.className = `studio-tab px-3 py-1.5 rounded-lg text-xs font-medium whitespace-nowrap transition-colors ${act ? 'bg-[var(--primary)] text-[var(--primary-foreground)]' : 'text-[var(--muted-foreground)] hover:text-[var(--foreground)]'}`;
      });
      const dayBtn = document.getElementById('btn-theme-day');
      const nightBtn = document.getElementById('btn-theme-night');
      dayBtn.className = `px-2.5 py-1 rounded-md font-medium transition-colors ${state.theme==='day'?'bg-[var(--primary)] text-[var(--primary-foreground)]':'text-[var(--muted-foreground)]'}`;
      nightBtn.className = `px-2.5 py-1 rounded-md font-medium transition-colors ${state.theme==='night'?'bg-[var(--primary)] text-[var(--primary-foreground)]':'text-[var(--muted-foreground)]'}`;

      const phoneBtn = document.getElementById('btn-dev-phone');
      const tabBtn = document.getElementById('btn-dev-tablet');
      phoneBtn.className = `px-2.5 py-1 rounded-md font-medium transition-colors ${state.device==='phone'?'bg-[var(--primary)] text-[var(--primary-foreground)]':'text-[var(--muted-foreground)]'}`;
      tabBtn.className = `px-2.5 py-1 rounded-md font-medium transition-colors ${state.device==='tablet'?'bg-[var(--primary)] text-[var(--primary-foreground)]':'text-[var(--muted-foreground)]'}`;
    }

    function render() {
      syncHeaderButtons();
      const main = document.getElementById('studio-main');
      const scrollIds = ['dir-list-region', 'novel-dir-list', 'manga-dir-list', 'source-switch-list-container'];
      const savedScrolls = {};
      const sourceScrolls = new Map();
      const sourceInput = document.activeElement?.closest('[data-source-input]');
      const sourceSelection = sourceInput ? [sourceInput.selectionStart, sourceInput.selectionEnd] : [];
      const sourceDialogTitle = main.querySelector('#source-modal-title')?.textContent;
      if (state.activeTab === 'screens' && lastRenderedScreenId === state.screenId) {
        scrollIds.forEach(sid => {
          const el = document.getElementById(sid);
          if (el && el.scrollTop) savedScrolls[sid] = el.scrollTop;
        });
        main.querySelectorAll('[data-source-scroll]').forEach(el => sourceScrolls.set(el.dataset.sourceScroll, el.scrollTop));
      }
      if (state.activeTab === 'screens') main.innerHTML = renderTabScreens();
      else if (state.activeTab === 'audit') main.innerHTML = renderTabAudit();
      else if (state.activeTab === 'tokens') main.innerHTML = renderTabTokens();
      else if (state.activeTab === 'components') main.innerHTML = renderTabComponents();
      else if (state.activeTab === 'motion') main.innerHTML = renderTabMotion();
      if (state.activeTab === 'screens') {
        lastRenderedScreenId = state.screenId;
        scrollIds.forEach(sid => {
          if (savedScrolls[sid]) {
            const el = document.getElementById(sid);
            if (el) el.scrollTop = savedScrolls[sid];
          }
        });
        main.querySelectorAll('[data-source-scroll]').forEach(el => {
          el.scrollTop = sourceScrolls.get(el.dataset.sourceScroll) || 0;
        });
        const matchingInput = sourceInput && Array.from(main.querySelectorAll('[data-source-input]')).find(el =>
          el.id === sourceInput.id && el.dataset.sourceInput === sourceInput.dataset.sourceInput);
        if (matchingInput) {
          matchingInput.focus({ preventScroll: true });
          if (Number.isInteger(sourceSelection[0])) matchingInput.setSelectionRange(...sourceSelection);
        } else if (state.sourceModal && main.querySelector('#source-modal-title')?.textContent !== sourceDialogTitle) {
          main.querySelector('[aria-labelledby="source-modal-title"] button')?.focus({ preventScroll: true });
        }
      } else {
        lastRenderedScreenId = '';
      }
      state.screenTransition = 'none';
      state.tabAnimDir = 'none';
      state.widePaneAnim = 'none';
      state.shelfSearchAnim = 'none';
      state.shelfModeAnim = 'none';
      state.shelfFilterAnim = 'none';
      state.novelCtrlAnim = 'none';
      state.mangaCtrlAnim = 'none';
      state.overlayAnim = 'none';
      state.selectAnim = 'none';
      state.novelBookmarkAnim = 'none';
    }
    window.render = render;

    const studioMain = document.getElementById('studio-main');
    studioMain.addEventListener('click', event => {
      const element = event.target.closest('[data-source-action]');
      if (!element) return;
      const action = element.dataset.sourceAction;
      if (action === 'close-source-modal') closeSourceModal();
      else handleSourceCheckAction(action, element) ||
        handleSourceTransferAction(action, element) ||
        handleSourceListAction(action, element);
    });
    studioMain.addEventListener('input', event => {
      const input = event.target;
      const name = input.dataset.sourceInput;
      if (!name || ['file', 'checkbox', 'radio', 'select-one'].includes(input.type)) return;
      handleSourceCheckInput(name, input) ||
        handleSourceListInput(name, input) ||
        handleSourceTransferInput(input);
    });
    studioMain.addEventListener('change', event => {
      const input = event.target;
      if (input.dataset.sourceInput && ['file', 'checkbox', 'radio', 'select-one'].includes(input.type)) {
        handleSourceTransferChange(input);
      }
    });
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape' && state.activeTab === 'screens' && state.screenId === 'sources' && state.sourceModal) {
        closeSourceModal();
      }
    });

    document.querySelectorAll('.studio-tab').forEach(btn => {
      btn.addEventListener('click', () => { state.activeTab = btn.dataset.tab; render(); });
    });
    document.getElementById('btn-theme-day').addEventListener('click', () => setAppTheme('day'));
    document.getElementById('btn-theme-night').addEventListener('click', () => setAppTheme('night'));
    document.getElementById('btn-dev-phone').addEventListener('click', () => { state.device = 'phone'; render(); });
    document.getElementById('btn-dev-tablet').addEventListener('click', () => { state.device = 'tablet'; render(); });

    render();
  })();
  </script>
</body>
</html>
