          `)}`;
      } else {
        fields = renderSourceTransferCard(`
          <div class="flex items-center justify-between gap-2 mb-2">
            <label for="source-import-paste" class="text-[12px] font-medium" style="color:var(--rd-muted);">JSON 内容</label>
            ${renderSourceTransferButton('填入示例', 'import-example', { size: 'h-7 px-2.5' })}
          </div>
          <textarea id="source-import-paste" data-source-input="import-paste" rows="8" placeholder="粘贴一个书源对象或一组书源" class="block w-full resize-none rounded-[10px] border p-3 text-[12px] leading-relaxed outline-none focus-visible:ring-1" style="background:var(--rd-canvas);border-color:var(--rd-line-strong);color:var(--rd-ink);">${escHtml(flow.pasteText)}</textarea>`);
      }
      return `${renderSourceTransferSegments([['file', '本地文件'], ['url', '在线链接'], ['paste', '粘贴 JSON']], flow.tab, 'import-tab', '导入来源')}${fields}`;
    }

    function renderSourceImportCheck(flow) {
      const passed = flow.items.filter(item => item.report?.available).length;
      const failed = flow.items.filter(item => item.report && !item.report.available).length;
      const testStatus = flow.checking ? flow.currentItem + (flow.currentStage ? ' · ' + flow.currentStage : '') : '检测进度';
      return renderSourceTransferCard(`
        <div class="flex items-center justify-between gap-2 text-[13px] font-semibold">
          <span>导入前可用性检测</span>
          ${renderToggle(!flow.skipCheck, '', 'data-source-action="import-toggle-check" aria-label="导入前可用性检测"')}
        </div>
        ${flow.skipCheck ? '' : `
          <div class="mt-2.5 space-y-2.5">
            ${renderSourceCheckSettings({ mode: flow.checkMode, depth: flow.checkDepth, keyword: flow.checkKeyword }, { prefix: 'import-check', disabled: flow.checking })}
            ${flow.checking || flow.completed ? renderSourceCheckProgress(flow, testStatus, `通过 ${passed} · 未通过 ${failed}`) : ''}
            <div class="flex flex-wrap gap-1.5">
              ${renderSourceTransferButton(flow.checking ? '停止' : '开始检测', flow.checking ? 'transfer-stop-check' : 'import-start-check', { tone: flow.checking ? 'danger' : 'primary' })}
              ${flow.completed && !flow.checking ? renderSourceTransferButton('仅选通过', 'import-select-passed') : ''}
            </div>
          </div>`}
      `);
    }

    function renderSourceImportGroup(flow) {
      const strategies = [['preserve', '保留原分组'], ['fill', '补全未分组'], ['all', '统一归入']];
      return renderSourceTransferCard(`
        <div class="text-[13px] font-semibold mb-2">分组归属</div>
        ${renderSourceTransferSegments(strategies, flow.groupStrategy, 'import-group-strategy', '分组归属')}
        ${flow.groupStrategy === 'preserve' ? '' : `
          <div class="flex flex-wrap gap-1.5 mt-2">
            ${state.sourceGroups.map(group => renderSourceTransferButton(escHtml(group), 'import-target-group', { value: group, size: 'h-7 px-2.5', tone: flow.targetGroup === group ? 'primary' : 'neutral' })).join('')}
            ${renderSourceTransferButton('＋ 新建分组', 'import-target-new-group', { size: 'h-7 px-2.5', tone: flow.targetGroup === null ? 'primary' : 'secondary' })}
          </div>
          ${flow.targetGroup === null ? `<div class="mt-2">${renderSourceTransferField('import-new-group', '新分组名称', flow.newGroupName)}</div>` : ''}
        `}
      `);
    }

    function renderSourceImportReview(flow) {
      const staticPassed = flow.items.filter(item => item.staticOk).length;
      const unsupported = flow.items.filter(item => item.category === 'unsupported').length;
      const invalid = flow.items.length - staticPassed - unsupported;
      const selected = flow.items.filter(item => item.selected).length;
      return `
        <div class="px-3 py-2.5 rounded-[12px] flex flex-wrap items-center justify-between gap-x-2 gap-y-1 text-[12px]" style="background:var(--rd-sunken);">
          <span class="font-semibold">静态校验 · 共 ${flow.items.length} 项</span>
          <span class="flex flex-wrap gap-x-1.5">
            <span style="color:var(--rd-success);">通过 ${staticPassed}</span>
            ${unsupported ? `<span style="color:var(--rd-danger);">已自动过滤不支持 ${unsupported}</span>` : ''}
            ${invalid ? `<span style="color:var(--rd-danger);">无效 ${invalid}</span>` : ''}
          </span>
        </div>
        ${renderSourceImportCheck(flow)}
        ${renderSourceImportGroup(flow)}
        <div class="flex items-center justify-between gap-2 text-[12px]" style="color:var(--rd-muted);">
          <span>已选 ${selected} / ${staticPassed}</span>
          <div class="flex gap-1">
            ${renderSourceTransferButton('全选', 'import-select-all', { disabled: flow.checking, size: 'h-7 px-2' })}
            ${renderSourceTransferButton('清空', 'import-select-none', { disabled: flow.checking, size: 'h-7 px-2', tone: 'text' })}
          </div>
        </div>
        ${renderSourceTransferCard(flow.items.map((item, index) => {
          const existing = item.staticOk && state.sourceItems.some(source => sourceTransferEntryUrl(source) === sourceTransferEntryUrl(item));
          const caption = [item.host && sourceDisplayUrl(item), item.group].filter(Boolean).join(' · ');
          const status = !item.staticOk
            ? `<span class="max-w-[105px] shrink-0 text-right text-[11px]" style="color:var(--rd-danger);">${escHtml(item.staticError)}</span>`
            : item.checkStage
              ? `<span class="text-[11px] shrink-0" style="color:var(--rd-primary);">${item.checkStage}</span>`
              : item.report ? renderSourceTransferReport(item, 'import-report', flow.checking) : '';
          return `<div class="px-3 py-2.5 flex items-center gap-2.5" style="${index ? 'border-top:1px solid var(--rd-line);' : ''}">
            ${renderSourceTransferCheckbox(item.selected, 'import-select-item', item, !item.staticOk || flow.checking)}
            <div class="min-w-0 flex-1">
              <div class="flex items-center gap-1.5">
                <span class="truncate text-[13px] font-semibold">${escHtml(item.name)}</span>

              </div>
              ${caption ? `<div class="truncate text-[11px]" style="color:var(--rd-muted);">${escHtml(caption)}</div>` : ''}

    function renderSourceImportResult(flow) {

        ${renderSourceTransferCard(`
          <div class="w-11 h-11 grid place-items-center mx-auto mb-1.5 rounded-full" style="background:var(--rd-success-soft);color:var(--rd-success);">${icon('check', 22)}</div>
          <h2 class="text-center text-[17px] font-semibold mb-3">导入完成</h2>
          <div class="grid grid-cols-2 gap-2 text-center">
            ${[['新增', result.added], ['更新', result.updated]].map(([label, count]) => `<div class="py-2 rounded-[10px]" style="background:var(--rd-sunken);"><div class="text-[19px] font-bold rd-num" style="color:var(--rd-primary);">${count}</div><div class="text-[11px]" style="color:var(--rd-muted);">${label}</div></div>`).join('')}

        ${renderSourceTransferCard(`

        `, 'overflow-hidden')}

    function renderImportScreen() {
      const flow = state.sourceImportFlow;
      const selected = flow.items.filter(item => item.staticOk && item.selected).length;
      const footer = {
        1: () => renderSourceTransferButton(flow.loading ? '读取中…' : '下一步：解析书源', 'import-parse', { tone: 'primary', size: 'h-11 flex-1', disabled: flow.loading }),
        2: () => renderSourceTransferButton((flow.skipCheck ? '跳过检测并导入 (' : '导入已选 (') + selected + ')', 'import-commit', { tone: 'primary', size: 'h-11 flex-1', disabled: flow.checking || !selected }),
        3: () => renderSourceTransferButton('继续导入', 'import-restart', { tone: 'neutral', size: 'h-11 flex-1' }) +
          renderSourceTransferButton('返回书源列表', 'import-return-list', { tone: 'primary', size: 'h-11 flex-1' }),
      }[flow.step]();
      return `
        ${renderFloatingTopBar(renderSourceBackButton('backSourceImport()'), '导入书源', '', '', false, 'rd-source-top-bar')}
        <ol aria-label="导入进度" class="flex items-center shrink-0 gap-2 w-full max-w-[640px] mx-auto px-4 py-3">
          ${['选择来源', '校验与检测', '完成'].map((label, index) => {
            const number = index + 1;
            const active = flow.step >= number;

    function renderSourceSubscriptionDiff(modal) {
      const hasSources = modal.items.some(isCheckableSourceSubscriptionItem);
      const chosen = sourceSubscriptionChanges(modal).length;
      const counts = { added: '新增', update: '更新', conflict: '冲突', removed: '远端移除', unchanged: '无变化' };
      const tones = { added: 'success', update: 'primary', conflict: 'warning', removed: 'danger', unchanged: 'muted' };
      const passed = modal.items.filter(item => item.report?.available).length;
      const failed = modal.items.filter(item => item.report && !item.report.available).length;
      const checkTitle = modal.checking ? modal.currentItem + (modal.currentStage ? ' · ' + modal.currentStage : '') : '检测进度';
      const statusHtml = `<div class="space-y-2.5">
        ${modal.errors.length ? `<p class="text-[12px] break-words" style="color:var(--rd-danger);">检查失败 · ${escHtml(modal.errors.join('、'))}</p>` : ''}
        ${hasSources ? renderSourceTransferCard(`
          <div class="space-y-2">
            ${renderSourceCheckSettings(modal.settings, { prefix: 'sub-diff', depths: [2, 5], modeControl: false, disabled: modal.checking })}
            ${modal.checking || modal.completed ? renderSourceCheckProgress(modal, checkTitle, `通过 ${passed} · 未通过 ${failed}`) : ''}
            <div class="flex flex-wrap gap-1.5">
              ${renderSourceTransferButton(modal.checking ? '停止' : '开始检测', modal.checking ? 'transfer-stop-check' : 'sub-diff-start', { tone: modal.checking ? 'danger' : 'primary' })}
              ${modal.completed && !modal.checking ? renderSourceTransferButton('仅选通过', 'sub-diff-only-passed') : ''}
            </div>
          </div>`) : ''}
        ${modal.items.length ? renderSourceTransferCard(modal.items.map((item, index) => {
          const tone = tones[item.diff];
          const tagBg = tone === 'muted' ? 'var(--rd-sunken)' : 'var(--rd-' + tone + '-soft)';
          const caption = item.isRule ? item.subName : [item.host && sourceDisplayUrl(item), item.subName].filter(Boolean).join(' · ');
          return `<div class="px-2.5 py-2.5 flex items-start gap-2" style="${index ? 'border-top:1px solid var(--rd-line);' : ''}">
            ${renderSourceTransferCheckbox(item.checked && (item.diff !== 'conflict' || item.resolution === 'overwrite'), 'sub-diff-toggle-item', item, modal.checking || item.diff === 'unchanged' || (item.diff === 'conflict' && item.resolution === 'keep'))}
            <div class="min-w-0 flex-1">
              <div class="flex items-center flex-wrap gap-1.5">
                <span class="min-w-0 truncate text-[12.5px] font-semibold">${escHtml(item.name)}</span>
                <span class="rounded-[5px] px-1.5 py-0.5 text-[10px] font-medium" style="background:${tagBg};color:var(--rd-${tone});">${counts[item.diff]}</span>
              </div>
              <div class="mt-0.5 truncate text-[10.5px]" style="color:var(--rd-muted);">${escHtml(caption)}</div>
              ${item.diff === 'conflict' ? `<div class="flex flex-wrap gap-1 mt-1.5">
                ${renderSourceTransferButton('覆盖', 'sub-diff-resolution', { value: 'overwrite', id: item.id, disabled: modal.checking, size: 'h-6 px-2', tone: item.resolution === 'overwrite' ? 'primary' : 'neutral' })}
                ${renderSourceTransferButton('保留本地', 'sub-diff-resolution', { value: 'keep', id: item.id, disabled: modal.checking, size: 'h-6 px-2', tone: item.resolution === 'keep' ? 'primary' : 'neutral' })}
              </div>` : ''}
            </div>
            ${item.checkStage
              ? `<span class="shrink-0 mt-0.5 text-[11px]" style="color:var(--rd-primary);">${item.checkStage}</span>`
              : item.report ? renderSourceTransferReport(item, 'sub-diff-report', modal.checking) : ''}
          </div>`;
        }).join(''), 'overflow-hidden') : `<p class="py-3 text-[12.5px]" style="color:var(--rd-muted);">没有变更</p>`}
      </div>`;
      const footer = `<div class="flex gap-2">
        ${renderSourceTransferButton('取消', 'close-source-modal', { tone: 'neutral', size: 'h-10 w-20' })}
        ${renderSourceTransferButton('应用更新 (' + chosen + ')', 'sub-diff-apply', { tone: 'primary', size: 'h-10 flex-1', disabled: modal.checking || !chosen })}
      </div>`;
      return sourceModalFrame('订阅更新预览', statusHtml, footer, modal.title);
    }

    function handleSourceTransferAction(action, element) {
      const { value, id, field } = element.dataset;
      const flow = state.sourceImportFlow;
      const modal = state.sourceModal;
      switch (action) {
        case 'import-tab':
          cancelSourceTransferWork();
          flow.tab = value;
          break;
        case 'import-preset-file':
          cancelSourceTransferWork();
          flow.selectedFileName = value;
          flow.customUploaded = null;
          break;
        case 'import-preset-url': {
          const preset = sourceImportLinks.find(link => link.url === value);
          flow.urlInput = preset.url;
          flow.subNameInput = preset.title;
          break;
        }
        case 'import-toggle-sub':
          flow.saveAsSub = !flow.saveAsSub;
          break;
        case 'import-example':
          flow.pasteText = JSON.stringify(sourceImportPasteExample, null, 2);
          break;
        case 'import-parse':
          void parseSourceImport();
          return true;
        case 'import-check-setting':
          if (!flow.checking && field === 'mode') flow.checkMode = value;
          if (!flow.checking && field === 'depth') flow.checkDepth = Number(value);
          break;
        case 'import-toggle-check':
          flow.skipCheck = !flow.skipCheck;
          if (flow.skipCheck) {
            cancelSourceTransferWork();
            flow.completed = 0;
            for (const item of flow.items) {
              setSourceCheckReport(item, null);
              item.selected = item.staticOk;
            }
          }
          break;
        case 'import-start-check':
          checkSourceImport();
          return true;
        case 'import-select-passed':
          for (const item of flow.items) item.selected = item.staticOk && Boolean(item.report?.available);
          break;
        case 'import-select-all':
        case 'import-select-none':
          for (const item of flow.items) item.selected = item.staticOk && action === 'import-select-all';
          break;
        case 'import-select-item': {
          const item = flow.items.find(entry => entry.id === id);
          if (item?.staticOk && !flow.checking) item.selected = !item.selected;
          break;
        }
        case 'import-report': {
          const item = flow.items.find(entry => entry.id === id);
          if (item?.report && !flow.checking) openSourceCheck(item, { readOnly: true });
          return true;
        }
        case 'import-group-strategy':
          if (flow.groupStrategy === 'preserve' && value !== 'preserve' && !flow.newGroupName) {
            flow.targetGroup = state.sourceGroups[0] ?? null;
          }
          flow.groupStrategy = value;
          break;
        case 'import-target-group':
          if (state.sourceGroups.includes(value)) flow.targetGroup = value;
          break;
        case 'import-target-new-group':
          flow.targetGroup = null;
          break;
        case 'import-commit':
          commitSourceImport();
          return true;
        case 'import-toggle-details':
          flow.detailExpanded = !flow.detailExpanded;
          break;
        case 'import-restart':
          cancelSourceTransferWork();
          state.sourceImportFlow = createSourceImportFlow();
          break;
        case 'import-return-list':
          backSourceImport();
          return true;
        case 'transfer-stop-check':
          sourceTransferCheck?.stop();
          return true;
        case 'sub-create':
          openSourceSubscriptionForm();
          return true;
        case 'sub-edit': {
          const sub = state.sourceSubscriptions.find(entry => entry.id === id);
          if (sub) openSourceSubscriptionForm(sub);
          return true;
        }
        case 'sub-toggle': {
          const sub = state.sourceSubscriptions.find(entry => entry.id === id);
          if (sub) sub.autoUpdate = !sub.autoUpdate;
          break;
        }
        case 'sub-delete-prompt': {
          const sub = state.sourceSubscriptions.find(entry => entry.id === id);
          if (sub) {
            state.sourceModal = { kind: 'sub-delete', id: sub.id, name: sub.name };
            state.overlayAnim = pickMotionTransition('modal');
          }
          break;
        }
        case 'sub-delete':
          if (modal?.kind !== 'sub-delete') return true;
          state.sourceSubscriptions = state.sourceSubscriptions.filter(sub => sub.id !== modal.id);
          state.sourceModal = null;
          showAppToast('已删除订阅');
          return true;
        case 'sub-form-type':
          if (modal?.kind === 'sub-form') modal.type = value;
          break;
        case 'sub-form-auto':
          if (modal?.kind === 'sub-form') modal.autoUpdate = !modal.autoUpdate;
          break;
        case 'sub-save':
          if (modal?.kind === 'sub-form') saveSourceSubscription(modal);
          return true;
        case 'sub-check':
          void openSourceSubscriptionPreview([id]);
          return true;
        case 'sub-check-all':
          void openSourceSubscriptionPreview(state.sourceSubscriptions.filter(sub => sub.autoUpdate).map(sub => sub.id));
          return true;
        case 'sub-diff-setting':
          if (modal?.kind === 'sub-diff' && !modal.checking && field === 'depth') modal.settings.depth = Number(value);
          break;
        case 'sub-diff-toggle-item': {
          const item = modal?.kind === 'sub-diff' && modal.items.find(entry => entry.id === id);
          if (item && !modal.checking && item.diff !== 'unchanged' && item.resolution !== 'keep') item.checked = !item.checked;
          break;
        }
        case 'sub-diff-resolution': {
          const item = modal?.kind === 'sub-diff' && modal.items.find(entry => entry.id === id && entry.diff === 'conflict');
          if (item && !modal.checking) item.resolution = value;
          break;
        }
        case 'sub-diff-start':
          if (modal?.kind === 'sub-diff') checkSourceSubscriptionDiff(modal);
          return true;
        case 'sub-diff-report': {
          const item = modal?.kind === 'sub-diff' && modal.items.find(entry => entry.id === id);
          if (item?.report && !modal.checking) openSourceCheck(item, { readOnly: true });
          return true;
        }
        case 'sub-diff-only-passed':
          if (modal?.kind === 'sub-diff' && !modal.checking) {
            for (const item of modal.items) {
              if (!item.isRule) item.checked = isCheckableSourceSubscriptionItem(item) && Boolean(item.report?.available);
            }
          }
          break;
        case 'sub-diff-apply':
          if (modal?.kind === 'sub-diff') applySourceSubscriptionDiff(modal);
          return true;
        default:
          return false;
      }
      render();
      return true;
    }

    function handleSourceTransferInput(input) {
      const field = input.dataset.sourceInput;
      const importFields = {
        'import-url': 'urlInput',
        'import-sub-name': 'subNameInput',
        'import-paste': 'pasteText',
        'import-new-group': 'newGroupName',
        'import-check-keyword': 'checkKeyword',
      };
      if (Object.hasOwn(importFields, field)) {
        state.sourceImportFlow[importFields[field]] = input.value;
        return true;
      }
      if (state.sourceModal?.kind === 'sub-form' && (field === 'sub-name' || field === 'sub-url')) {
        state.sourceModal[field === 'sub-name' ? 'name' : 'url'] = input.value;
        return true;
      }
      if (state.sourceModal?.kind === 'sub-diff' && field === 'sub-diff-keyword') {
        state.sourceModal.settings.keyword = input.value;
        return true;
      }
      return false;
    }

    function getBookDisplayInfo(book) {
      const b = book || DEFAULT_SHELF_BOOKS()[0];
      const isEdge = state.edgeStressMode === 'edge';
      const title = (isEdge && b.edgeTitle) ? b.edgeTitle : b.title;
      const author = (isEdge && b.edgeAuthor) ? b.edgeAuthor : b.author;
      const ch = (isEdge && b.edgeCh) ? b.edgeCh : b.ch;
      const pct = b.pct;
      const latest = (isEdge && b.edgeLatest) ? b.edgeLatest : b.latest;
      const noCover = Boolean(isEdge && b.isEdgeNoCover);
      return {
        ...b,
        displayTitle: title,
        displayAuthor: author,
        displayCh: ch,
        displayLatest: latest,
        displayPct: pct,
        noCover,
      };
    }

    function restoreReaderCursorForBook(book) {
      if (!book) return;
      if (book.target === 'novel') {
        if (typeof book.chIdx === 'number') {
          state.novelChapterIdx = Math.max(0, Math.min(NOVEL_DIR_TITLES.length - 1, book.chIdx));
          state.novelProgressPct = typeof book.pct === 'number' ? book.pct : getNovelChapter(state.novelChapterIdx).pct;
        }
      } else if (book.target === 'manga') {
        if (typeof book.chIdx === 'number') {
          state.mangaChapterIdx = Math.max(0, Math.min(MANGA_CHAPTERS.length - 1, book.chIdx));
          state.mangaPage = typeof book.page === 'number' ? Math.max(1, Math.min(24, book.page)) : 1;
        }
      }
    }

    function selectActiveBook(bookOrId, opts = {}) {
      const book = (typeof bookOrId === 'string')
        ? ((state.shelfBooks || []).find(b => b.id === bookOrId)
          || (state.detailPreviewBook && state.detailPreviewBook.id === bookOrId ? state.detailPreviewBook : null))
        : bookOrId;
      if (!book) return null;
      const isPreview = Boolean(opts.preview);
      state.detailPreviewBook = isPreview ? book : null;
      state.currentBookId = book.id;
      if (opts.clearActions !== false) state.bookActionsBookId = '';
      restoreReaderCursorForBook(book);
      return book;
    }
    window.selectActiveBook = selectActiveBook;

    function getActiveBook(preferredTarget) {
      const list = state.shelfBooks || [];
      let found = list.find(b => b.id === state.currentBookId);
      if (!found && state.detailPreviewBook && state.detailPreviewBook.id === state.currentBookId) {
        found = state.detailPreviewBook;
      }
      if (preferredTarget && (!found || found.target !== preferredTarget)) {
        found = list.find(b => b.target === preferredTarget) || found;
      }
      if (!found && state.detailPreviewBook && (!preferredTarget || state.detailPreviewBook.target === preferredTarget)) {
        found = state.detailPreviewBook;
      }
      if (!found) {
        const defaults = DEFAULT_SHELF_BOOKS();
        found = preferredTarget ? (defaults.find(b => b.target === preferredTarget) || defaults[0]) : (list[0] || defaults[0]);
      }
      return getBookDisplayInfo(found);
    }

    function renderToggle(on, onclickExpr, delegatedAttrs = '') {
      const expr = onclickExpr || "const next=this.dataset.on!=='true';this.dataset.on=next?'true':'false';this.setAttribute('aria-pressed',String(next));";
      return `<button type="button" ${delegatedAttrs || `onclick="${expr}"`} class="rd-toggle border-0 outline-none" data-on="${on ? 'true' : 'false'}" aria-pressed="${on}">
        <div class="rd-toggle-thumb"></div>
      </button>`;
    }

    function renderFloatingTopBar(leftHtml, title, rightHtml, subline = '', overlay = false, extraCls = '') {
      const wideCap = state.device === 'tablet' ? 'max-w-[580px] mx-auto' : '';
      if (overlay) {
        return `
          <div class="px-3.5 pt-2.5 pb-1.5 absolute top-0 left-0 right-0 z-20 pointer-events-none">
            <div class="pointer-events-auto h-[52px] rounded-full px-2.5 flex items-center justify-between border ${wideCap} ${extraCls}" style="background:var(--rd-veil-bg);border-color:var(--rd-veil-border);box-shadow:var(--rd-float-shadow);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);">
              <div class="flex items-center min-w-[44px]">${leftHtml}</div>
              <div class="text-center px-2 min-w-0 flex-1">
                <div class="text-[16px] font-semibold truncate" style="color:var(--rd-ink);">${title}</div>
                ${subline ? `<div class="text-[11px] truncate" style="color:var(--rd-muted);">${subline}</div>` : ''}
              </div>
              <div class="flex items-center justify-end min-w-[44px] gap-0.5">${rightHtml}</div>

          </div>
        `;
      }
      return `
        <div class="px-3.5 pt-2 pb-1.5 relative z-20 shrink-0">
          <div class="h-[52px] rounded-full px-2.5 flex items-center justify-between border ${wideCap} ${extraCls}" style="background:var(--rd-veil-bg);border-color:var(--rd-veil-border);box-shadow:var(--rd-float-shadow);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);">

      const pillAnimCls = state.tabAnimDir === 'right'

      return `

        </div>
      `;

    // =========================================================================
    // 11 Screen Renderers
    // =========================================================================
    function escapeAttr(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/"/g, '&quot;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    function escHtml(value) {
      return escapeAttr(value);
    }

    const SEARCH_CATALOG = [

      { title: '斗破苍穹之雷霆震碎', author: '一贫如洗羊羊', intro: '第816章 你们已有取死之道！', words: '173.1万字', fans: '2.8万', type: '小说', mode: '在线', src: '笔趣阁', count: '1 个书源', inShelf: false, tone: 'pine' },

    ];

    function getFilteredSearchResults(query, filterKey) {
      const q = (query || '').trim().toLowerCase();
      return SEARCH_CATALOG.filter(item => {
        const matchesQuery = !q || item.title.toLowerCase().includes(q) || item.author.toLowerCase().includes(q) || item.intro.toLowerCase().includes(q);
        if (!matchesQuery) return false;
        if (filterKey === 'novel') return item.type === '小说';
        if (filterKey === 'manga') return item.type === '漫画';
        if (filterKey === 'local') return item.mode === '本地';
        if (filterKey === 'online') return item.mode === '在线';
        return true;
      });
    }

    function renderSearchResultsPanel(query, filterKey, setFilterFn, resetFn) {
      const baseList = getFilteredSearchResults(query, 'all');
      const filtered = getFilteredSearchResults(query, filterKey);
      const chips = [
        ['all', '全部', baseList.length],
        ['novel', '小说', baseList.filter(r => r.type === '小说').length],
        ['manga', '漫画', baseList.filter(r => r.type === '漫画').length],
        ['local', '本地', baseList.filter(r => r.mode === '本地').length],
        ['online', '在线', baseList.filter(r => r.mode === '在线').length],
      ];

      return `
        <!-- Single unified non-overlapping filter bar -->
        <div class="flex items-center gap-1.5 overflow-x-auto rd-scroll pb-0.5">

            const act = filterKey === fk;

          ${filterKey !== 'all' ? `<button type="button" onclick="${resetFn}" class="font-medium rd-pressable" style="color:var(--rd-primary);">清除筛选</button>` : '<span style="color:var(--rd-seal);">1 个书源超时</span>'}

        ${filtered.length === 0 ? `
          <div class="p-6 rounded-[14px] border text-center flex flex-col items-center gap-2.5" style="background:var(--rd-surface);border-color:var(--rd-line);">

                    <div class="text-[15px] font-semibold truncate" style="color:var(--rd-ink);">${r.title}</div>
                    ${isInShelf ? `<span class="px-2 py-0.5 rounded-[6px] text-[10px] font-medium shrink-0" style="background:var(--rd-primary-soft);color:var(--rd-primary);">已在书架</span>` : ''}

                    <span class="px-1.5 py-0.5 rounded-[5px] text-[10px]" style="background:var(--rd-sunken);color:var(--rd-muted);">${r.count}</span>
                  </div>
                </div>
              </div>
            `;
            }).join('')}
          </div>
        `}
      `;
    }

    function renderSearchHistorySection(submitFnName, extraCls = '') {
      return `
        <div class="px-3.5 pt-3 pb-3.5 ${extraCls}">
          <div class="flex items-center justify-between">

                  <input id="shelf-search-input" type="text" value="${escapeAttr(state.shelfSearchQuery)}" oninput="onShelfSearchInput(this.value)" onkeydown="if(event.key==='Enter'){event.preventDefault();submitShelfSearch();}" placeholder="搜索书名、作者…" class="flex-1 min-w-0 w-full h-full bg-transparent text-[13px] leading-none outline-none" style="color:var(--rd-ink);" />

      return `

          if (state.shelfSourceType === 'local' && b.src !== '本地') return false;
          if (state.shelfSourceType === 'online' && b.src !== '在线') return false;

    function renderScreenDetail() {
      const isEdge = state.edgeStressMode === 'edge';
      const book = getActiveBook();
      const isManga = book.target === 'manga';
      const inShelf = (state.shelfBooks || []).some(b => b.id === book.id);
      const bookTitle = book.displayTitle;
      const bookMeta = `${book.displayAuthor} · ${isManga ? '632 话' : '533.23 万字'}`;
      const pool = SOURCE_SWITCH_POOL[isManga ? 'manga' : 'novel'] || SOURCE_SWITCH_POOL.novel;
      const matchedCand = (state.sourceSwitchCandidates || []).find(c => c.name === book.sourceName) || pool.find(c => c.name === book.sourceName);
      const baseSrcName = book.sourceName || (matchedCand ? matchedCand.name : pool[0].name);
      const latencyTag = matchedCand ? matchedCand.ms : (isEdge ? '128ms 旗舰备用节点' : '128ms');
      const sourceLabel = book.src === '本地'
        ? `${baseSrcName} · 本地文件`
        : `${baseSrcName}（${latencyTag}）`;
      const latestLabel = isEdge && book.edgeLatest ? book.edgeLatest : (book.displayLatest || (isManga ? '第 632 话 萧炎归来' : '第一千六百六十三章 结束，也是开始'));
      const allChs = isManga
        ? MANGA_CHAPTERS.map((t, idx) => ({ idx, label: `第 ${t}` }))
        : NOVEL_DIR_TITLES.map((t, idx) => ({ idx, label: t }));
      const rawCurIdx = isManga
        ? Math.max(0, Math.min(allChs.length - 1, state.mangaChapterIdx))
        : Math.max(0, Math.min(allChs.length - 1, state.novelChapterIdx));
      const startIdx = rawCurIdx < 6 ? 0 : Math.min(allChs.length - 6, Math.max(0, rawCurIdx - 2));
      const chs = allChs.slice(startIdx, startIdx + 6);

              <button type="button" onclick="toggleDetailInShelf('${book.id}')" class="h-11 px-5 rounded-full text-[14px] font-medium rd-pressable" style="background:var(--rd-sunken);color:var(--rd-ink);">${inShelf?'已在书架':'加入书架'}</button>

    function renderDirectoryListMarkup() {
      const book = getActiveBook();
      const isManga = book.target === 'manga';
      const q = (state.dirSearch || '').trim().toLowerCase();
      const titles = isManga ? MANGA_CHAPTERS.map(t => `第 ${t}`) : NOVEL_DIR_TITLES;
      const curIdx = isManga ? state.mangaChapterIdx : state.novelChapterIdx;
      let chs = titles.map((title, i) => ({
        idx: i + 1,
        title,
        cached: i < 5,
        current: i === curIdx,
      })).filter(c => !q || c.title.toLowerCase().includes(q));
      if (state.dirReversed) chs = chs.slice().reverse();
      if (chs.length === 0) {
        return `<div class="p-8 text-center text-[13px]" style="color:var(--rd-muted);">未找到匹配的章节名称</div>`;
      }
      if (state.device === 'tablet') {
        return `
          <div class="grid grid-cols-2 gap-2 p-4">
            ${chs.map(c => {
              const targetIdx = c.idx - 1;
              const chClick = isManga
                ? `selectMangaChapter(${targetIdx});setScreen('manga')`
                : `selectNovelChapter(${targetIdx}, true)`;
              return `
              <button type="button" ${c.current ? 'data-current-chapter="true"' : ''} onclick="${chClick}" class="h-12 px-3.5 rounded-[12px] border flex items-center justify-between text-left relative rd-pressable overflow-hidden" style="border-color:${c.current?'var(--rd-primary-border)':'var(--rd-line)'};background:${c.current?'var(--rd-primary-soft)':'var(--rd-surface)'};">
                ${c.current ? `<div class="absolute left-0 top-2 bottom-2 w-[3px] rounded-r-full" style="background:var(--rd-primary);"></div>` : ''}
                <div class="flex items-center gap-2 min-w-0 pr-2">
                  <span class="text-[13.5px] truncate" style="color:${c.current?'var(--rd-primary)':'var(--rd-ink)'};font-weight:${c.current?600:400};">${c.title}</span>
                  ${c.current ? `<span class="px-1.5 py-0.5 rounded-[5px] text-[10px] font-semibold shrink-0" style="background:var(--rd-primary);color:var(--rd-on-primary);">在读</span>` : ''}
                </div>
                <div class="flex items-center gap-1.5 shrink-0">
                  ${c.cached ? `<span class="text-[11px] flex items-center gap-0.5" style="color:var(--rd-success);">${icon('check', 13)}已缓存</span>` : `<span style="color:var(--rd-subtle);">${icon('download', 14)}</span>`}
                </div>
              </button>
            `;
            }).join('')}
          </div>
        `;
      }
      return chs.map(c => {
        const targetIdx = c.idx - 1;
        const chClick = isManga
          ? `selectMangaChapter(${targetIdx});setScreen('manga')`
          : `selectNovelChapter(${targetIdx}, true)`;
        return `
        <button type="button" ${c.current ? 'data-current-chapter="true"' : ''} onclick="${chClick}" class="w-full h-12 px-4 flex items-center justify-between text-left relative rd-pressable" style="border-bottom:1px solid var(--rd-line);background:${c.current?'var(--rd-primary-soft)':'transparent'};">
          ${c.current ? `<div class="absolute left-0 top-2 bottom-2 w-[3px] rounded-r-full" style="background:var(--rd-primary);"></div>` : ''}
          <div class="flex items-center gap-2 min-w-0 pr-2">
            <span class="text-[14px] truncate" style="color:${c.current?'var(--rd-primary)':'var(--rd-ink)'};font-weight:${c.current?600:400};">${c.title}</span>

          </div>
          <div class="flex items-center gap-2 shrink-0">
            ${c.cached ? `<span class="text-[11px] flex items-center gap-0.5" style="color:var(--rd-success);">${icon('check', 13)}已缓存</span>` : `<span style="color:var(--rd-subtle);">${icon('download', 14)}</span>`}
          </div>
        </button>
      `;
      }).join('');
    }

    function renderScreenDirectory() {

      const isManga = book.target === 'manga';
      const subtitle = `${book.title} · 共 ${isManga ? '632 话' : '1663 章'}`;
      const curChTitle = isManga
        ? `第 ${MANGA_CHAPTERS[Math.min(state.mangaChapterIdx, MANGA_CHAPTERS.length - 1)] || MANGA_CHAPTERS[0]}`
        : getNovelChapter(state.novelChapterIdx).title;

    const NOVEL_DIR_TITLES = [
      '第一章 陨落的天才', '第二章 斗气大陆', '第三章 客人', '第四章 云岚宗',
      '第五章 聚气散', '第六章 炼药师', '第七章 休！', '第八章 神秘的老者',
      '第九章 药老！', '第十章 借钱', '第十一章 坊市', '第十二章 离他远点',
      '第十三章 黑铁片', '第十四章 吸掌', '第十五章 修炼', '第十六章 筑基灵液',
      '第十七章 拍卖会', '第十八章 护卫', '第十九章 炼制', '第二十章 二品炼药师',

    ];

    const NOVEL_CHAPTERS = [
      {
        title: '第一章 陨落的天才',
        pct: 3,
        paras: [
          '“斗之力，三段！”望着测验魔石碑上面闪亮得甚至有些刺眼的五个大字，少年面无表情，唇角有着一抹自嘲。',
          '萧炎默默退回人群，掌心紧握着那枚漆黑古朴的戒指，指节因为用力而微微发白。',
          '“下一个，萧薰儿！”人群忽然安静下来，无数炽热的目光纷纷投向台阶旁走出的青衣少女。',
        ],
      },
      {
        title: '第二章 斗气大陆',
        pct: 6,
        paras: [
          '萧炎独自坐在冰凉的青石台阶上，抬头望着漫天星辉，耳边却仍回荡着白日里测验石碑旁的低声议论。',
          '曾经照亮乌坦城的天才之名，如今只在族人的叹息声里被轻描淡写地带过。',
          '“四年了……莫名其妙消失的斗气，究竟被什么东西吸走了？”少年低声喃喃，指尖再度触上那枚冰凉的黑戒。',
        ],
      },
      {
        title: '第三章 客人',
        pct: 9,
        paras: [
          '“萧炎哥哥，你说，他会是谁？”薰儿沉默了半响，忽然的偏过头，对着萧炎嫣然一笑，少女独有的风情，让得周围的少年眼睛有些放光。',
          '“咳…我，我怎么知道？那么小，我们都还在地上爬呢，我哪知道。”心头猛的一跳，萧炎讪笑了两声，旋即有些心虚的将目光转向大厅内。',
          '“嘻嘻…”望着萧炎的反应，萧薰儿小嘴泛起一抹柔和的弧度，目光移回大厅上。',
        ],
      },
      {
        title: '第四章 云岚宗',
        pct: 13,
        paras: [
          '清晨的薄雾还未散尽，石阶尽头忽然传来清越的马蹄声，几道绣着云纹白袍的身影缓缓步入萧家大门。',
          '“三十年河东，三十年河西，莫欺少年穷！”少年的声音不高，却如金石落地般掷地有声。',
          '那一纸退婚书静静躺在紫檀木案上，衬得整座议事厅越发压抑沉闷。',
        ],
      },
      {
        title: '第五章 聚气散',
        pct: 16,
        paras: [
          '“若真能借这枚聚气散一举突破斗之气第九段，凝成斗之气旋，昔日失去的一切自然都会讨回来。”',
          '萧炎深吸一口气，紧握的掌心缓缓松开，黑眸之中再度燃起久违的炽热光亮。',
          '深夜的阁楼里微风轻拂，古老戒指表面悄然浮现出一缕极淡的苍白虚影。',
        ],
      },
    ];
    const NOVEL_TTS_TOTAL_SLICES = 18;
    const NOVEL_TTS_LANGUAGES = ['简体中文 (zh-CN)', '普通话·粤语混合', 'English (US)'];
    const NOVEL_TTS_RATE_PRESETS = [0.50, 0.75, 1.00, 1.25, 1.50];

    function getNovelChapter(idx) {
      const clamped = Math.max(0, Math.min(NOVEL_DIR_TITLES.length - 1, parseInt(idx, 10) || 0));
      if (NOVEL_CHAPTERS[clamped]) return NOVEL_CHAPTERS[clamped];
      const title = NOVEL_DIR_TITLES[clamped];
      const pct = Math.min(100, Math.max(3, Math.round(((clamped + 1) / NOVEL_DIR_TITLES.length) * 100)));
      return {
        title,
        pct,
        paras: [
          `【${title}】乌坦城夜风微凉，青石小院内斗气微芒流转，少年指尖凝起一缕淡淡炽意。`,
          '自药老现身传授焚诀与炼药术以来，经脉间原本滞涩的斗之气正以惊人速度重新贯通。',
          '窗外暮色沉落，远方云岚宗与加玛帝国的广阔天地，正等待少年一步步踏足。',
        ],
      };
    }

    function twoDigits(n) {
      const v = Math.max(0, Math.trunc(n));
      return v < 10 ? `0${v}` : `${v}`;
    }

    function formatNovelSpeed(v) {
      return Math.abs(v * 10 - Math.round(v * 10)) < 0.01 ? `${v.toFixed(1)}x` : `${v.toFixed(2)}x`;
    }

    function formatNovelTimerShort(kind) {
      if (kind === 'tts') {
        if (state.novelTtsTimerMode === 'off') return '关闭';
        if (state.novelTtsTimerMode === 'chapterEnd') return '本章';
        return `${twoDigits(state.novelTtsTimerMin)}:${twoDigits(state.novelTtsTimerSec)}`;
      }
      if (!state.novelAutoTimerEnabled || (state.novelAutoTimerMin === 0 && state.novelAutoTimerSec === 0)) return '关闭';
      return `${twoDigits(state.novelAutoTimerMin)}:${twoDigits(state.novelAutoTimerSec)}`;
    }

    function formatNovelTimerFull(kind) {
      if (kind === 'tts') {
        if (state.novelTtsTimerMode === 'off') return '未开启';
        if (state.novelTtsTimerMode === 'chapterEnd') return '本章结束';
        return `${twoDigits(state.novelTtsTimerMin)}:${twoDigits(state.novelTtsTimerSec)}`;
      }
      if (!state.novelAutoTimerEnabled || (state.novelAutoTimerMin === 0 && state.novelAutoTimerSec === 0)) return '未开启';
      return `${twoDigits(state.novelAutoTimerMin)}:${twoDigits(state.novelAutoTimerSec)}`;
    }

    function getNovelDisplayMeta(curCh) {
      const book = getActiveBook('novel');
      const isEdge = state.edgeStressMode === 'edge';
      const activeCand = (state.sourceSwitchCandidates || []).find(c => c.id === state.sourceSwitchSelected);
      return {
        bookTitle: book.displayTitle,
        sourceName: book.src === '本地' ? book.sourceName : (book.sourceName || (activeCand ? activeCand.name : '66书吧')),
        chTitle: isEdge ? `${curCh.title}：远道而来的云岚宗秘使与萧家退婚风波（精校注释卷）` : curCh.title,
      };
    }

    function renderNovelC1Stage(kind) {
      const isTts = kind === 'tts';
      const curCh = getNovelChapter(state.novelChapterIdx);
      const novelMeta = getNovelDisplayMeta(curCh);
      const status = isTts ? state.novelTtsStatus : state.novelAutoStatus;
      const idle = status === 'idle';
      const playing = status === 'playing';
      const pct = isTts
        ? Math.round((state.novelTtsSlice / NOVEL_TTS_TOTAL_SLICES) * 100)
        : Math.max(4, Math.min(100, Math.round(((state.novelAutoSec - state.novelAutoRem) / state.novelAutoSec) * 100)));

      const microWave = `
        <span class="flex items-center gap-[2px] h-3.5 shrink-0">
          ${[5, 10, 7, 11].map((h, i) => `<span class="w-[2px] rounded-full wave-bar" style="height:${h}px;background:var(--rd-ctrl-primary);animation-delay:${i * 95}ms;"></span>`).join('')}
        </span>
      `;

      const line2Html = isTts
        ? (idle
          ? `<span class="text-[11px] truncate rd-num" style="color:var(--rd-ctrl-muted);">第 ${state.novelTtsSlice}/${NOVEL_TTS_TOTAL_SLICES} 句</span>`
          : (playing
            ? `${microWave}<span class="text-[11px] font-medium truncate rd-num" style="color:var(--rd-ctrl-primary);">第 ${state.novelTtsSlice}/${NOVEL_TTS_TOTAL_SLICES} 句</span>`
            : `<span class="w-1.5 h-1.5 rounded-full shrink-0" style="background:var(--rd-ctrl-subtle);"></span><span class="text-[11px] truncate rd-num" style="color:var(--rd-ctrl-muted);">已暂停 · ${state.novelTtsSlice}/${NOVEL_TTS_TOTAL_SLICES}</span>`))
        : (idle
          ? `<span class="text-[11px] truncate rd-num" style="color:var(--rd-ctrl-muted);">自动翻页 · ${state.novelFlipMode}</span>`
          : (playing
            ? `<span class="w-1.5 h-1.5 rounded-full shrink-0 rd-pulse-dot" style="background:var(--rd-ctrl-primary);"></span><span class="text-[11px] font-medium truncate rd-num" style="color:var(--rd-ctrl-primary);">${state.novelAutoRem.toFixed(1)}s 后翻页</span>`
            : `<span class="w-1.5 h-1.5 rounded-full shrink-0" style="background:var(--rd-ctrl-subtle);"></span><span class="text-[11px] truncate rd-num" style="color:var(--rd-ctrl-muted);">已暂停 · ${state.novelAutoRem.toFixed(1)}s</span>`));

      const prevExpr = isTts ? 'stepNovelTtsSlice(-1)' : 'stepNovelChapter(-1)';
      const nextExpr = isTts ? 'stepNovelTtsSlice(1)' : 'stepNovelChapter(1)';
      const toggleExpr = isTts ? "toggleNovelPlayback('tts')" : "toggleNovelPlayback('autoPage')";
      const stopExpr = isTts ? "stopNovelPlayback('tts')" : "stopNovelPlayback('autoPage')";

      return `
        <div class="h-[76px] rounded-[16px] rd-ctrl-strip px-2.5 flex items-center justify-between gap-2 relative overflow-hidden">
          <div class="flex items-center gap-2 min-w-0 flex-1">
            <span class="w-[2.5px] h-[34px] rounded-full shrink-0" style="background:var(--rd-ctrl-primary);opacity:${playing ? 1 : 0.72};"></span>
            <span class="w-[34px] h-[34px] rounded-[10px] flex items-center justify-center shrink-0" style="background:var(--rd-ctrl-badge);color:var(--rd-ctrl-primary);">
              ${icon(isTts ? 'headphones' : 'autoPageIcon', 16, 'var(--rd-ctrl-primary)', 1.75)}
            </span>
            <div class="min-w-0 flex-1">
              <div class="text-[12.5px] font-semibold leading-tight truncate" style="color:var(--rd-ctrl-ink);">${novelMeta.chTitle}</div>
              <div class="flex items-center gap-1.5 mt-1 min-w-0">${line2Html}</div>
            </div>
          </div>

          <div class="flex items-center gap-1 shrink-0">
            <button type="button" onclick="${prevExpr}" class="w-[26px] h-[26px] rounded-full flex items-center justify-center rd-pressable" style="color:var(--rd-ctrl-muted);" title="${isTts ? '上一句' : '上一章'}">${icon('prevThin', 14.5)}</button>
            <button type="button" onclick="${toggleExpr}" class="w-[42px] h-[42px] rounded-full rd-play-orb rd-pressable flex items-center justify-center shrink-0" title="${playing ? '暂停' : '播放'}">${icon(playing ? 'pauseClean' : 'playOutline', 17.5, 'var(--rd-ctrl-on-primary)')}</button>
            <button type="button" onclick="${stopExpr}" class="w-[28px] h-[28px] rounded-full rd-clay-dot rd-pressable flex items-center justify-center ${idle ? 'opacity-55' : 'opacity-100'}" title="停止">
              <span class="w-[9px] h-[9px] rounded-[2.5px]" style="background:var(--rd-ctrl-clay-sq);"></span>
            </button>
            <button type="button" onclick="${nextExpr}" class="w-[26px] h-[26px] rounded-full flex items-center justify-center rd-pressable" style="color:var(--rd-ctrl-muted);" title="${isTts ? '下一句' : '下一章'}">${icon('nextThin', 14.5)}</button>
          </div>

          ${idle ? '' : `
            <div class="absolute left-0 right-0 bottom-0 h-[2.5px]" style="background:var(--rd-ctrl-slider-track);">
              <div class="h-full transition-all duration-150" style="width:${pct}%;background:var(--rd-ctrl-primary);"></div>
            </div>
          `}
        </div>
      `;
    }

    function renderNovelDirListMarkup() {
      const q = (state.novelDirSearch || '').trim().toLowerCase();
      let list = NOVEL_DIR_TITLES
        .map((c, i) => ({ c, i }))
        .filter(item => !q || item.c.toLowerCase().includes(q));
      if (state.novelDirReversed) list = list.slice().reverse();
      if (list.length === 0) {
        return `<div class="py-8 text-center text-[12.5px]" style="color:var(--rd-ctrl-muted);">未找到匹配的章节</div>`;
      }
      return list.map(({ c, i }) => {
        const isCur = i === state.novelChapterIdx;
        return `
          <button type="button" ${isCur ? 'data-current-chapter="true"' : ''} onclick="selectNovelChapter(${i}, false)" class="w-full px-3 h-11 rounded-[10px] flex items-center justify-between relative text-left rd-pressable" style="${isCur?'background:var(--rd-ctrl-circle);':'background:transparent;'}color:${isCur?'var(--rd-ctrl-primary)':'var(--rd-ctrl-ink)'};font-weight:${isCur?600:400};">
            ${isCur?`<div class="absolute left-0 top-2.5 bottom-2.5 w-[3.5px] rounded-r-full" style="background:var(--rd-ctrl-accent);"></div>`:''}

            <span class="text-[11px]" style="color:${isCur?'var(--rd-ctrl-primary)':'var(--rd-ctrl-subtle)'};">${isCur?'在读':i<5?'已缓存':''}</span>
          </button>
        `;
      }).join('');

    function renderScreenNovel() {
      const paper = READING_PAPERS.find(p => p.id === state.novelPaper) || READING_PAPERS[2];
      const mod = ['home', 'autoPage', 'tts', 'appearance', 'settings'].includes(state.novelModule) ? state.novelModule : 'home';
      const isHidden = state.novelCtrlMode === 'hidden';
      const activeSheet = state.novelSheet;
      const topMenuOpen = state.novelTopMenuOpen && !isHidden && activeSheet === 'none';
      const curCh = getNovelChapter(state.novelChapterIdx);
      const novelMeta = getNovelDisplayMeta(curCh);
      const isCurrentBookmarked = (state.novelBookmarks || []).some(b => b.chIdx === state.novelChapterIdx);

      const FONTS = [
        { id: '系统', css: 'system-ui, sans-serif' },

        { id: '仿宋', css: '"STFangsong", "FangSong", serif' },
        { id: '等宽', css: 'ui-monospace, monospace' },

      ];
      const TTS_VOICES = [
        { name: '聆小珊女声', tag: '女', desc: '温和叙事 · 系统离线' },
        { name: '云枫醇厚男声', tag: '男', desc: '沉稳有声书 · 系统离线' },
        { name: '晓辰自然标准', tag: '女', desc: '清晰明快 · 系统离线' },
        { name: '婉清温暖故事', tag: '女', desc: '柔和护耳 · 高拟真' },

      const fontCss = (FONTS.find(x => x.id === state.novelFont) || FONTS[1]).css;
      const topFourFonts = () => {
        const base = FONTS.slice(0, 4).map(f => f.id);
        return base.includes(state.novelFont) ? base : [...base.slice(0, 3), state.novelFont];
      };

      const renderCtrlStepper = (valLabel, minusExpr, plusExpr, mTxt = '', pTxt = '', hCls = 'h-8') => `
        <div class="${hCls} flex items-center rounded-full border overflow-hidden shrink-0" style="background:var(--rd-ctrl-card-solid);border-color:var(--rd-ctrl-line);">
          <button type="button" onclick="${minusExpr}" class="w-8 ${hCls} flex items-center justify-center text-[11.5px] font-medium rd-pressable" style="color:var(--rd-ctrl-ink);">${mTxt || icon('minus', 12)}</button>
          <span class="min-w-[46px] px-1.5 text-center text-[11.5px] font-semibold rd-num border-x" style="color:var(--rd-ctrl-ink);border-color:var(--rd-ctrl-line);">${valLabel}</span>
          <button type="button" onclick="${plusExpr}" class="w-8 ${hCls} flex items-center justify-center text-[11.5px] font-medium rd-pressable" style="color:var(--rd-ctrl-ink);">${pTxt || icon('plus', 12)}</button>
        </div>

      const renderCtrlSwitch = (on, expr) => `
        <button type="button" onclick="${expr}" class="rd-toggle border-0 outline-none" data-on="${on?'true':'false'}" aria-pressed="${on}" style="width:38px;height:22px;padding:2px;background:${on?'var(--rd-ctrl-primary)':'var(--rd-ctrl-track)'};">

      // -----------------------------------------------------------------------
      // PART A: LUMINOUS CERAMIC 330px FLOATING CONTROL ISLAND (NO SCRIM)
      // -----------------------------------------------------------------------
      let floatingControlBar = '';
      if (!isHidden) {
        let middleHtml = '';

        if (mod === 'home') {
          middleHtml = `
            <div class="px-3 h-[192px] flex gap-2.5 shrink-0">
              <div class="flex-1 min-w-0 h-[192px] flex flex-col justify-between">
                <!-- Home Top Card: 100% Independent Modal Drawer Triggers (目录 / 搜索 / 替换) -->
                <div class="h-[76px] rounded-[12px] border px-2 grid grid-cols-3 items-center" style="background:var(--rd-ctrl-card);border-color:var(--rd-ctrl-line);">
                  ${[
                    ['tocLines', '目录', "setNovelSheet('directory')"],
                    ['search', '搜索', "setNovelSheet('search')"],
                    ['replace', '替换', "setNovelSheet('replace')"],
                  ].map(([ic, lb, expr]) => `
                    <button type="button" onclick="${expr}" class="h-[58px] rounded-[10px] flex flex-col items-center justify-center gap-1.5 rd-pressable" style="color:var(--rd-ctrl-ink);">
                      ${icon(ic, 21, 'var(--rd-ctrl-ink)', 1.7)}
                      <span class="text-[11px] font-medium leading-none">${lb}</span>
                    </button>
                  `).join('')}
                </div>

                <!-- Home Chapter & Progress Card (Scheme C: Centered + Fixed-Width Paper-Ribbon Pill) -->
                ${(() => {
                  const bmTuckCls = state.novelBookmarkAnim === 'add' ? 'anim-bookmark-tuck' : '';
                  const bmFillCls = state.novelBookmarkAnim === 'reduced'
                    ? 'anim-page-reduced'
                    : (state.novelBookmarkAnim === 'add'
                      ? 'anim-bookmark-fill-down'
                      : (state.novelBookmarkAnim === 'remove' ? 'anim-bookmark-fill-up' : ''));
                  const showFillLayer = isCurrentBookmarked || state.novelBookmarkAnim === 'remove';
                  return `
                    <div class="h-[106px] rounded-[12px] border px-3 flex flex-col justify-center gap-2" style="background:var(--rd-ctrl-card);border-color:var(--rd-ctrl-line);">
                      <div class="flex items-center justify-between gap-2">
                        <button type="button" onclick="stepNovelChapter(-1)" class="w-8 h-8 rounded-full flex items-center justify-center rd-pressable" style="background:var(--rd-ctrl-soft);color:var(--rd-ctrl-ink);" title="上一章">${icon('chevronLeft', 16)}</button>
                        <span class="text-[13.5px] font-semibold truncate" style="color:var(--rd-ctrl-ink);">${novelMeta.chTitle}</span>
                        <button type="button" onclick="stepNovelChapter(1)" class="w-8 h-8 rounded-full flex items-center justify-center rd-pressable" style="background:var(--rd-ctrl-soft);color:var(--rd-ctrl-ink);" title="下一章">${icon('chevronRight', 16)}</button>
                      </div>
                      <div class="flex items-center justify-between px-0.5">
                        <span class="text-[11px] rd-num" style="color:var(--rd-ctrl-muted);">第 ${state.novelChapterIdx + 1} / 1663 章</span>
                        <button id="novel-bookmark-pill" type="button" onclick="toggleNovelBookmark()" class="h-[22px] w-[86px] rounded-full border inline-flex items-center justify-center gap-1 text-[11px] font-medium rd-pressable" style="${isCurrentBookmarked ? 'background:var(--rd-ctrl-circle);border-color:var(--rd-ctrl-primary);color:var(--rd-ctrl-primary);' : 'background:var(--rd-ctrl-soft);border-color:var(--rd-ctrl-line);color:var(--rd-ctrl-ink);'}" title="${isCurrentBookmarked ? '点击移除本章书签' : '点击为本章添加书签'}">
                          <span class="relative inline-flex items-center justify-center w-3 h-3 ${bmTuckCls}">
                            <span class="inline-flex">${icon('bookmark', 12, 'currentColor', 1.85)}</span>
                            ${showFillLayer ? `<span class="absolute top-0 left-0 right-0 overflow-hidden ${bmFillCls}" style="height:${isCurrentBookmarked ? '100%' : '0%'};"><span class="block w-3 h-3">${icon('bookmarkFill', 12)}</span></span>` : ''}
                          </span>
                          <span>${isCurrentBookmarked ? '已加书签' : '加书签'}</span>
                        </button>
                      </div>
                      <div class="flex items-center gap-2.5">
                        <span id="novel-progress-pct-readout" class="text-[10.5px] rd-num w-7" style="color:var(--rd-ctrl-muted);">${state.novelProgressPct}%</span>
                        <input type="range" min="0" max="100" value="${state.novelProgressPct}" style="--val:${state.novelProgressPct}%;" oninput="setNovelProgressSlider(this.value, this)" onchange="commitNovelProgressSlider(this.value)" class="flex-1 rd-progress-slider" />
                        <span class="text-[10.5px] rd-num shrink-0" style="color:var(--rd-ctrl-muted);">共 1663 章</span>
                      </div>
                    </div>
                  `;
                })()}
              </div>

              <!-- Iconic 38px Right Vertical Brightness Rail (Present on HOME only) -->
              <div class="w-[38px] h-[192px] rounded-full border py-2.5 flex flex-col items-center justify-between shrink-0" style="background:var(--rd-ctrl-card);border-color:var(--rd-ctrl-line);">
                <span style="color:var(--rd-ctrl-primary);">${icon('sun', 18, 'var(--rd-ctrl-primary)', 1.8)}</span>
                <div id="novel-brightness-rail" onclick="adjustNovelBrightnessRail(event)" class="w-6 flex-1 my-2 flex items-center justify-center cursor-pointer" title="点击调节阅读亮度 (${state.novelBrightness}%)">
                  <div class="w-2 h-full rounded-full overflow-hidden flex items-end" style="background:var(--rd-ctrl-track);">
                    <div id="novel-brightness-fill" class="w-full rounded-full transition-all" style="height:${state.novelBrightness}%;background:var(--rd-ctrl-primary);"></div>

                    <span class="w-11 text-center font-semibold rd-num" style="color:var(--rd-ctrl-ink);">${twoDigits(state.novelTtsTimerSec)} 秒</span>
                    <button type="button" onclick="stepNovelCustomTimer('tts', false, 5)" class="w-8 h-8 rounded-full flex items-center justify-center rd-pressable" style="background:var(--rd-ctrl-circle);color:var(--rd-ctrl-primary);">+</button>
                  </div>
                </div>
              </div>

              <!-- 朗读引擎 -->
              <div class="rounded-[12px] border p-2.5 space-y-2.5" style="background:var(--rd-ctrl-card-solid);border-color:var(--rd-ctrl-line);">
                <div class="grid grid-cols-2 gap-2">
                  ${[
                    ['系统 TTS', '设备内置离线语音', 'cpu'],
                    ['在线 TTS', '第三方语音服务', 'cloud'],
                  ].map(([eng, desc, ic]) => {
                    const sel = state.novelTtsEngine === eng;
                    return `<button type="button" onclick="state.novelTtsEngine='${eng}';render()" class="p-2.5 rounded-[11px] border text-left rd-pressable" style="${sel?'background:var(--rd-ctrl-circle);border-color:var(--rd-ctrl-primary);':'background:var(--rd-ctrl-field);border-color:var(--rd-ctrl-line);'}">
                      <div class="flex items-center justify-between mb-1">
                        <span style="color:var(--rd-ctrl-primary);">${icon(ic, 14, 'var(--rd-ctrl-primary)')}</span>
                        ${sel?icon('check', 14, 'var(--rd-ctrl-primary)'):''}
                      </div>
                      <div class="text-[12px] font-semibold" style="color:${sel?'var(--rd-ctrl-primary)':'var(--rd-ctrl-ink)'};">${eng}</div>
                      <div class="text-[10.5px] mt-0.5" style="color:var(--rd-ctrl-muted);">${desc}</div>
                    </button>`;
                  }).join('')}
                </div>
                ${state.novelTtsEngine === '系统 TTS' ? `
                  <div class="border-t pt-1 space-y-1" style="border-color:var(--rd-ctrl-line);">
                    <div class="h-9 flex items-center justify-between px-1">
                      <span style="color:var(--rd-ctrl-ink);">语音引擎</span>
                      <span class="text-[11.5px]" style="color:var(--rd-ctrl-muted);">系统默认</span>
                    </div>
                    <button type="button" onclick="cycleNovelTtsLang()" class="w-full h-9 flex items-center justify-between px-1 border-t rd-pressable" style="border-color:var(--rd-ctrl-line);">
                      <span style="color:var(--rd-ctrl-ink);">朗读语言</span>
                      <span class="flex items-center gap-1 text-[11.5px]" style="color:var(--rd-ctrl-muted);">
                        <span>${state.novelTtsLang}</span>${icon('chevronRight', 12)}
                      </span>
                    </button>
                  </div>
                ` : `
                  <div class="border-t pt-2.5 flex items-center justify-between px-1" style="border-color:var(--rd-ctrl-line);">
                    <span style="color:var(--rd-ctrl-ink);">服务信息</span>
                    <button type="button" onclick="toggleNovelOnlineConfig()" class="h-7 px-3 rounded-full text-[11px] font-semibold flex items-center gap-1 rd-pressable" style="${state.novelTtsOnlineConfigured ? 'background:var(--rd-ctrl-circle);color:var(--rd-ctrl-primary);border:1px solid var(--rd-ctrl-primary);' : 'background:var(--rd-ctrl-primary);color:var(--rd-ctrl-on-primary);'}">
                      <span>${state.novelTtsOnlineConfigured ? '已配置 · 编辑' : '立即配置'}</span>
                      ${icon('chevronRight', 11)}
                    </button>
                  </div>
                `}
              </div>

              <!-- 音色选择与试听 / 在线声线服务 -->
              ${state.novelTtsEngine === '系统 TTS' ? `
                <div class="rounded-[12px] border overflow-hidden" style="background:var(--rd-ctrl-card-solid);border-color:var(--rd-ctrl-line);">
                  <div class="px-3 py-2 flex items-center justify-between text-[11.5px] border-b" style="background:var(--rd-ctrl-soft);border-color:var(--rd-ctrl-line);">
                    <span class="font-semibold" style="color:var(--rd-ctrl-ink);">音色选择（点击右侧可试听）</span>
                    <span style="color:var(--rd-ctrl-primary);">系统离线</span>
                  </div>
                  ${TTS_VOICES.map((v, idx) => {
                    const sel = state.novelTtsVoice === v.name;
                    const aud = state.novelAuditionVoice === v.name;
                    return `<div class="px-3 py-2.5 flex items-center justify-between gap-2" style="${idx>0?'border-top:1px solid var(--rd-ctrl-line);':''}${sel?'background:var(--rd-ctrl-circle);':''}">
                      <button type="button" onclick="state.novelTtsVoice='${v.name}';render()" class="flex-1 flex items-center gap-2.5 text-left min-w-0">
                        <span class="w-7 h-7 rounded-full flex items-center justify-center text-[11px] font-semibold shrink-0" style="background:var(--rd-ctrl-primary);color:var(--rd-ctrl-on-primary);opacity:${sel?1:0.75};">${v.tag}</span>
                        <div class="min-w-0">
                          <div class="text-[12.5px] font-semibold truncate" style="color:${sel?'var(--rd-ctrl-primary)':'var(--rd-ctrl-ink)'};">${v.name}</div>
                          <div class="text-[10.5px] truncate" style="color:var(--rd-ctrl-muted);">${v.desc}</div>
                        </div>
                      </button>
                      <button type="button" onclick="state.novelAuditionVoice=state.novelAuditionVoice==='${v.name}'?'':'${v.name}';render()" class="h-7 px-2.5 rounded-full text-[11px] font-medium flex items-center gap-1 border rd-pressable shrink-0" style="${aud?'background:var(--rd-ctrl-primary);color:var(--rd-ctrl-on-primary);border-color:var(--rd-ctrl-primary);':'background:var(--rd-ctrl-card-solid);border-color:var(--rd-ctrl-line);color:var(--rd-ctrl-primary);'}">
                        ${icon('volume', 12)}<span>${aud?'停止试听':'试听'}</span>
                      </button>
                    </div>`;
                  }).join('')}
                </div>
              ` : `
                <div class="rounded-[12px] border p-3 space-y-1.5" style="background:var(--rd-ctrl-card-solid);border-color:var(--rd-ctrl-line);">
                  <div class="flex items-center justify-between">
                    <span class="text-[12px] font-semibold" style="color:var(--rd-ctrl-ink);">在线声线服务</span>
                    <span class="text-[10.5px] px-2 py-0.5 rounded-full font-medium" style="background:var(--rd-ctrl-circle);color:var(--rd-ctrl-primary);">${state.novelTtsOnlineConfigured ? '已连接' : '待配置'}</span>
                  </div>
                  <div class="text-[11px] leading-relaxed" style="color:var(--rd-ctrl-muted);">
                    ${state.novelTtsOnlineConfigured ? '已配置在线声线 · 由第三方 HTTP 服务提供' : '尚未配置在线服务 · 点击上方「立即配置」后自动拉取远端音色'}
                  </div>
                </div>
              `}

              <!-- 5 项播放开关 + 不可用处理 -->
              <div class="rounded-[12px] border overflow-hidden" style="background:var(--rd-ctrl-card-solid);border-color:var(--rd-ctrl-line);">
                ${[
                  ['跟随高亮', 'novelTtsFollowHighlight'],
                  ['来电自动暂停', 'novelTtsPauseInterrupt'],
                  ['允许与其他应用同时播放', 'novelTtsAllowMixing'],
                  ['后台继续朗读', 'novelTtsBackground'],
                  ['朗读时屏幕常亮', 'novelTtsKeepScreenOn'],
                ].map(([lbl, key], i) => `
                  <div class="px-3 h-10 flex items-center justify-between text-[12px]" style="${i>0?'border-top:1px solid var(--rd-ctrl-line);':''}color:var(--rd-ctrl-ink);">
                    <span>${lbl}</span>
                    ${renderCtrlSwitch(state[key], `state.${key}=!state.${key};render()`)}
                  </div>
                `).join('')}
                <div class="px-3 py-2.5 border-t flex items-center justify-between text-[12px]" style="border-color:var(--rd-ctrl-line);color:var(--rd-ctrl-ink);">
                  <span>不可用内容处理</span>
                  <div class="flex gap-1">
                    ${[['skip','跳过'],['stop','停止提示']].map(([k,l])=>`<button type="button" onclick="state.novelTtsFailurePolicy='${k}';render()" class="h-7 px-2.5 rounded-full text-[11px] rd-pressable" style="${state.novelTtsFailurePolicy===k?'background:var(--rd-ctrl-primary);color:var(--rd-ctrl-on-primary);font-weight:600;':'background:var(--rd-ctrl-soft);color:var(--rd-ctrl-ink);'}">${l}</button>`).join('')}
                  </div>
                </div>
              </div>
            </div>
          `;
        } else {
          body = `
            <div class="flex-1 overflow-y-auto rd-scroll space-y-3 pr-0.5">
              <div class="p-3 rounded-[12px] border space-y-2" style="background:var(--rd-ctrl-card-solid);border-color:var(--rd-ctrl-line);">
                <div class="text-[12px] font-semibold" style="color:var(--rd-ctrl-ink);">屏幕方向</div>
                <div class="grid grid-cols-3 gap-1.5">
                  ${['跟随系统','锁定竖屏','锁定横屏'].map(o=>`<button type="button" onclick="state.novelScreenOrient='${o}';render()" class="h-8 rounded-full text-[11.5px] rd-pressable" style="${state.novelScreenOrient===o?'background:var(--rd-ctrl-primary);color:var(--rd-ctrl-on-primary);font-weight:600;':'background:var(--rd-ctrl-soft);color:var(--rd-ctrl-ink);'}">${o}</button>`).join('')}
                </div>
              </div>
              <div class="p-3 rounded-[12px] border space-y-2" style="background:var(--rd-ctrl-card-solid);border-color:var(--rd-ctrl-line);">
                <div class="text-[12px] font-semibold" style="color:var(--rd-ctrl-ink);">屏幕常亮时长</div>
                <div class="grid grid-cols-5 gap-1">
                  ${['跟随','1分钟','5分钟','10分钟','常亮'].map(t=>`<button type="button" onclick="state.novelTimeout='${t}';render()" class="h-8 rounded-full text-[11px] rd-pressable" style="${state.novelTimeout===t?'background:var(--rd-ctrl-primary);color:var(--rd-ctrl-on-primary);font-weight:600;':'background:var(--rd-ctrl-soft);color:var(--rd-ctrl-ink);'}">${t}</button>`).join('')}
                </div>
              </div>
              <div class="rounded-[12px] border overflow-hidden" style="background:var(--rd-ctrl-card-solid);border-color:var(--rd-ctrl-line);">
                ${[
                  ['文字两端对齐', 'novelJustify'],
                  ['拓展至状态栏 / 灵动岛', 'novelExtendStatusBar'],
                  ['长按选择正文文本', 'novelLongPressSelect'],
                ].map(([lbl, key], i) => `
                  <div class="px-3 h-11 flex items-center justify-between text-[12.5px]" style="${i>0?'border-top:1px solid var(--rd-ctrl-line);':''}color:var(--rd-ctrl-ink);">
                    <span>${lbl}</span>
                    ${renderCtrlSwitch(state[key], `state.${key}=!state.${key};render()`)}
                  </div>
                `).join('')}
              </div>
            </div>
          `;
        }

        const isTablet = state.device === 'tablet';
        const isCompactSheet = activeSheet === 'autoPageMore' || activeSheet === 'settingsMore';
        const isSideSheet = isTablet && ['directory', 'search', 'replace'].includes(activeSheet);
        const sheetAnimCls = state.overlayAnim === 'reduced'
          ? 'anim-page-reduced'
          : (state.overlayAnim === 'sheet' ? (isTablet ? (isSideSheet ? 'anim-side-sheet-in' : 'anim-modal-in') : 'anim-sheet-up') : '');
        const sheetBackdropCls = isTablet
          ? (isSideSheet ? 'flex justify-end items-stretch p-3' : 'flex items-center justify-center p-5')
          : 'flex items-end';
        const sheetCardCls = isTablet
          ? (isSideSheet ? 'w-[348px] h-full rounded-[22px] p-4 border' : 'w-[420px] max-h-[86%] rounded-[22px] p-4 border overflow-hidden')
          : 'w-full rounded-t-[24px] px-4 pb-5 border-t';
        const sheetCardStyle = isTablet
          ? 'background:var(--rd-ctrl-shell);border-color:var(--rd-ctrl-line);box-shadow:var(--rd-e3-shadow);'
          : `${isCompactSheet ? 'max-height:78%;' : 'height:78%;'}background:var(--rd-ctrl-shell);border-color:var(--rd-ctrl-line);box-shadow:var(--rd-e3-shadow);`;
        modalSheet = `
          <div onclick="setNovelSheet('none')" class="absolute inset-0 ${sheetBackdropCls}" style="background:var(--rd-ctrl-scrim);z-index:40;">
            <div onclick="event.stopPropagation()" class="${sheetCardCls} flex flex-col ${sheetAnimCls} rd-glass-heavy" style="${sheetCardStyle}">
              ${!isTablet ? `
                <div class="pt-2.5 pb-2.5 flex justify-center shrink-0">
                  <div class="w-9 h-[4px] rounded-full" style="background:var(--rd-ctrl-handle);"></div>
                </div>
              ` : ''}
              <div class="flex items-center justify-between mb-3 shrink-0">
                <span class="text-[18px] font-semibold" style="color:var(--rd-ctrl-ink);">${sheetTitles[activeSheet]}</span>
                <button type="button" onclick="setNovelSheet('none')" class="w-8 h-8 rounded-full flex items-center justify-center rd-pressable" style="background:var(--rd-ctrl-soft);color:var(--rd-ctrl-muted);" title="关闭">${icon('close', 16)}</button>
              </div>
              ${body}
            </div>
          </div>
        `;
      }

      // Original 24vp Ceramic-Paper Session Capsule (Figma 1164:10275 / ReaderSessionCapsule.ets)
      // Preserves original compact geometry, footer-right placement & click-to-pause/resume;
      // only upgrades primary accent to Paper & Pine 2.0 (var(--rd-ctrl-primary)).
      const hasActiveCapsule = isHidden && state.novelSession !== 'none' && activeSheet === 'none';
      const capsuleAnimCls = state.novelCtrlAnim === 'reduced'
        ? 'anim-page-reduced'
        : (state.novelCtrlAnim === 'capsule' ? 'anim-capsule-launch' : '');
      const isCapPlaying = state.novelSession === 'autoPage' ? state.novelAutoStatus === 'playing' : state.novelTtsStatus === 'playing';
      const capLabel = state.novelSession === 'autoPage' ? '自动翻页' : '朗读';
      const capShadow = paper.scheme === 'night' ? '0 3px 10px rgba(0, 0, 0, 0.34)' : '0 3px 8px rgba(70, 52, 35, 0.08)';
      const capLeading = state.novelSession === 'autoPage'
        ? `<span class="w-4 h-4 rounded-full inline-flex items-center justify-center shrink-0 text-[9.5px] font-semibold rd-num" style="background:var(--rd-ctrl-primary);color:var(--rd-ctrl-on-primary);"><span id="novel-capsule-countdown">${Math.max(0, Math.trunc(state.novelAutoRem))}</span></span>`
        : `<span class="w-4 h-4 inline-flex items-center justify-center shrink-0" style="color:var(--rd-ctrl-primary);">${icon('headphones', 11, 'currentColor', 1.8)}</span>`;
      const capsule = hasActiveCapsule ? `
        <button type="button" id="novel-session-capsule" onclick="event.stopPropagation();toggleNovelPlayback('${state.novelSession}')" title="${isCapPlaying ? '暂停' : '继续'}${capLabel}" class="h-[24px] rounded-[12px] pl-[5px] pr-[4px] ${state.novelSession==='autoPage'?'min-w-[96px]':'min-w-[94px]'} border inline-flex items-center justify-between gap-[5px] cursor-pointer rd-pressable shrink-0 ${capsuleAnimCls}" style="background:var(--rd-ctrl-card-solid);border-color:var(--rd-ctrl-line);color:var(--rd-ctrl-ink);box-shadow:${capShadow};font-family:var(--rd-sans);letter-spacing:0;line-height:1;">
          ${capLeading}
          <span class="text-[11px] font-medium whitespace-nowrap" style="color:var(--rd-ctrl-ink);">${capLabel}</span>
          <span class="w-4 h-4 rounded-full inline-flex items-center justify-center shrink-0" style="background:var(--rd-ctrl-primary);color:var(--rd-ctrl-on-primary);">${icon(isCapPlaying ? 'pause' : 'play', 8)}</span>
        </button>
      ` : '';

      const novelToastBanner = state.novelToast ? `
        <div class="absolute top-16 left-0 right-0 mx-auto w-fit px-3.5 py-1.5 rounded-full text-[12px] font-medium anim-toast-down pointer-events-none whitespace-nowrap" style="z-index:55;background:var(--rd-ctrl-primary);color:var(--rd-ctrl-on-primary);box-shadow:var(--rd-e2-shadow);">${state.novelToast}</div>
      ` : '';

      const highlightBody = (state.novelTtsStatus === 'playing' && state.novelTtsFollowHighlight) || (state.novelAutoStatus === 'playing' && state.novelAutoFollowHighlight);
      const novelTopBarAnimCls = state.novelCtrlAnim === 'reduced'
        ? 'anim-page-reduced'
        : (state.novelCtrlAnim === 'show' ? 'anim-ctrl-topbar-show' : '');

      const renderNovelPara = (p, highlight) =>
        `<p style="text-indent:${state.novelIndent==='2字符'?'2em':state.novelIndent==='1字符'?'1em':'0'};${highlight ? 'background:var(--rd-ctrl-circle);border-left:2px solid var(--rd-ctrl-primary);padding:4px 8px;border-radius:7px;' : ''}">${p}</p>`;
      const nextCh = getNovelChapter((state.novelChapterIdx + 1) % NOVEL_DIR_TITLES.length);
      const isTabletSpread = state.device === 'tablet' && state.wideNovelColumns === 'spread';
      const novelBodyHtml = isTabletSpread ? `
        <div class="max-w-[680px] mx-auto w-full flex-1 min-h-0 grid grid-cols-2 gap-8 items-start relative overflow-hidden">
          <div class="flex flex-col" style="gap:${state.novelParaGap}px;">
            ${curCh.paras.map((p, idx) => renderNovelPara(p, idx === 1 && highlightBody)).join('')}
          </div>
          <div class="pointer-events-none absolute left-1/2 top-2 bottom-2 w-px -translate-x-1/2" style="background:var(--rd-ctrl-line);opacity:0.55;"></div>
          <div class="flex flex-col" style="gap:${state.novelParaGap}px;">
            <div class="text-[11px] font-medium rd-sans opacity-65" style="color:${paper.meta};">${nextCh.title}</div>
            ${nextCh.paras.map(p => renderNovelPara(p, false)).join('')}
          </div>
        </div>
        <div class="max-w-[680px] mx-auto w-full min-h-[24px] flex items-center justify-between text-[11px] pt-2 rd-num" style="color:${paper.meta};font-family:var(--rd-sans);">
          <span>第 ${state.novelChapterIdx * 2 + 1} 页 · ${curCh.title}</span>
          <div class="flex items-center gap-2"><span>第 ${state.novelChapterIdx * 2 + 2} 页 · <span id="novel-footer-progress">${state.novelProgressPct}%</span></span>${hasActiveCapsule ? capsule : '<span>· 12:50 · 100%</span>'}</div>
        </div>
      ` : `
        <div class="${state.device==='tablet'?'max-w-[520px] mx-auto w-full':''} flex-1 min-h-0 flex flex-col justify-between">
          <div style="display:flex;flex-direction:column;gap:${state.novelParaGap}px;">
            ${curCh.paras.map((p, idx) => renderNovelPara(p, idx === 1 && highlightBody)).join('')}
          </div>
          <div class="min-h-[24px] flex items-center justify-between text-[11px] pt-2 rd-num" style="color:${paper.meta};font-family:var(--rd-sans);">
            <span><span id="novel-footer-progress">${state.novelProgressPct}%</span> · 第 ${state.novelChapterIdx + 1} / 1663 章</span>
            ${hasActiveCapsule ? capsule : '<span>12:50 · 100%</span>'}
          </div>
        </div>
      `;

      const novelBrightnessFilter = `brightness(${(0.55 + state.novelBrightness * 0.0045).toFixed(2)})`;

      return `
        <div class="flex-1 flex flex-col overflow-hidden relative" style="background:${paper.bg};color:${paper.ink};">
          ${!isHidden ? `
            <div class="px-3.5 pt-2.5 pb-1.5 absolute top-0 left-0 right-0 z-20 pointer-events-none ${novelTopBarAnimCls}">
              <div class="pointer-events-auto ${state.device==='tablet'?'max-w-[580px] mx-auto':''} h-[52px] rounded-full px-2.5 flex items-center justify-between border" style="background:var(--rd-veil-bg);border-color:var(--rd-veil-border);box-shadow:var(--rd-float-shadow);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);">
                <button type="button" onclick="state.novelTopMenuOpen=false;navBack('bookshelf')" class="w-9 h-9 rounded-full flex items-center justify-center rd-pressable shrink-0" style="color:var(--rd-ink);" title="返回上一级">${icon('arrowLeft', 20)}</button>
                <div class="flex-1 min-w-0 px-2">
                  <div class="text-[15.5px] font-bold truncate" style="color:var(--rd-ink);">${novelMeta.bookTitle}</div>
                  <div class="text-[11px] truncate" style="color:var(--rd-muted);">${novelMeta.chTitle} · ${novelMeta.sourceName}</div>
                </div>
                <div class="flex items-center gap-1 shrink-0">
                  <button type="button" onclick="state.novelTopMenuOpen=false;openSourceSwitch('novel')" class="h-8 pl-2 pr-2.5 rounded-full border text-[12px] leading-none font-medium inline-flex items-center justify-center gap-[3px] whitespace-nowrap rd-pressable" style="background:var(--rd-surface);border-color:var(--rd-line);color:var(--rd-ink);" title="更换书源">
                    ${icon('swap', 15, 'currentColor', 1.65)}<span class="leading-none">换源</span>
                  </button>
                  <button type="button" onclick="toggleNovelTopMenu()" class="w-9 h-9 rounded-full flex items-center justify-center rd-pressable" style="${topMenuOpen?'background:var(--rd-primary-soft);color:var(--rd-primary);':'color:var(--rd-ink);'}" title="更多书籍操作">${icon('moreH', 19)}</button>
                </div>
              </div>
            </div>
          ` : `
            ${isCurrentBookmarked ? `
              <span id="novel-page-bookmark-marker" class="pointer-events-none absolute top-0 ${state.device==='tablet'?'right-8':'right-5'} anim-bookmark-edge-slide" style="z-index:15;color:var(--rd-ctrl-primary);" title="本页已添加书签">
                <svg width="14" height="20" viewBox="0 0 16 22"><path d="M1.5,0 H14.5 V20.5 L8,15.5 L1.5,20.5 Z" fill="currentColor" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg>
              </span>
            ` : ''}
            <div class="px-5 pt-2.5 absolute top-0 left-0 right-0 z-10 pointer-events-none" style="color:${paper.meta};">
              <div class="${state.device==='tablet'?'max-w-[680px] mx-auto':''} flex items-center justify-between gap-2 text-[11px]">
                <span class="truncate min-w-0 pr-6">${novelMeta.chTitle}</span>
              </div>
            </div>
          `}

          <!-- Reading Body Canvas -->
          <div id="novel-reading-body" onclick="if(state.novelTopMenuOpen){toggleNovelTopMenu(false);}else if(state.novelCtrlMode==='hidden'){setNovelCtrlMode('open');}else{setNovelCtrlMode('hidden');}" class="flex-1 px-6 pt-[68px] pb-3 overflow-hidden cursor-pointer flex flex-col justify-between" style="font-family:${fontCss};font-size:${state.novelFontSize}px;line-height:${state.novelLineHeight};letter-spacing:${state.novelLetterSpacing}px;text-align:${state.novelJustify?'justify':'left'};filter:${novelBrightnessFilter};">
            ${novelBodyHtml}
          </div>

          ${floatingControlBar}
          ${topMenuOverlay}
          ${novelToastBanner}
          ${modalSheet}
        </div>
      `;
    }

    function renderMangaDirListMarkup() {
