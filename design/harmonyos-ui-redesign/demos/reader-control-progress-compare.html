<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>控制栏章节进度布局对比 Demo</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    .rd-num { font-variant-numeric: tabular-nums; }
    .rd-serif { font-family: "Songti SC", "Noto Serif SC", "STSong", serif; }
    .rd-pressable {
      transition: transform 140ms ease, opacity 140ms ease, background-color 140ms ease;
      cursor: pointer;
      user-select: none;
    }
    .rd-pressable:active { transform: scale(0.97); opacity: 0.88; }

    .rd-preview[data-theme="day"] {
      --rd-paper-bg: #EDE2CB;
      --rd-paper-ink: #2B241D;
      --rd-paper-meta: #766C61;
      --rd-ctrl-shell: rgba(255, 250, 244, 0.96);
      --rd-ctrl-card: rgba(255, 252, 248, 0.92);
      --rd-ctrl-card-solid: #FFFCF8;
      --rd-ctrl-soft: rgba(238, 230, 219, 0.56);
      --rd-ctrl-line: rgba(180, 166, 151, 0.34);
      --rd-ctrl-primary: #1F3D31;
      --rd-ctrl-on-primary: #FAF7F0;
      --rd-ctrl-circle: rgba(31, 61, 49, 0.10);
      --rd-ctrl-accent: #B86B2B;
      --rd-ctrl-ink: #332C25;
      --rd-ctrl-muted: #5B5046;
      --rd-ctrl-handle: #B9AD9F;
      --rd-ctrl-track: rgba(92, 79, 63, 0.22);
      --rd-ctrl-shadow: 0 14px 34px rgba(24, 30, 26, 0.16), 0 3px 10px rgba(24, 30, 26, 0.08);
    }

    .rd-preview[data-theme="night"] {
      --rd-paper-bg: #21221F;
      --rd-paper-ink: #E4DDD0;
      --rd-paper-meta: #9D968B;
      --rd-ctrl-shell: rgba(33, 38, 34, 0.96);
      --rd-ctrl-card: #272D28;
      --rd-ctrl-card-solid: #272D28;
      --rd-ctrl-soft: #1C201D;
      --rd-ctrl-line: rgba(236, 232, 224, 0.16);
      --rd-ctrl-primary: #7BB094;
      --rd-ctrl-on-primary: #111B16;
      --rd-ctrl-circle: rgba(123, 176, 148, 0.16);
      --rd-ctrl-accent: #D99452;
      --rd-ctrl-ink: #ECE8E0;
      --rd-ctrl-muted: #A6A196;
      --rd-ctrl-handle: rgba(236, 232, 224, 0.28);
      --rd-ctrl-track: rgba(236, 232, 224, 0.22);
      --rd-ctrl-shadow: 0 14px 36px rgba(0, 0, 0, 0.52), 0 3px 10px rgba(0, 0, 0, 0.32);
    }

    input[type="range"].rd-progress-slider {
      -webkit-appearance: none;
      appearance: none;
      height: 5px;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--rd-ctrl-accent) 0%, var(--rd-ctrl-accent) var(--val, 64%), var(--rd-ctrl-track) var(--val, 64%), var(--rd-ctrl-track) 100%);
      outline: none;
      cursor: pointer;
    }
    input[type="range"].rd-progress-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 999px;
      background: var(--rd-ctrl-card-solid);
      border: 3px solid var(--rd-ctrl-accent);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.18);
    }
  </style>
</head>
<body class="bg-transparent text-[var(--foreground)] antialiased p-0 m-0">
  <div id="app" class="py-1.5 space-y-2"></div>

  <script>
    const TOTAL_CH = 1663;
    const ORIGIN_CH = 1064;
    const ORIGIN_PCT = 64;
    const CH_TITLES = {
      1062: '第1062章 · 旧约将至',
      1063: '第1063章 · 登门拜访',
      1064: '第1064章 · 云岚宗的来客',
      1065: '第1065章 · 青莲之威',
      1066: '第1066章 · 破局而去',
    };

    const VARIANTS = [
      { id: 'current', label: '当前原型', desc: '当前态：106px 卡片仅用 justify-between 上下贴边，正中留出约 36px 空白带。' },
      { id: 'A', label: 'A 副信息+返位', desc: '方案 A：居中收紧 + 章节下补「章序/总量」，拖动或翻章后自动浮现「返回原位」。' },
      { id: 'B', label: 'B 纯视觉收敛', desc: '方案 B：零新增元素，微调为「快捷 84px + 进度 98px」并居中排布，直接消除中空带。' },
      { id: 'C', label: 'C 快捷书签', desc: '方案 C：居中收紧并在中腰放入「第 N/总章 + 一键加书签」微胶囊，兼顾密度与高频操作。' },
    ];

    const state = {
      variant: 'A',
      order: 'quickTop', // quickTop | progressTop
      theme: 'day',      // day | night
      chapter: ORIGIN_CH,
      pct: ORIGIN_PCT,
      brightness: 74,
      brightnessAuto: true,
      bookmarked: false,
    };

    function icon(name, size = 18) {
      const paths = {
        tocLines: '<circle cx="5" cy="6" r="1" fill="currentColor" stroke="none"/><path d="M9 6h11"/><circle cx="5" cy="12" r="1" fill="currentColor" stroke="none"/><path d="M9 12h11"/><circle cx="5" cy="18" r="1" fill="currentColor" stroke="none"/><path d="M9 18h11"/>',
        search: '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
        replace: '<path d="M16 3h5v5"/><path d="M21 3 14 10"/><path d="M3 12a9 9 0 0 1 11-8.7"/><path d="M8 21H3v-5"/><path d="m3 21 7-7"/><path d="M21 12a9 9 0 0 1-11 8.7"/>',
        chevronLeft: '<path d="m15 18-6-6 6-6"/>',
        chevronRight: '<path d="m9 6 6 6-6 6"/>',
        sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>',
        fastFwd: '<polygon points="13 19 22 12 13 5 13 19"/><polygon points="2 19 11 12 2 5 2 19"/>',
        headphones: '<path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/>',
        palette: '<circle cx="13.5" cy="6.5" r=".5" fill="currentColor"/><circle cx="17.5" cy="10.5" r=".5" fill="currentColor"/><circle cx="8.5" cy="7.5" r=".5" fill="currentColor"/><circle cx="6.5" cy="12.5" r=".5" fill="currentColor"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z"/>',
        settings: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c.26.6.77 1 1.42 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>',
        bookmark: '<path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/>',
        bookmarkFill: '<path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z" fill="currentColor"/>',
        undo: '<path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/>',
      };
      return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${paths[name] || ''}</svg>`;
    }

    function chapterTitle() {
      return CH_TITLES[state.chapter] || `第${state.chapter}章 · 斗破苍穹`;
    }

    function renderQuickCard(hCls) {
      return `
        <div class="${hCls} rounded-[12px] border px-2 grid grid-cols-3 items-center" style="background:var(--rd-ctrl-card);border-color:var(--rd-ctrl-line);">
          ${[['tocLines', '目录'], ['search', '搜索'], ['replace', '替换']].map(([ic, lb]) => `
            <div class="h-[56px] rounded-[10px] flex flex-col items-center justify-center gap-1" style="color:var(--rd-ctrl-ink);">
              ${icon(ic, 20)}
              <span class="text-[11px] font-medium leading-none">${lb}</span>
            </div>
          `).join('')}
        </div>
      `;
    }

    function renderProgressCard() {
      const chTitle = chapterTitle();
      const moved = state.chapter !== ORIGIN_CH || state.pct !== ORIGIN_PCT;
      const sliderHtml = `<input id="cmp-slider" type="range" min="1" max="100" value="${state.pct}" style="--val:${state.pct}%;" oninput="onSliderInput(this.value, this)" class="flex-1 min-w-0 rd-progress-slider" />`;
      const prevBtn = `<button type="button" onclick="stepChapter(-1)" class="w-8 h-8 rounded-full flex items-center justify-center rd-pressable shrink-0" style="background:var(--rd-ctrl-soft);color:var(--rd-ctrl-ink);" title="上一章">${icon('chevronLeft', 16)}</button>`;
      const nextBtn = `<button type="button" onclick="stepChapter(1)" class="w-8 h-8 rounded-full flex items-center justify-center rd-pressable shrink-0" style="background:var(--rd-ctrl-soft);color:var(--rd-ctrl-ink);" title="下一章">${icon('chevronRight', 16)}</button>`;

      if (state.variant === 'current') {
        return `
          <div class="h-[106px] rounded-[12px] border px-3 py-2.5 flex flex-col justify-between" style="background:var(--rd-ctrl-card);border-color:var(--rd-ctrl-line);">
            <div class="flex items-center justify-between gap-2">
              ${prevBtn}
              <span id="cmp-ch-title" class="text-[13px] font-semibold truncate" style="color:var(--rd-ctrl-ink);">${chTitle}</span>
              ${nextBtn}
            </div>
            <div class="flex items-center gap-2 pb-1">
              <span id="cmp-pct" class="text-[11px] rd-num w-7 shrink-0" style="color:var(--rd-ctrl-muted);">${state.pct}%</span>
              ${sliderHtml}
              <span class="text-[11px] rd-num shrink-0" style="color:var(--rd-ctrl-muted);">共 ${TOTAL_CH} 章</span>
            </div>
          </div>
        `;
      }

      if (state.variant === 'A') {
        return `
          <div class="h-[106px] rounded-[12px] border px-3 flex flex-col justify-center gap-2.5" style="background:var(--rd-ctrl-card);border-color:var(--rd-ctrl-line);">
            <div class="flex items-center justify-between gap-1.5">
              ${prevBtn}
              <div class="flex-1 min-w-0 flex flex-col items-center">
                <span id="cmp-ch-title" class="text-[13px] font-semibold truncate max-w-full" style="color:var(--rd-ctrl-ink);">${chTitle}</span>
                <div id="cmp-sub-meta" class="mt-0.5 flex items-center justify-center gap-1.5 text-[11px] rd-num leading-none" style="color:var(--rd-ctrl-muted);">
                  <span>第 ${state.chapter} / ${TOTAL_CH} 章</span>
                  ${moved
                    ? `<button type="button" onclick="resetOrigin()" class="h-[18px] px-1.5 rounded-full inline-flex items-center gap-0.5 text-[10px] font-semibold rd-pressable" style="background:var(--rd-ctrl-circle);color:var(--rd-ctrl-primary);">${icon('undo', 10)}<span>返回原位</span></button>`
                    : `<span>· 进度 ${state.pct}%</span>`}
                </div>
              </div>
              ${nextBtn}
            </div>
            <div class="flex items-center gap-2.5">
              <span id="cmp-pct" class="text-[11px] rd-num w-7 shrink-0" style="color:var(--rd-ctrl-muted);">${state.pct}%</span>
              ${sliderHtml}
              <span class="text-[11px] rd-num shrink-0" style="color:var(--rd-ctrl-muted);">100%</span>
            </div>
          </div>
        `;
      }

      if (state.variant === 'B') {
        return `
          <div class="h-[98px] rounded-[12px] border px-3 flex flex-col justify-center gap-3" style="background:var(--rd-ctrl-card);border-color:var(--rd-ctrl-line);">
            <div class="flex items-center justify-between gap-2">
              ${prevBtn}
              <span id="cmp-ch-title" class="text-[13px] font-semibold truncate" style="color:var(--rd-ctrl-ink);">${chTitle}</span>
              ${nextBtn}
            </div>
            <div class="flex items-center gap-2">
              <span id="cmp-pct" class="text-[11px] rd-num w-7 shrink-0" style="color:var(--rd-ctrl-muted);">${state.pct}%</span>
              ${sliderHtml}
              <span class="text-[11px] rd-num shrink-0" style="color:var(--rd-ctrl-muted);">共 ${TOTAL_CH} 章</span>
            </div>
          </div>
        `;
      }

      // Variant C: Quick Bookmark
      return `
        <div class="h-[106px] rounded-[12px] border px-3 flex flex-col justify-center gap-2" style="background:var(--rd-ctrl-card);border-color:var(--rd-ctrl-line);">
          <div class="flex items-center justify-between gap-2">
            ${prevBtn}
            <span id="cmp-ch-title" class="text-[13px] font-semibold truncate" style="color:var(--rd-ctrl-ink);">${chTitle}</span>
            ${nextBtn}
          </div>
          <div class="flex items-center justify-between px-1">
            <span id="cmp-sub-meta" class="text-[11px] rd-num" style="color:var(--rd-ctrl-muted);">第 ${state.chapter} / ${TOTAL_CH} 章</span>
            <button type="button" onclick="state.bookmarked=!state.bookmarked;render()" class="h-[22px] px-2 rounded-full border inline-flex items-center gap-1 text-[11px] font-medium rd-pressable" style="${state.bookmarked ? 'background:var(--rd-ctrl-circle);border-color:var(--rd-ctrl-primary);color:var(--rd-ctrl-primary);' : 'background:var(--rd-ctrl-soft);border-color:var(--rd-ctrl-line);color:var(--rd-ctrl-ink);'}">
              ${icon(state.bookmarked ? 'bookmarkFill' : 'bookmark', 11)}
              <span>${state.bookmarked ? '已加书签' : '加书签'}</span>
            </button>
          </div>
          <div class="flex items-center gap-2">
            <span id="cmp-pct" class="text-[11px] rd-num w-7 shrink-0" style="color:var(--rd-ctrl-muted);">${state.pct}%</span>
            ${sliderHtml}
            <span class="text-[11px] rd-num shrink-0" style="color:var(--rd-ctrl-muted);">共 ${TOTAL_CH} 章</span>
          </div>
        </div>
      `;
    }

    function render() {
      const quickH = state.variant === 'B' ? 'h-[84px]' : 'h-[76px]';
      const quickCard = renderQuickCard(quickH);
      const progCard = renderProgressCard();
      const colContent = state.order === 'progressTop' ? `${progCard}${quickCard}` : `${quickCard}${progCard}`;
      const activeMeta = VARIANTS.find(v => v.id === state.variant) || VARIANTS[0];

      document.getElementById('app').innerHTML = `
        <div class="flex flex-wrap items-center justify-between gap-2 pb-2 border-b border-[var(--card-border)] text-xs">
          <div class="flex items-center gap-1 flex-wrap">
            ${VARIANTS.map(v => {
              const act = state.variant === v.id;
              return `<button type="button" onclick="state.variant='${v.id}';render()" class="h-7 px-2.5 rounded-full font-medium transition-colors rd-pressable ${act ? 'bg-[var(--primary)] text-[var(--primary-foreground)]' : 'bg-[var(--secondary)] text-[var(--secondary-foreground)]'}">${v.label}</button>`;
            }).join('')}
          </div>
          <div class="flex items-center gap-1.5 shrink-0">
            <button type="button" onclick="state.order=state.order==='quickTop'?'progressTop':'quickTop';render()" class="h-7 px-2.5 rounded-full border border-[var(--border)] bg-[var(--secondary)] text-[var(--secondary-foreground)] font-medium rd-pressable">${state.order === 'quickTop' ? '快捷在上' : '进度在上'}</button>
            <button type="button" onclick="state.theme=state.theme==='day'?'night':'day';render()" class="h-7 px-2.5 rounded-full border border-[var(--border)] bg-[var(--secondary)] text-[var(--secondary-foreground)] font-medium rd-pressable">${state.theme === 'day' ? '日间' : '夜间'}</button>
          </div>
        </div>

        <div class="rd-preview rounded-2xl px-3 py-2.5 flex justify-center relative overflow-hidden" data-theme="${state.theme}" style="background:var(--rd-paper-bg);">
          <div class="pointer-events-none absolute inset-x-6 top-2.5 rd-serif text-[13px] leading-relaxed opacity-35 select-none" style="color:var(--rd-paper-ink);">
            萧炎微微点头，目光扫过院中那几道气势不凡的身影……
          </div>

          <div class="w-full max-w-[356px] rounded-[24px] border flex flex-col relative z-10" style="height:330px;background:var(--rd-ctrl-shell);border-color:var(--rd-ctrl-line);box-shadow:var(--rd-ctrl-shadow);">
            <div class="pt-2.5 pb-2.5 flex justify-center shrink-0">
              <div class="w-9 h-[4px] rounded-full" style="background:var(--rd-ctrl-handle);"></div>
            </div>

            <div class="px-3 h-[192px] flex gap-2.5 shrink-0">
              <div class="flex-1 min-w-0 h-[192px] flex flex-col justify-between">
                ${colContent}
              </div>

              <div class="w-[38px] h-[192px] rounded-full border py-2.5 flex flex-col items-center justify-between shrink-0" style="background:var(--rd-ctrl-card);border-color:var(--rd-ctrl-line);">
                <span style="color:var(--rd-ctrl-primary);">${icon('sun', 17)}</span>
                <div onclick="adjustBrightness(event)" class="w-6 flex-1 my-2 flex items-center justify-center cursor-pointer" title="点击调节亮度">
                  <div class="w-2 h-[108px] rounded-full overflow-hidden flex items-end" style="background:var(--rd-ctrl-track);">
                    <div id="cmp-bright-fill" class="w-full rounded-full transition-all" style="height:${state.brightness}%;background:var(--rd-ctrl-primary);"></div>
                  </div>
                </div>
                <button type="button" onclick="state.brightnessAuto=!state.brightnessAuto;render()" class="w-6 h-6 rounded-full border text-[11px] font-semibold flex items-center justify-center rd-pressable" style="${state.brightnessAuto ? 'background:var(--rd-ctrl-circle);border-color:var(--rd-ctrl-primary);color:var(--rd-ctrl-primary);' : 'background:var(--rd-ctrl-card-solid);border-color:var(--rd-ctrl-line);color:var(--rd-ctrl-ink);'}">A</button>
              </div>
            </div>

            <div class="mx-3 mt-2.5 h-[78px] rounded-[16px] border px-1.5 grid grid-cols-4 items-center shrink-0" style="background:var(--rd-ctrl-card-solid);border-color:var(--rd-ctrl-line);">
              ${[
                ['fastFwd', '翻页'],
                ['headphones', '朗读'],
                ['palette', '界面'],
                ['settings', '设置'],
              ].map(([ic, lb]) => `
                <div class="h-[64px] flex flex-col items-center justify-center gap-1">
                  <div class="w-[42px] h-[42px] rounded-full flex items-center justify-center" style="background:var(--rd-ctrl-circle);color:var(--rd-ctrl-primary);">${icon(ic, 19)}</div>
                  <span class="text-[10.5px] leading-none font-semibold" style="color:var(--rd-ctrl-ink);">${lb}</span>
                </div>
              `).join('')}
            </div>
          </div>
        </div>

        <p class="text-xs text-[var(--muted-foreground)] leading-snug">${activeMeta.desc} 可直接拖动滑块、点上一章/下一章体验效果。</p>
      `;
    }

    window.onSliderInput = (val, inputEl) => {
      const pct = Math.max(1, Math.min(100, parseInt(val, 10) || 1));
      state.pct = pct;
      state.chapter = Math.max(1, Math.min(TOTAL_CH, Math.round((pct / 100) * TOTAL_CH)));
      if (inputEl && inputEl.style) inputEl.style.setProperty('--val', pct + '%');
      const pctEl = document.getElementById('cmp-pct');
      if (pctEl) pctEl.textContent = pct + '%';
      const titleEl = document.getElementById('cmp-ch-title');
      if (titleEl) titleEl.textContent = chapterTitle();
      const subEl = document.getElementById('cmp-sub-meta');
      if (subEl) {
        if (state.variant === 'A') {
          const moved = state.chapter !== ORIGIN_CH || state.pct !== ORIGIN_PCT;
          subEl.innerHTML = `<span>第 ${state.chapter} / ${TOTAL_CH} 章</span>` + (moved
            ? `<button type="button" onclick="resetOrigin()" class="h-[18px] px-1.5 rounded-full inline-flex items-center gap-0.5 text-[10px] font-semibold rd-pressable" style="background:var(--rd-ctrl-circle);color:var(--rd-ctrl-primary);">${icon('undo', 10)}<span>返回原位</span></button>`
            : `<span>· 进度 ${state.pct}%</span>`);
        } else if (state.variant === 'C') {
          subEl.textContent = `第 ${state.chapter} / ${TOTAL_CH} 章`;
        }
      }
    };

    window.stepChapter = (delta) => {
      state.chapter = Math.max(1, Math.min(TOTAL_CH, state.chapter + delta));
      state.pct = Math.max(1, Math.min(100, Math.round((state.chapter / TOTAL_CH) * 100)));
      render();
    };

    window.resetOrigin = () => {
      state.chapter = ORIGIN_CH;
      state.pct = ORIGIN_PCT;
      render();
    };

    window.adjustBrightness = (e) => {
      const rect = e.currentTarget.getBoundingClientRect();
      state.brightness = Math.max(12, Math.min(100, Math.round((1 - (e.clientY - rect.top) / rect.height) * 100)));
      state.brightnessAuto = false;
      render();
    };

    render();
  </script>
</body>
</html>
