name: UI CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ui-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  assets:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.3
      - name: Standalone schemas and font integrity
        run: |
          python3 -m venv "$RUNNER_TEMP/ui-validate"
          "$RUNNER_TEMP/ui-validate/bin/pip" install -r scripts/ci-requirements.txt
          "$RUNNER_TEMP/ui-validate/bin/python" scripts/check-assets.py
          node --test scripts/check-theme.test.mjs
      - uses: ./.github/actions/source-hygiene
        if: always()
        with:
          directory: .
  ui-source-gate:
    name: ui-source-gate
    if: always()
    needs: assets
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          RESULT: ${{ needs.assets.result }}
        run: test "$RESULT" = success
